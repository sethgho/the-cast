<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard review</title>
<!--
  Reusable beat-locked storyboard reviewer.

  Feed it a JSON file (?data=whatever.json, default storyboard.json):

    {
      "title": "...", "audio": "song.mp3", "imageBase": "frames/",
      "shots": [
        { "id": "kf02_seth_enters", "start": 11.49, "end": 17.46,
          "first": "B1_prep.png", "last": "B2_prep.png",
          "frames": 158, "prompt": "…the H3 motion prompt…" }
      ]
    }

  The song is the clock. Whatever is playing decides which shot is on screen, so
  the review happens at performance speed rather than as a list of stills — that
  is the whole point, and it is why notes are timestamped to where you paused.

  Notes autosave to localStorage keyed by the data file, so a refresh, a closed
  tab or a dead battery does not cost you the pass.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#141413; color:#f5f4ee;
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid #2c2c2a; display:flex;
    gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:1.05rem; margin:0; letter-spacing:-.01em; }
  .meta { color:#a3a299; font-size:.85rem; }
  main { max-width:1180px; margin:0 auto; padding:20px; }
  .stage { position:relative; background:#000; border-radius:12px;
    overflow:hidden; aspect-ratio:16/9; }
  .stage img { width:100%; height:100%; object-fit:contain; display:block; }
  .stage img.b { position:absolute; inset:0; opacity:0; transition:opacity .25s; }
  .stage.showlast img.b { opacity:1; }
  .badge { position:absolute; left:12px; top:12px; background:#000a;
    padding:5px 10px; border-radius:7px; font:12px ui-monospace,monospace;
    color:#e8e7df; backdrop-filter:blur(4px); }
  .ab { position:absolute; right:12px; top:12px; background:#000a;
    padding:5px 10px; border-radius:7px; font:12px ui-monospace,monospace;
    color:#a3a299; backdrop-filter:blur(4px); }

  .transport { display:flex; gap:12px; align-items:center; margin:14px 0 4px; }
  button { background:#232322; color:#f5f4ee; border:1px solid #3a3a37;
    border-radius:8px; padding:8px 14px; font-size:.9rem; cursor:pointer; }
  button:hover { background:#2e2e2c; }
  button.primary { background:#3987e5; border-color:#3987e5; color:#fff; }
  button.primary:hover { background:#2f78d2; }
  .time { font:13px ui-monospace,monospace; color:#a3a299; min-width:104px; }

  .track { position:relative; height:44px; background:#1a1a19; border-radius:8px;
    border:1px solid #2c2c2a; overflow:hidden; cursor:pointer; margin-bottom:6px; }
  .seg { position:absolute; top:0; bottom:0; border-right:1px solid #141413; }
  .seg.noted { background:#3987e522; }
  .seg.cur { background:#3987e544; }
  .seg span { position:absolute; left:5px; top:4px; font:10px ui-monospace,monospace;
    color:#8a8981; pointer-events:none; white-space:nowrap; }
  .play-head { position:absolute; top:0; bottom:0; width:2px; background:#d95926;
    pointer-events:none; }

  .strip { display:flex; gap:6px; overflow-x:auto; padding:8px 0 12px; }
  .strip figure { margin:0; flex:0 0 128px; cursor:pointer; opacity:.5;
    transition:opacity .15s; }
  .strip figure.cur { opacity:1; }
  .strip img { width:128px; height:72px; object-fit:cover; border-radius:5px;
    border:2px solid transparent; display:block; }
  .strip figure.cur img { border-color:#3987e5; }
  .strip figure.noted img { border-color:#d95926; }
  .strip figcaption { font:10px ui-monospace,monospace; color:#8a8981;
    margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .notepane { display:grid; grid-template-columns:1fr 320px; gap:16px;
    margin-top:8px; }
  @media (max-width:820px) { .notepane { grid-template-columns:1fr; } }
  textarea { width:100%; min-height:132px; background:#1a1a19; color:#f5f4ee;
    border:1px solid #2c2c2a; border-radius:10px; padding:12px 14px;
    font:14px/1.5 ui-sans-serif,system-ui,sans-serif; resize:vertical; }
  textarea:focus { outline:2px solid #3987e5; outline-offset:-1px; }
  .side { background:#1a1a19; border:1px solid #2c2c2a; border-radius:10px;
    padding:12px 14px; font-size:.85rem; color:#c3c2b7; }
  .side h3 { margin:0 0 6px; font-size:.75rem; text-transform:uppercase;
    letter-spacing:.06em; color:#a3a299; }
  .side p { margin:0 0 10px; }
  .side .p { font:12px/1.5 ui-monospace,monospace; color:#a3a299;
    max-height:150px; overflow:auto; }
  .hint { color:#8a8981; font-size:.8rem; margin-top:8px; }
  kbd { background:#232322; border:1px solid #3a3a37; border-radius:4px;
    padding:1px 5px; font:11px ui-monospace,monospace; }
  dialog { background:#1a1a19; color:#f5f4ee; border:1px solid #3a3a37;
    border-radius:12px; padding:0; max-width:760px; width:92vw; }
  dialog header { border-bottom:1px solid #2c2c2a; }
  dialog .body { padding:16px 20px; }
  dialog textarea { min-height:340px; font:12px/1.5 ui-monospace,monospace; }
  dialog::backdrop { background:#000a; }
</style>

<header>
  <h1 id="title">Storyboard review</h1>
  <span class="meta" id="sub"></span>
</header>

<main>
  <div class="stage" id="stage">
    <img id="imgA" alt="">
    <img id="imgB" class="b" alt="">
    <div class="badge" id="badge">—</div>
    <div class="ab" id="ab">first frame</div>
  </div>

  <div class="transport">
    <button id="play" class="primary">▶ Play</button>
    <button id="prev">⤺ Shot</button>
    <button id="next">Shot ⤻</button>
    <span class="time" id="clock">0:00 / 0:00</span>
    <span style="flex:1"></span>
    <button id="export">Copy all notes →</button>
  </div>

  <div class="track" id="track"><div class="play-head" id="head"></div></div>
  <div class="strip" id="strip"></div>

  <div class="notepane">
    <div>
      <textarea id="note" placeholder="Notes on this shot — what to change, what to keep. Saved automatically."></textarea>
      <div class="hint">
        <kbd>Space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> previous/next shot ·
        <kbd>F</kbd> toggle first/last frame · <kbd>Esc</kbd> leave the note field.
        Playing pauses itself when you start typing.
      </div>
    </div>
    <div class="side">
      <h3>Shot</h3>
      <p id="shotmeta">—</p>
      <h3>Motion prompt</h3>
      <div class="p" id="shotprompt">—</div>
    </div>
  </div>
</main>

<dialog id="out">
  <header><h1>Notes to send back</h1></header>
  <div class="body">
    <textarea id="outtext" readonly></textarea>
    <div class="transport">
      <button id="copy" class="primary">Copy to clipboard</button>
      <button id="close">Close</button>
      <span class="meta" id="copied"></span>
    </div>
  </div>
</dialog>

<script>
const qs = new URLSearchParams(location.search);
const DATA = qs.get("data") || "storyboard.json";
let doc = null, shots = [], cur = -1, notes = {}, showLast = false;

const $ = id => document.getElementById(id);
const audio = new Audio();
const fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const storeKey = () => "storyboard:" + DATA;

function load() {
  try { notes = JSON.parse(localStorage.getItem(storeKey()) || "{}"); }
  catch { notes = {}; }
}
function save() { localStorage.setItem(storeKey(), JSON.stringify(notes)); }

// The shot on screen is whatever the song is currently inside. One source of
// truth — the audio clock — so scrubbing, playing and clicking all agree.
function shotAt(t) {
  for (let i = 0; i < shots.length; i++)
    if (t >= shots[i].start && t < shots[i].end) return i;
  return t >= (shots.at(-1)?.end ?? 0) ? shots.length - 1 : 0;
}

function render(i, force) {
  if (i === cur && !force) return;
  cur = i;
  const s = shots[i];
  $("imgA").src = doc.imageBase + s.first;
  $("imgB").src = doc.imageBase + (s.last || s.first);
  $("badge").textContent = `${i + 1}/${shots.length}  ${s.id}`;
  $("shotmeta").innerHTML =
    `<strong>${s.id}</strong><br>${s.start.toFixed(2)}s – ${s.end.toFixed(2)}s ` +
    `(${(s.end - s.start).toFixed(2)}s)` +
    (s.frames ? `<br>${s.frames} frames generated` : "");
  $("shotprompt").textContent = s.prompt || "—";
  $("note").value = notes[s.id]?.text || "";
  document.querySelectorAll(".strip figure").forEach((f, k) =>
    f.classList.toggle("cur", k === i));
  document.querySelectorAll(".seg").forEach((f, k) =>
    f.classList.toggle("cur", k === i));
}

function markNoted() {
  shots.forEach((s, k) => {
    const has = !!(notes[s.id]?.text || "").trim();
    document.querySelectorAll(".strip figure")[k]?.classList.toggle("noted", has);
    document.querySelectorAll(".seg")[k]?.classList.toggle("noted", has);
  });
}

// While the song plays it owns which shot is on screen. While it is PAUSED, an
// explicit pick wins — otherwise clicking a thumbnail before the audio has
// loaded silently snapped straight back to shot 1, because currentTime never
// moved and the clock kept re-deciding.
let pinned = null;

function tick() {
  const t = audio.currentTime;
  $("clock").textContent = `${fmt(t)} / ${fmt(doc.duration || audio.duration || 0)}`;
  $("head").style.left = (t / span() * 100) + "%";
  if (!audio.paused) pinned = null;
  render(pinned !== null ? pinned : shotAt(t));
  requestAnimationFrame(tick);
}
const span = () => doc.duration || shots.at(-1)?.end || audio.duration || 1;

function seekToShot(i) {
  i = Math.max(0, Math.min(shots.length - 1, i));
  pinned = i;
  try { audio.currentTime = shots[i].start + 0.001; } catch { /* not seekable yet */ }
  render(i, true);
}

// If a pick happened before the file was seekable, apply it once it is.
audio.addEventListener("loadedmetadata", () => {
  if (pinned !== null) audio.currentTime = shots[pinned].start + 0.001;
});

function buildStrip() {
  $("strip").innerHTML = "";
  $("track").querySelectorAll(".seg").forEach(e => e.remove());
  shots.forEach((s, i) => {
    const f = document.createElement("figure");
    f.innerHTML = `<img src="${doc.imageBase + s.first}" alt="">` +
      `<figcaption>${i + 1}. ${s.id.replace(/^kf\d+_/, "")}</figcaption>`;
    f.onclick = () => seekToShot(i);
    $("strip").append(f);

    const seg = document.createElement("div");
    seg.className = "seg";
    seg.style.left = (s.start / span() * 100) + "%";
    seg.style.width = ((s.end - s.start) / span() * 100) + "%";
    seg.innerHTML = `<span>${i + 1}</span>`;
    seg.onclick = e => { e.stopPropagation(); seekToShot(i); };
    $("track").append(seg);
  });
}

function exportNotes() {
  const lines = [
    `# Storyboard notes — ${doc.title}`,
    `Song: ${doc.audio} · ${shots.length} shots · reviewed against the rendered audio.`,
    ``,
    `Apply these notes to the shot list. Anything not mentioned stays as planned.`,
    ``,
  ];
  let n = 0;
  shots.forEach((s, i) => {
    const note = (notes[s.id]?.text || "").trim();
    if (!note) return;
    n++;
    const at = notes[s.id]?.at;
    lines.push(`## ${i + 1}. ${s.id}  (${s.start.toFixed(2)}s–${s.end.toFixed(2)}s)`);
    // Only report the pause point when it is genuinely inside this shot — a note
    // typed after jumping straight to a thumbnail has a clock reading that means
    // nothing, and a wrong timestamp is worse than none.
    if (at != null && at >= s.start && at < s.end) lines.push(`_paused at ${fmt(at)}_`);
    lines.push(note, ``);
  });
  if (!n) lines.push("_No notes recorded._");
  else lines.splice(2, 0, `${n} of ${shots.length} shots have notes.`);
  $("outtext").value = lines.join("\n");
  $("out").showModal();
}

// ---- wiring ----------------------------------------------------------------
$("play").onclick = () => audio.paused ? audio.play() : audio.pause();
audio.onplay = () => $("play").textContent = "❚❚ Pause";
audio.onpause = () => $("play").textContent = "▶ Play";
$("prev").onclick = () => seekToShot(cur - 1);
$("next").onclick = () => seekToShot(cur + 1);
$("track").onclick = e => {
  const r = $("track").getBoundingClientRect();
  const t = (e.clientX - r.left) / r.width * span();
  pinned = shotAt(t);
  try { audio.currentTime = t; } catch { /* not seekable yet */ }
};
$("export").onclick = exportNotes;
$("close").onclick = () => $("out").close();
$("copy").onclick = async () => {
  await navigator.clipboard.writeText($("outtext").value);
  $("copied").textContent = "copied";
  setTimeout(() => $("copied").textContent = "", 1800);
};

// Typing is a review action, so it stops the transport rather than fighting it.
$("note").onfocus = () => audio.pause();
$("note").oninput = () => {
  const s = shots[cur];
  notes[s.id] = { text: $("note").value, at: audio.currentTime };
  save(); markNoted();
};
$("note").onkeydown = e => { if (e.key === "Escape") $("note").blur(); };

addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowLeft") seekToShot(cur - 1);
  if (e.key === "ArrowRight") seekToShot(cur + 1);
  if (e.key.toLowerCase() === "f") {
    showLast = !showLast;
    $("stage").classList.toggle("showlast", showLast);
    $("ab").textContent = showLast ? "last frame" : "first frame";
  }
});

fetch(DATA).then(r => r.json()).then(d => {
  doc = d; shots = d.shots;
  document.title = `Storyboard — ${d.title}`;
  $("title").textContent = d.title;
  $("sub").textContent =
    `${shots.length} shots · ${(d.duration || shots.at(-1).end).toFixed(0)}s` +
    (d.tempo ? ` · ${d.tempo} BPM measured` : "");
  audio.src = d.audio;   // plain path, relative to this page
  audio.preload = "auto";
  load(); buildStrip(); markNoted(); render(0, true); tick();
}).catch(e => {
  document.body.innerHTML =
    `<main><h1>Could not load ${DATA}</h1><pre>${e}</pre></main>`;
});
</script>
</html>
