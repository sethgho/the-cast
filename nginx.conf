server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sheets keep stable URLs when regenerated, so the EDGE must revalidate often:
    # s-maxage=300 caps Cloudflare staleness at 5 minutes after a redesign, while
    # browsers may hold a day. Learned the hard way — a plain max-age=86400 left
    # the old cast pinned at the edge for a day with no purge permission on the
    # API token. Origin refetches are cheap; stale canon is not.
    #
    # CORS on the bytes too, not just the JSON: a consumer that draws a sheet or a
    # pose cutout into a <canvas> taints it without this, and every downstream
    # read of that canvas then fails.
    location ~* \.(png|jpg|jpeg|webp|svg|wav)$ {
        add_header Cache-Control "public, max-age=86400, s-maxage=300";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Every generated endpoint — /cast.json, /assets/index.json, /<id>/assets.json,
    # /<id>/voice.json, /style/vaudeville-1933.json, /schema/*.json.
    #
    # The JSON is the canon; the bytes are only what the canon points at. So the
    # same reasoning as above applies HARDER here, and the numbers are tighter:
    # s-maxage=60 at the edge, max-age=300 in the browser. A stale sheet is a
    # cosmetic regression. A stale cast.json points an agent at an asset that no
    # longer exists, or hides one that does — and that is the failure mode that
    # hurt before. One extra origin fetch a minute costs nothing.
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=300, s-maxage=60";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # /API.md and /style/vaudeville-1933.md. The style .md is the SOURCE the JSON
    # is projected from, so it is published alongside it — a consumer that wants
    # the reasoning rather than the prompt string can read it. default_type here
    # rather than a `types` block: a types block at server level REPLACES the
    # inherited mime map wholesale and would break every other content type.
    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=300, s-maxage=60";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
