server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sheets are stable URLs that change rarely; let Cloudflare and browsers hold
    # them for a day and revalidate cheaply after. Not immutable — a regenerated
    # sheet keeps the same URL on purpose.
    location ~* \.(png|jpg|webp)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location = /cast.json {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
