  const box = document.createElement("div");
  box.id = "tray";
  const entries = trayOf(tagName), dead = droppedOf(tagName);
  const head = document.createElement("div");
  head.innerHTML = "<b></b> <span></span>";
  head.querySelector("b").textContent = "orphan tray — " + entries.length +
    (entries.length === 1 ? " frame" : " frames");
  head.querySelector("span").className = "why0";
  head.querySelector("span").textContent = entries.length
    ? "a re-run could not match these to a new pick. Nothing is ever deleted; restore one onto a " +
      "live cell, or collect it by hand."
    : "empty — every frame this tag has ever had is either live or collected.";
  box.appendChild(head);

  for (const e of entries) {
    const d = document.createElement("div");
    d.className = "tray-e";
    if (e.png) {
      const im = document.createElement("img");
      im.src = imgUrl(e.png, 92);
      im.alt = "";
      // The drawing may be gone: a clip re-run deletes the repaints of frames that no longer
      // exist, and the entry outlives them on purpose. The facts are the payload; the picture is
      // a courtesy, so its absence hides the element instead of logging a broken image.
      im.onerror = () => { im.remove(); };
      d.appendChild(im);
    }
    const f = document.createElement("div");
    f.className = "facts";
    const t = srcTime(e.src);
    f.innerHTML = "<b></b><br><span class=\"e\"></span><span class=\"why\"></span>";
    f.querySelector("b").textContent = "frame " +
      (t === null ? e.src.split("/").pop() : frameName(t));
    f.querySelector(".e").textContent = editWords(e);
    f.querySelector(".why").textContent = e.why;

    const acts = document.createElement("div");
    acts.className = "acts";
    const pick = document.createElement("select");
    pick.title = "which live cell this edit should land on";
    CELLS().forEach((c, i) => {
      const o = document.createElement("option");
      o.value = String(i);
      const ct = srcTime(c.src);
      o.textContent = "cell " + (i + 1) + (ct === null ? "" : " · " + frameName(ct));
      pick.appendChild(o);
    });
    // Default to the live cell whose source frame is nearest in the clip. It is the cell this
    // edit was most likely meant for, and picking the first one instead would make the common
    // restore a two-step act with a wrong default in the middle of it.
    if (t !== null) {
      let best = 0, gap = Infinity;
      CELLS().forEach((c, i) => {
        const ct = srcTime(c.src);
        if (ct === null) return;
        if (Math.abs(ct - t) < gap) { gap = Math.abs(ct - t); best = i; }
      });
      pick.value = String(best);
    }
    const put = document.createElement("button");
    put.textContent = "Restore";
    put.title = "reattach this frame's hold and nudge to the chosen live cell";
    put.onclick = () => restoreOrphan(e.fid, parseInt(pick.value, 10));
    const bin = document.createElement("button");
    bin.textContent = "Collect";
    bin.title = "stop offering this one. Its id stays on the record with the reason.";
    bin.onclick = () => forgetOrphan(e.fid, t);
    acts.appendChild(pick);
    acts.appendChild(put);
    acts.appendChild(bin);
    f.appendChild(acts);
    d.appendChild(f);
    box.appendChild(d);
  }

  if (dead.length) {
    const n = document.createElement("div");
    n.className = "why0";
    // The third bucket, said out loud. It is what stops a re-pick resurrecting a cell somebody
    // deliberately removed, and it is the other half of the invariant the Durable Object asserts.
    n.textContent = dead.length + " frame" + (dead.length === 1 ? " is" : "s are") +
      " retired from this tag (dropped, restored or collected). A re-pick will not bring " +
      (dead.length === 1 ? "it" : "them") + " back.";
    box.appendChild(n);
  }
  return box;
}

function restoreOrphan(fid, index) {
  if (!Number.isInteger(index) || index < 0) return;
  mutate("/api/restore", {fid, index}, "restore onto cell " + (index + 1), "cells", [index]);
}

function forgetOrphan(fid, t) {
  if (!confirm("Collect the orphaned frame " + (t === null ? fid : frameName(t)) +
               "?\n\nIt stops being offered for restore. Nothing else changes.")) return;
  mutate("/api/forget", {fid}, "collect " + fid + " from the tray", "tag", []);
}

const packUnify = () => {
  const p = (ST.steps || []).find((x) => x.id === "pack");
  const t = p && p.params.tags.find((x) => x.name === tagName);
  return t ? t.unify : false;
};

// The first extracted frame of a tag, which is the clip's poster. Fetched once per tag and only
// when a clip or frames chip is actually opened.
const POSTER = new Map();
function warmPoster(tag) {
  if (POSTER.has(tag) || !AGENT) return;
  POSTER.set(tag, null);
  fetch(AGENT + "/frames?cid=" + cid + "&tag=" + tag)
    .then((r) => r.json())
    .then((d) => {
      const f = (d.frames || [])[0];
      if (!f) return;
      POSTER.set(tag, f);
      if (stepOpen === "clip" || stepOpen === "frames") renderInspector();
    })
    .catch(() => {});
}

// --- the cost receipt --------------------------------------------------------------------------
// Running a stale step is never one click. This is the confirmation, and it has to answer three
// questions before it earns one: what runs, how long it takes, and what happens to the hand edits
// under it. The third is the one a naive cascade gets wrong.
function downstreamOf(ids) {
  const all = ST.steps || [], kids = new Map();
  for (const s of all) {
    for (const e of s.inputs) {
      if (!e.from) continue;
      if (!kids.has(e.from)) kids.set(e.from, []);
      kids.get(e.from).push(s.id);
    }
  }
  const seen = new Set(ids), queue = [...ids];
  for (let i = 0; i < queue.length; i++) {
    for (const k of kids.get(queue[i]) || []) {
      if (!seen.has(k)) { seen.add(k); queue.push(k); }
    }
  }
  return all.filter((s) => seen.has(s.id));   // manifest order IS pipeline order
}

function handEdits(tagNames) {
  const out = {n: 0, rolls: 0, nudges: 0, holds: 0};
  for (const t of ST.tags) {
    if (!tagNames.includes(t.name)) continue;
    for (const c of t.cells) {
      let hit = false;
      if (c.seed !== BASE_SEED) { out.rolls++; hit = true; }
      if (c.pivot_nudge[0] || c.pivot_nudge[1]) { out.nudges++; hit = true; }
      if (c.hold > 1) { out.holds++; hit = true; }
      if (hit) out.n++;
    }
  }
  return out;
}

function about(secs) {
  if (secs < 90) return "about " + secs + "s";
  return "about " + Math.round(secs / 60) + " minutes";
}

// What a re-run of this kind does to the hand edits under it. Straight out of the design's
// "hand edits under a re-run": an edit is never deleted, it is either kept, re-matched, or
// visibly orphaned. Which of the three depends only on the KIND being re-run.
const FATE = {
  plate: ["ORPHANED to the tray",
    "a new clip is a new performance, so frame times no longer mean anything and nothing auto-matches"],
  clip: ["ORPHANED to the tray",
    "a new clip is a new performance, so frame times no longer mean anything and nothing auto-matches"],
  frames: ["MATCHED where the extraction comes back byte-identical, ORPHANED where it does not",
    "re-extracting an unchanged clip is free and keeps every edit; an extraction that really " +
    "moved means a new performance, and then nothing auto-matches"],
  picks: ["MATCHED by source-frame time, nearest index within ±3 frames",
    "anything unmatched goes to the tag's orphan tray — visible and restorable, never deleted"],
  repaint: ["KEPT",
    "same source frame, a new drawing, so the seed, the pivot and the hold survive by construction"],
  pack: ["SAFE", "the pack and the exports are pure functions of what is upstream"],
  export: ["SAFE", "the pack and the exports are pure functions of what is upstream"],
};

function editFate(kind, tags) {
  const e = handEdits(tags);
  const where = tags.length === ST.tags.length
    ? "across all " + tags.length + " tags" : "in " + tags.join(", ");
  const parts = [[e.rolls, "re-roll"], [e.nudges, "nudge"], [e.holds, "hold"]]
    .filter(([n]) => n).map(([n, w]) => n + " " + w + (n === 1 ? "" : "s")).join(", ");
  const [verb, why] = FATE[kind];
  if (!e.n) return "No hand edits " + where + ". A " + kind + " re-run would leave them " +
    verb + " — " + why + ".";
  return e.n + " hand edit" + (e.n === 1 ? " " : "s ") + where + " (" + parts + ") " +
    (e.n === 1 ? "is " : "are ") + verb + " — " + why + ".";
}

const NOT_YET = {
  plate: "a plate is uploaded, not computed — replace the file on wilson to change it",
  export: "an export is computed on request — use ↓ Export, it costs nothing",
};

function openReceipt(kind) {
  const list = stepsOf(kind);
  if (!list.length) return;
  const chain = downstreamOf(list.map((s) => s.id));
  const tags = [...new Set(chain.map((s) => s.tag).filter(Boolean))];
  const rows = [];
  let total = 0;
  for (const s of chain) {
    const k = s.kind + (s.tag ? "(" + s.tag + ")" : "");
    let r = rows.find((x) => x.k === k);
    if (!r) { r = {k, n: 0, cost: 0}; rows.push(r); }
    r.n++;
    r.cost += s.cost_s;
    total += s.cost_s;
  }
  const runnable = RUNNABLE.includes(kind);
  const paints = kind === "repaint"
    ? list.filter((s) => s.stale && s.built_key === null).length : 0;
  openOverlay("Run " + kind + (SCOPED.includes(kind) ? "(" + tagName + ")" : "") + " — the cost",
    (host) => {
      const box = document.createElement("div");
      box.id = "receipt";
      for (const r of rows) {
        const d = document.createElement("div");
        d.className = "row";
        d.innerHTML = "<b></b><span></span>";
        d.querySelector("b").textContent = r.k + (r.n > 1 ? " × " + r.n : "");
        d.querySelector("span").textContent = r.cost ? "~" + r.cost + "s" : "free";
        box.appendChild(d);
      }
      const tot = document.createElement("div");
      tot.className = "row tot";
      tot.innerHTML = "<b>in order, end to end</b><span></span>";
      tot.querySelector("span").textContent = about(total);
      box.appendChild(tot);

      const ed = document.createElement("div");
      ed.className = "edits";
      ed.textContent = editFate(kind, tags.length ? tags : ST.tags.map((t) => t.name));
      box.appendChild(ed);

      if (runnable && kind === "repaint") {
        const n = document.createElement("div");
        n.className = "why0";
        n.textContent = paints + " of those cells have no drawing on disk and will be painted. " +
          "The rest keep the drawing they have — the packer caches by file name, so a stale " +
          "drawing that already exists needs a re-roll, not a run.";
        box.appendChild(n);
      }
      if (!runnable) {
        const n = document.createElement("div");
        n.className = "no";
        n.textContent = NOT_YET[kind];
        box.appendChild(n);
      }

      const go = document.createElement("div");
      go.className = "go";
      const yes = document.createElement("button");
      yes.className = "cost";
      yes.textContent = "Run it";
      yes.disabled = !runnable;
      yes.title = runnable ? "queue it — one cancellable job" : NOT_YET[kind];
      yes.onclick = () => { closeOverlay(); runStep(kind); };
      const no = document.createElement("button");
      no.textContent = "Cancel";
      no.title = "change nothing";
      no.onclick = closeOverlay;
      go.appendChild(yes);
      go.appendChild(no);
      box.appendChild(go);
      host.appendChild(box);
    });
}

async function runStep(kind) {
  tick("queueing " + kind + "…");
  let j;
  try {
    const r = await fetch("/api/run", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({cid, kind, tag: tagName}),
    });
    j = await r.json();
    if (!r.ok || j.error) { tick(j.error || "the run was refused", true); return; }
  } catch (e) {
    tick("could not reach the editor service: " + e.message, true);
    return;
  }
  RUNS.set(j.job.id, kind);
  JOBS = JOBS.filter((x) => x.id !== j.job.id).concat([j.job]);
  tick(j.job.label + " — queued");
  renderRail();
  renderQueue();
}

// --- inspector ---------------------------------------------------------------------------------
function renderInspector() {
  const c = CUR();
  // A chip owns the inspector while it is open, replacing the CELL inspector — except where the
  // step's own editable param IS a cell fact: repaint's editable param is the seed, which is the
  // re-roll and the variant strip already on this panel, and picks needs the source frame it is
  // choosing. Those groups are reused rather than drawn twice.
  // The phone's Rail screen with nothing open is the rail and nothing else. The cell inspector
  // under it would be a second subject on a screen whose whole job is choosing one.
  const railOnly = phone && screenName === "rail" && !stepOpen;
  const hideCell = railOnly || (!!stepOpen && stepOpen !== "repaint");
  el("g-step").hidden = !stepOpen && !railOnly;
  el("g-prov").hidden = hideCell;
  el("g-var").hidden = hideCell;
  el("g-act").hidden = hideCell;
  if (stepOpen) {
    if (stepOpen === "clip" || stepOpen === "frames") warmPoster(tagName);
    renderStep(stepOpen);
  } else if (railOnly) {
    el("steplbl").textContent = "the pipeline";
    el("stepbody").textContent = "tap a chip for its params, its price and what re-running it " +
      "would do to the hand edits under it.";
  }
  if (!c) return;
  const pend = lockedHere(), fail = FAILS.get(key(tagName, sel));
  el("srcimg").src = imgUrl(c.src, 300);
  const m = c.metrics;
  el("facts").innerHTML =
    "source <b>" + c.src.split("/").pop() + "</b><br>seed <b>" + c.seed + "</b><br>" +
    (m ? "silhouette height <b>" + m.height + "</b>px<br>top clearance <b>" + m.top +
         "</b>px<br>feet <b>" + (m.feet > 0 ? "+" : "") + m.feet + "</b>px from ground (y=" +
         m.ground + ")"
       : "no packed cell in the atlas yet") +
    (fail ? '<br><span style="color:#e6a394">' + fail.error + "</span>" : "");

  const vs = c.variants || [], host = el("variants");
  host.innerHTML = "";
  for (const v of vs) {
    const b = document.createElement("button");
    b.className = "vthumb" + (v.png === c.png ? " on" : "");
    b.title = "use seed " + v.seed + " — free, no GPU ([ and ] step through these)";
    b.innerHTML = '<img src="' + imgUrl(v.png, 132) + '"><span>' +
                  (v.seed === 77 ? "77 first" : v.seed) + "</span>";
    b.disabled = pend || v.png === c.png;
    b.onclick = () => useVariant(v);
    host.appendChild(b);
  }
  if (!vs.length) {
    host.innerHTML = '<span style="color:var(--faint)">no repaints on disk for this source yet</span>';
  }

  // ONLY this cell's own mutations lock. Everything else — navigation, playback, onion, compare,
  // another cell's re-roll, the character switch — stays live while a job runs. That is the
  // difference between a queue and the modal wait this replaced.
  el("b-reroll").disabled = pend;
  el("b-repick").disabled = pend;
  el("b-drop").disabled = pend || CELLS().length <= 1;
}

// --- mutations ---------------------------------------------------------------------------------
// Every mutation commits to the manifest before it answers, so this returns in about 200ms and
// the job that follows is reconciliation. Nothing here waits for a paint.
async function mutate(url, body, label, scope, indices) {
  const op = url.slice(5);
  tick(label + " — committing…");
  let j;
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(Object.assign({cid, tag: tagName}, body)),
    });
    j = await r.json();
    if (!r.ok || j.error) { tick(j.error || "the request was refused", true); return null; }
  } catch (e) {
    tick("could not reach the editor service: " + e.message, true);
    return null;
  }
  revision = j.revision;
  // A param edit that owed no runnable work. The manifest has it, the steps it invalidated are
  // drawn stale, and the queue is untouched — which is the whole of "staleness never runs
  // anything" made visible.
  if (!j.job) {
    tick(label + " — recorded · what it invalidated is now stale, and nothing is queued");
    await reload(null, false);
    return null;
  }
  const id = j.job.id;
  const own = OWN.get(id) || {scope: "cells", tag: tagName, indices: new Set(), requests: []};
  // A coalesced repack carries several edits and the widest scope among them wins: one reorder in
  // the batch makes every cell of that tag provisional until the atlas is rebuilt.
  if (scope === "sheet" || (scope === "tag" && own.scope !== "sheet")) own.scope = scope;
  own.tag = tagName;
  for (const i of indices || []) own.indices.add(i);
  own.requests.push({url, body, label, scope, indices});
  OWN.set(id, own);
  JOBS = JOBS.filter((x) => x.id !== id).concat([j.job]);
  tick(label + " — " + (PRICE[op] ? "painting, " + PRICE[op] : "queued for the next repack"));
  // Re-read the manifest, not the images: the edit is already in it, and the drawing that follows
  // from it does not exist until the job reports. The cells stay on the art they have, under the
  // pending treatment — which is what "you are looking at what will be replaced" means.
  await reload(null, false);
  return j.job;
}

function reroll() {
  if (lockedHere()) { tick("that cell already has a job in flight", true); return; }
  mutate("/api/reroll", {index: sel}, "re-roll cell " + (sel + 1), "cells", [sel]);
}
function dropCell() {
  if (lockedHere()) { tick("that cell already has a job in flight", true); return; }
  if (CELLS().length <= 1) { tick("a tag cannot have zero cells", true); return; }
  mutate("/api/drop", {index: sel}, "drop cell " + (sel + 1), "tag", [sel]);
}
function useVariant(v) {
  const c = CUR();
  if (v.png === c.png || lockedHere()) return;
  mutate("/api/use", {index: sel, png: v.png}, "cell " + (sel + 1) + " on seed " + v.seed,
         "cells", [sel]);
}
function stepVariant(d) {
  const c = CUR(), vs = c.variants || [];
  if (vs.length < 2) { tick("this cell has only one painted seed", true); return; }
  const at = vs.findIndex((v) => v.png === c.png);
  useVariant(vs[(Math.max(0, at) + d + vs.length) % vs.length]);
}
function setHold(v) {
  const c = CUR();
  if (v < 1 || v === c.hold) return;
  if (lockedHere()) { tick("that cell already has a job in flight", true); return; }
  mutate("/api/hold", {index: sel, hold: v}, "cell " + (sel + 1) + " held " + v, "cells", [sel]);
}
function moveCell(d) {
  const from = sel, to = sel + d;
  if (to < 0 || to >= CELLS().length) return;
  if (lockedHere()) { tick("that cell already has a job in flight", true); return; }
  const order = CELLS().map((_, i) => i);
  [order[from], order[to]] = [order[to], order[from]];
  sel = to;
  mutate("/api/reorder", {order}, "move cell " + (from + 1) + " to " + (to + 1), "tag", [to]);
}
function nudge(dx, dy) {
  const c = CUR();
  if (lockedHere()) { tick("that cell already has a job in flight", true); return; }
  mutate("/api/pivot",
         {scope: "frame", index: sel, pivot_nudge: [c.pivot_nudge[0] + dx, c.pivot_nudge[1] + dy]},
         "nudge cell " + (sel + 1) + " by " + dx + "," + dy, "cells", [sel]);
}
el("b-reroll").onclick = reroll;
el("b-drop").onclick = dropCell;
el("b-repick").onclick = () => openRepick();

function postTagTiming() {
  const tag = TAG(), fps = parseInt(el("fps").value, 10), direction = el("direction").value;
  if (!Number.isInteger(fps) || fps < 1) {
    tick("fps must be a whole number greater than zero", true);
    el("fps").value = tag.fps;
    return;
  }
  if (fps === tag.fps && direction === tag.direction) return;
  mutate("/api/tag", {fps, direction}, tagName + " at " + fps + "fps " + direction, "tag", []);
}
el("fps").onchange = postTagTiming;
el("direction").onchange = postTagTiming;

// --- gestures on the strip -----------------------------------------------------------------------
// Duration is edited ON the strip, because a panel version made every timing change a trip away
// from the thing being timed. The width is optimistic and the mutation only fires on release, so
// a drag that ends where it started costs nothing.
function startHoldDrag(ev, i, c, box) {
  ev.stopPropagation();
  ev.preventDefault();
  ev.target.setPointerCapture(ev.pointerId);
  gesture = true;
  holdDrag = {i, from: ev.clientX, start: Math.max(1, c.hold), hold: Math.max(1, c.hold)};
  const move = (e) => {
    if (!holdDrag) return;
    const v = Math.max(1, holdDrag.start + Math.round((e.clientX - holdDrag.from) / HOLD_PX));
    if (v === holdDrag.hold) return;
    holdDrag.hold = v;
    box.style.width = (80 + (v - 1) * HOLD_PX) + "px";
    box.querySelector(".n").textContent = (i + 1) + (v > 1 ? " ×" + v : "");
    tick("cell " + (i + 1) + " held " + v + " beat" + (v === 1 ? "" : "s") + " — release to apply");
  };
  const up = () => {
    ev.target.removeEventListener("pointermove", move);
    ev.target.removeEventListener("pointerup", up);
    ev.target.removeEventListener("pointercancel", up);
    const d = holdDrag;
    holdDrag = null;
    gesture = false;
    suppressClick = true;
    if (!d || d.hold === d.start) { tick("ready"); renderStrip(null); return; }
    sel = d.i;
    setHold(d.hold);
  };
  ev.target.addEventListener("pointermove", move);
  ev.target.addEventListener("pointerup", up);
  ev.target.addEventListener("pointercancel", up);
}

// Reordering is a drag on the strip rather than the pair of move buttons it replaces: those could
// only ever move one place, and the keyboard does that better (Ctrl+arrows).
function startOrderDrag(ev, i, box) {
  if (ev.target.classList.contains("grip")) return;
  const from = ev.clientX;
  let armed = false;
  const boxes = () => Array.from(el("film").querySelectorAll(".fbox"));
  const overAt = (x) => boxes().find((b) => {
    const r = b.getBoundingClientRect();
    return x >= r.left && x <= r.right;
  });
  const move = (e) => {
    if (!armed && Math.abs(e.clientX - from) < 8) return;
    if (!armed) {
      armed = true;
      gesture = true;
      box.classList.add("drag");
      box.setPointerCapture(ev.pointerId);
    }
    const over = overAt(e.clientX);
    for (const b of boxes()) b.classList.toggle("dropzone", b === over && b !== box);
  };
  const up = (e) => {
    box.removeEventListener("pointermove", move);
    box.removeEventListener("pointerup", up);
    box.removeEventListener("pointercancel", up);
    if (!armed) return;
    gesture = false;
    suppressClick = true;
    for (const b of boxes()) b.classList.remove("drag", "dropzone");
    const over = overAt(e.clientX);
    const to = over ? +over.dataset.i : i;
    if (to === i) { renderStrip(null); return; }
    if (lockedHere()) { tick("that cell already has a job in flight", true); renderStrip(null); return; }
    const order = CELLS().map((_, k) => k);
    order.splice(i, 1);
    order.splice(to, 0, i);
    sel = to;
    mutate("/api/reorder", {order}, "move cell " + (i + 1) + " to " + (to + 1), "tag", [to]);
  };
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerup", up);
  box.addEventListener("pointercancel", up);
}

// --- dragging the pivot --------------------------------------------------------------------------
// One gesture, two operations, and a modifier says which — the two-button mode toggle this
// replaces charged a click for the common case, which is nudging one cell. Hold S for the SHEET
// pivot, the ground line the whole character is packed against.
function cellPoint(ev) {
  const r = el("cellcv").getBoundingClientRect();
  return [Math.round((ev.clientX - r.left) * ST.cell / r.width),
          Math.round((ev.clientY - r.top) * ST.cell / r.height)];
}
el("cellcv").addEventListener("pointerdown", (ev) => {
  // A one-pixel pivot under a thumb is a foot-gun, and every nudge costs a repack.
  if (phone) return;
  if (!ST || !CUR() || CUR().atlas === null) return;
  el("cellcv").setPointerCapture(ev.pointerId);
  drag = {from: cellPoint(ev), d: [0, 0], sheet: sheetDragKey};
  tick(drag.sheet ? "dragging the SHEET pivot — every cell of " + cid
                  : "nudging cell " + (sel + 1) + " only — hold S for the sheet pivot");
});
el("cellcv").addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const p = cellPoint(ev);
  drag.d = [p[0] - drag.from[0], p[1] - drag.from[1]];
  paintCell(CUR());
});
el("cellcv").addEventListener("pointercancel", () => { drag = null; paintCell(CUR()); });
el("cellcv").addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag.d, sheet = drag.sheet, c = CUR();
  drag = null;
  if (!d[0] && !d[1]) { paintCell(c); tick("ready"); return; }
  if (sheet) {
    mutate("/api/pivot", {scope: "sheet", pivot: [ST.pivot[0] + d[0], ST.pivot[1] + d[1]]},
           "sheet pivot — every cell of " + cid, "sheet", []);
  } else {
    nudge(d[0], d[1]);
  }
});

// --- the queue ------------------------------------------------------------------------------------
const liveJobs = () => JOBS.filter((j) => LIVE.includes(j.state));

function renderQueue() {
  const chip = el("queue"), live = liveJobs();
  const running = live.find((j) => j.state === "running" || j.state === "claimed");
  chip.className = FAILS.size ? "bad" : live.length ? "busy" : "";
  if (FAILS.size) {
    chip.textContent = "✖ " + FAILS.values().next().value.error;
  } else if (running) {
    const queued = live.length - 1;
    chip.textContent = "▶ " + running.label + (queued ? " · " + queued + " queued" : "");
  } else if (live.length) {
    chip.textContent = "● " + live.length + " queued";
  } else {
    chip.textContent = "queue idle";
  }
  if (queueOpen) renderQueuePop();
}

function renderQueuePop() {
  const pop = el("queuepop");
  pop.hidden = false;
  pop.innerHTML = "";
  const rows = JOBS.slice();
  // A failure is kept per CELL but is still one job, and the DO has already forgotten it.
  const seen = new Set(rows.map((j) => j.id));
  for (const [k, f] of FAILS) {
    if (seen.has(f.jobId)) continue;
    seen.add(f.jobId);
    rows.push({id: f.jobId, label: f.label, state: "failed", error: f.error, queuePos: null,
               elapsedMs: null, generates: false, failKey: k});
  }
  if (!rows.length) {
    pop.innerHTML = '<div style="color:var(--faint)">nothing queued — every edit is already in ' +
                    "the manifest</div>";
    return;
  }
  for (const j of rows) pop.appendChild(jobRow(j));
}

function jobRow(j) {
  const row = document.createElement("div");
  row.className = "job" + (j.state === "failed" ? " failed" : "");
  const who = document.createElement("div");
  who.className = "who";
  const secs = j.elapsedMs === null || j.elapsedMs === undefined
    ? "" : " · " + Math.round(j.elapsedMs / 1000) + "s";
  who.innerHTML = "<b></b><span></span>";
  who.querySelector("b").textContent = j.label;
  who.querySelector("span").textContent = j.state +
    (j.queuePos === null || j.queuePos === undefined ? "" : " #" + (j.queuePos + 1)) + secs +
    (j.generates ? " · GPU" : "") + (j.error ? " · " + j.error : "");
  row.appendChild(who);
  if (j.state === "failed") {
    if (OWN.has(j.id)) {
      const retry = document.createElement("button");
      retry.className = "cost";
      retry.textContent = "Retry";
      retry.title = "run the same edits again";
      retry.onclick = () => retryJob(j.id);
      row.appendChild(retry);
    }
    const dismiss = document.createElement("button");
    dismiss.textContent = "Cancel";
    dismiss.title = "clear the badge and leave the manifest as it is";
    dismiss.onclick = () => forgetFailure(j.id);
    row.appendChild(dismiss);
  } else if (LIVE.includes(j.state)) {
    const b = document.createElement("button");
    b.textContent = "Cancel";
    b.title = j.state === "queued" ? "remove it and put the manifest back (X)"
                                   : "ask the agent to stop at its next heartbeat";
    b.onclick = () => cancelJob(j.id);
    row.appendChild(b);
  }
  return row;
}

function forgetFailure(id) {
  for (const [k, f] of [...FAILS]) if (f.jobId === id) FAILS.delete(k);
  OWN.delete(id);
  JOBS = JOBS.filter((x) => x.id !== id);
  paint(null);
}

async function cancelJob(id) {
  let j;
  try {
    const r = await fetch("/api/job/" + id + "/cancel?cid=" + cid, {method: "POST"});
    j = await r.json();
    if (!r.ok || j.error) { tick(j.error || "the cancel was refused", true); return; }
  } catch (e) {
    tick("could not reach the editor service: " + e.message, true);
    return;
  }
  tick(j.reverted ? "cancelled — the manifest went back" : "asked the agent to stop");
  OWN.delete(id);
  JOBS = JOBS.filter((x) => x.id !== id);
  await reload(null, true);
}

function cancelNewestQueued() {
  const q = liveJobs().filter((j) => j.state === "queued");
  if (!q.length) { tick("nothing queued to cancel", true); return; }
  cancelJob(q[q.length - 1].id);
}

async function retryJob(id) {
  const own = OWN.get(id);
  if (!own) return;
  const requests = own.requests;
  forgetFailure(id);
  for (const req of requests) await mutate(req.url, req.body, "retry: " + req.label, req.scope, req.indices);
}

el("queue").onclick = () => {
  // On the phone the queue is a screen, not a popover: the chip is the way into it.
  if (phone) { setScreen("queue"); return; }
  queueOpen = !queueOpen;
  el("queuepop").hidden = !queueOpen;
  if (queueOpen) renderQueuePop();
};

// --- polling ---------------------------------------------------------------------------------
// 1.5s, no websockets. The DO keeps a finished job visible for about thirty seconds, which is
// what makes a completion something you SEE rather than something you infer from a redraw.
async function pollJobs() {
  let got;
  try {
    const r = await fetch("/api/jobs?cid=" + cid);
    got = await r.json();
    if (got.error) return;
  } catch (e) {
    return;
  }
  const before = new Map(JOBS.map((j) => [j.id, j.state]));
  JOBS = got.jobs;
  revision = got.revision;
  const finished = JOBS.filter((j) => {
    const was = before.get(j.id);
    return was && LIVE.includes(was) && !LIVE.includes(j.state);
  });
  const forced = [];
  for (const j of finished) {
    const own = OWN.get(j.id);
    const tag = own ? own.tag : j.tag;
    // A repack that reordered or dropped re-seats every cell after the splice, so the whole tag's
    // crops are new even though one index was reported.
    if (own && own.scope === "sheet") {
      for (const t of ST.tags) t.cells.forEach((_, i) => forced.push(cid + "|" + t.name + "|" + i));
    } else if (own && own.scope === "tag") {
      const t = ST.tags.find((x) => x.name === tag);
      if (t) t.cells.forEach((_, i) => forced.push(cid + "|" + tag + "|" + i));
    } else if (own) {
      for (const i of own.indices) forced.push(cid + "|" + tag + "|" + i);
    }
    if (j.tag && j.index !== null) forced.push(cid + "|" + j.tag + "|" + j.index);

    if (j.state === "failed") {
      const rec = {error: j.error || "the job failed", jobId: j.id, label: j.label};
      // The badge is per CELL, so a failure is visible where the work was going to land and not
      // only in a chip at the other end of the screen.
      const cells = own ? [...own.indices] : (j.index === null ? [] : [j.index]);
      if (cells.length) for (const i of cells) FAILS.set(cid + "|" + tag + "|" + i, rec);
      else if (tag) FAILS.set(cid + "|" + tag + "|0", rec);
      tick(j.label + " failed — " + rec.error, true);
    } else {
      if (j.state === "done") tick(j.label + " — done");
      OWN.delete(j.id);
    }
  }
  if (finished.length) {
    // The atlas is overwritten in place by the packer, so it is the one image that must be
    // refetched on every completion. The cells are not: `adopt` bumps only the ones that moved.
    atlasVer++;
    await reload(forced, true);
  } else if (revision > seenRevision) {
    // Somebody else edited this character — another browser, or a cancel that put the manifest
    // back. Take the new manifest without disturbing anything on this screen.
    await reload(null, true);
  } else {
    const fp = uiFingerprint();
    if (fp !== lastUi) {
      lastUi = fp;
      renderRail();
      renderStrip(null);
      renderInspector();
    }
    renderQueue();
  }
}

// --- overlays ---------------------------------------------------------------------------------
function openOverlay(title, build) {
  overlay = title;
  const modal = el("modal");
  modal.innerHTML = "<h3></h3>";
  modal.querySelector("h3").textContent = title;
  build(modal);
  el("scrim").hidden = false;
}
function closeOverlay() {
  overlay = null;
  el("scrim").hidden = true;
  el("modal").innerHTML = "";
}
el("scrim").onclick = (ev) => { if (ev.target === el("scrim")) closeOverlay(); };

// Re-pick is a modal because the source directory holds hundreds of frames: inline, it pushed
// every other control off the screen the moment it opened.
//
// It is also the only place this tool scrubs SOURCE footage, and it does it with images. The clip
// these frames came from is an mp4, and seeking an mp4 on a phone means iOS takes the element
// fullscreen, forces its own controls and decodes to every keyframe on the way — the scrub Seth
// called clunky. Every frame is already a PNG in the pick directory and the agent already serves
// it, so the scrubber is a range over the frame list, a big <img> that is swapped, and a lazy
// strip of thumbnails. Nothing here loads a video.
function openRepick() {
  if (lockedHere()) { tick("that cell already has a job in flight", true); return; }
  const cur = CUR().src, at = sel;
  openOverlay("Re-pick the source frame · ~45s GPU", (host) => {
    const fs = document.createElement("div");
    fs.id = "fs";
    fs.innerHTML =
      '<div id="fs-stage"><img id="fs-big" alt="source frame"></div>' +
      '<div id="fs-meta">loading source frames…</div>' +
      '<input id="fs-range" type="range" min="0" max="0" value="0" ' +
      'title="scrub the extracted frames — no video is seeked">' +
      '<div class="picks"></div>';
    host.appendChild(fs);
    const big = fs.querySelector("#fs-big"), meta = fs.querySelector("#fs-meta");
    const range = fs.querySelector("#fs-range"), box = fs.querySelector(".picks");
    const use = document.createElement("button");
    use.className = "cost";
    use.id = "fs-use";
    use.disabled = true;
    use.innerHTML = 'Use this frame <span class="price">· ~45s GPU</span>';
    fs.appendChild(use);

    fetch(AGENT + "/frames?cid=" + cid + "&tag=" + tagName)
      .then((r) => r.json())
      .then((d) => {
        const frames = d.frames || [];
        if (!frames.length) { meta.textContent = "no source frames on disk for this tag"; return; }
        const at0 = frames.indexOf(cur);
        // Held so a scrub does not go back to the network for a frame it just left, and so the
        // next one either side is already decoded when the thumb gets there.
        const warm = new Map();
        const preload = (i) => {
          const f = frames[i];
          if (!f || warm.has(f)) return;
          const im = new Image();
          im.src = imgUrl(f, 512);
          warm.set(f, im);
        };
        let focus = at0 >= 0 ? at0 : 0;
        const figs = [];
        const offset = (i) => (at0 < 0 || i === at0 ? "" :
                               " " + (i > at0 ? "+" : "\u2212") + Math.abs(i - at0));

        function setFocus(i, scroll) {
          focus = Math.max(0, Math.min(frames.length - 1, i));
          const f = frames[focus];
          big.src = imgUrl(f, 512);
          range.value = String(focus);
          meta.innerHTML = "";
          meta.appendChild(document.createTextNode(
            f.split("/").pop().replace(".png", "") + " · frame " + (focus + 1) + " of " +
            frames.length + (focus === at0 ? " · the one this cell uses" : offset(focus))));
          figs.forEach((fig, n) => fig.classList.toggle("on", n === focus));
          use.disabled = focus === at0;
          use.title = focus === at0 ? "this cell already uses that frame"
                                    : "paint cell " + (at + 1) + " from this frame";
          for (const d2 of [-2, -1, 1, 2]) preload(focus + d2);
          if (scroll && figs[focus]) figs[focus].scrollIntoView({block: "nearest", inline: "center"});
        }

        box.textContent = "";
        frames.forEach((f, i) => {
          const fig = document.createElement("figure");
          if (i === at0) fig.className = "cur";
          // Lazy and intrinsically sized: sixty-odd decodes on open is what made the modal stall,
          // and a thumbnail without dimensions reflows the strip as each one lands.
          fig.innerHTML = '<img loading="lazy" decoding="async" width="92" height="92" src="' +
                          imgUrl(f, 96) + '"><figcaption></figcaption>';
          const cap = fig.querySelector("figcaption");
          cap.textContent = f.split("/").pop().replace(".png", "").replace("f_", "");
          // A re-pick is nearly always a step or two either side of where you are, so the
          // distance from the current frame is more use than the absolute frame number.
          if (offset(i)) {
            const off = document.createElement("span");
            off.className = "off";
            off.textContent = offset(i);
            cap.appendChild(off);
          }
          // A tap focuses, it does not spend. One mis-tap on a phone would otherwise cost 45
          // seconds of GPU and a repack, so committing is its own button.
          fig.onclick = () => setFocus(i, false);
          figs.push(fig);
          box.appendChild(fig);
        });
        range.max = String(frames.length - 1);
        range.oninput = () => setFocus(parseInt(range.value, 10) || 0, true);
        use.onclick = () => {
          const f = frames[focus];
          closeOverlay();
          mutate("/api/repick", {index: at, src: f}, "re-pick cell " + (at + 1), "cells", [at]);
        };
        // Sixty-odd thumbnails scroll well past the fold, so the one you are replacing is usually
        // off screen when the modal opens. Put it in front of the eye.
        setFocus(focus, true);
      })
      .catch((e) => { meta.textContent = "could not list the source frames: " + e.message; });
  });
}

function openExport() {
  openOverlay("Export", (host) => {
    const box = document.createElement("div");
    box.className = "dls";
    const base = ST.outdir + "/" + cid;
    for (const [path, label] of [[base + ".png", "atlas PNG"], [base + ".json", "frame table JSON"]]) {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = imgUrl(path) + "&dl=1";
      a.download = path.split("/").pop();
      a.textContent = "↓ " + label;
      box.appendChild(a);
    }
    // The server names and types each file, so these are plain links. The EMPTY download
    // attribute keeps the filename the server chose while marking the click as a download —
    // without it the browser aborts the navigation once the attachment header arrives, and every
    // export shows up in the network log as a failed request.
    for (const [fmt, label] of [["json-hash", "JSON hash"], ["json-array", "JSON array"],
                                ["phaser3", "Phaser 3"], ["godot", "Godot SpriteFrames"],
                                ["css", "CSS steps()"]]) {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = AGENT + "/export?cid=" + cid + "&format=" + fmt;
      a.download = "";
      a.textContent = "↓ " + label;
      box.appendChild(a);
    }
    const demo = document.createElement("a");
    demo.className = "btn";
    demo.href = "http://wilson/cast-fighter.html";
    demo.target = "_blank";
    demo.textContent = "↗ play it in the demo";
    box.appendChild(demo);
    host.appendChild(box);
  });
}

const SHORTCUTS = [
  ["← →  ,  .", "step cell"], ["Home / End", "first / last cell"],
  ["1 … 7", "tag"], ["Tab", "character"],
  ["Space", "play / pause"], ["Enter", "play from the start"],
  ["[  ]", "previous / next variant"], ["+  -", "hold ±1"],
  ["Ctrl+← →", "move the cell"], ["Alt+arrows", "nudge the pivot 1px"],
  ["Shift+Alt+arrows", "nudge the pivot 10px"], ["S + drag", "drag the SHEET pivot"],
  ["O", "onion skin"], ["Shift+O", "alpha / outline / difference"],
  ["G / Shift+G", "ghost previous / next"], ["C", "compare"], ["Shift+C", "pin the compare cell"],
  ["R", "re-roll · ~45s GPU"], ["P", "re-pick · ~45s GPU"],
  ["Shift+Delete", "drop the cell"], ["X", "cancel the newest queued job"],
  ["\\", "inspector"], ["Ctrl/Cmd+E", "export"], ["Esc", "close, then cancel, then stop"],
  ["?", "this list"],
];
function openHelp() {
  openOverlay("Shortcuts", (host) => {
    const g = document.createElement("div");
    g.className = "keys";
    for (const [k, what] of SHORTCUTS) {
      const kb = document.createElement("kbd");
      kb.textContent = k;
      const s = document.createElement("span");
      s.textContent = what;
      g.appendChild(kb);
      g.appendChild(s);
    }
    host.appendChild(g);
  });
}
el("b-export").onclick = openExport;
el("b-help").onclick = openHelp;
el("insptoggle").onclick = () => toggleInspector();
function toggleInspector() {
  if (phone) return;                  // the phone has no inspector to collapse; Cells IS it
  handCollapse = !document.body.classList.contains("noinsp");
  document.body.classList.toggle("noinsp", handCollapse);
}

// --- keyboard ----------------------------------------------------------------------------------
// Nothing fires while a field has focus, or Space would type into the fps box and an arrow would
// silently change its value.
function typing(t) {
  return !!t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA" ||
                 t.isContentEditable);
}
addEventListener("keyup", (ev) => { if (ev.key === "s" || ev.key === "S") sheetDragKey = false; });
addEventListener("keydown", (ev) => {
  if (typing(ev.target)) return;
  if (ev.key === "s" || ev.key === "S") { sheetDragKey = true; return; }
  if (ev.key === "Escape") {
    ev.preventDefault();
    // In order: whatever is on top, then the gesture in progress, then the loop. Any other order
    // and Esc stops playback while a modal is still covering the screen.
    if (overlay) closeOverlay();
    else if (queueOpen) { queueOpen = false; el("queuepop").hidden = true; }
    else if (drag || holdDrag) { drag = null; holdDrag = null; gesture = false; paint(null); }
    else pause();
    return;
  }
  if (!ST) return;
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && (ev.key === "e" || ev.key === "E")) { ev.preventDefault(); openExport(); return; }
  if (mod && ev.key === "ArrowLeft") { ev.preventDefault(); moveCell(-1); return; }
  if (mod && ev.key === "ArrowRight") { ev.preventDefault(); moveCell(1); return; }
  if (mod) return;
  if (ev.altKey) {
    const step = ev.shiftKey ? 10 : 1;
    const d = {ArrowLeft: [-step, 0], ArrowRight: [step, 0],
               ArrowUp: [0, -step], ArrowDown: [0, step]}[ev.key];
    if (d) { ev.preventDefault(); nudge(d[0], d[1]); }
    return;
  }
  const k = ev.key;
  if (k === "ArrowLeft" || k === ",") { ev.preventDefault(); stepSelection(-1); }
  else if (k === "ArrowRight" || k === ".") { ev.preventDefault(); stepSelection(1); }
  else if (k === "Home") { ev.preventDefault(); selectCell(0); }
  else if (k === "End") { ev.preventDefault(); selectCell(CELLS().length - 1); }
  else if (k >= "1" && k <= "7" && ST.tags[+k - 1]) { ev.preventDefault(); selectTag(ST.tags[+k - 1].name); }
  else if (k === "Tab") {
    ev.preventDefault();
    const at = ST.characters.indexOf(cid);
    switchCharacter(ST.characters[(at + 1) % ST.characters.length]);
  } else if (k === " ") {
    ev.preventDefault();
    if (seq.length) { playing = !playing; retime(); }
  } else if (k === "Enter") {
    ev.preventDefault();
    head = 0;
    playing = true;
    retime();
    syncScrub();
  } else if (k === "[") { ev.preventDefault(); stepVariant(-1); }
  else if (k === "]") { ev.preventDefault(); stepVariant(1); }
  else if (k === "+" || k === "=") { ev.preventDefault(); setHold(CUR().hold + 1); }
  else if (k === "-" || k === "_") { ev.preventDefault(); setHold(CUR().hold - 1); }
  else if (k === "o") { ev.preventDefault(); onion.on = !onion.on; renderStage(); }
  else if (k === "O") { ev.preventDefault(); cycleOnionMode(); }
  else if (k === "g") { ev.preventDefault(); onion.prev = !onion.prev; onion.on = true; renderStage(); }
  else if (k === "G") { ev.preventDefault(); onion.next = !onion.next; onion.on = true; renderStage(); }
  else if (k === "c") { ev.preventDefault(); toggleCompare(); }
  else if (k === "C") { ev.preventDefault(); pinHere(); }
  else if (k === "r" || k === "R") { ev.preventDefault(); reroll(); }
  else if (k === "p" || k === "P") { ev.preventDefault(); openRepick(); }
  else if (k === "Delete" && ev.shiftKey) { ev.preventDefault(); dropCell(); }
  else if (k === "x" || k === "X") { ev.preventDefault(); cancelNewestQueued(); }
  else if (k === "\\") { ev.preventDefault(); toggleInspector(); }
  else if (k === "?") { ev.preventDefault(); openHelp(); }
});

// --- fitting ----------------------------------------------------------------------------------
// Below the minimum useful window the inspector goes first, and Preview becomes a
// picture-in-picture rather than disappearing. Below PHONE_MAX neither of those applies: the
// layout is not a squeezed editor, it is three screens.
// Four screens on the phone, not three. The rail is its own, which is what DESIGN-pipeline.md's
// mobile section asks for: it is a decision surface — seven prices and a Run — and folding it into
// Preview would put a costed button on the screen a person is using to watch a loop.
const SCREENS = ["preview", "rail", "cells", "queue"];

function setScreen(name) {
  if (!SCREENS.includes(name)) return;
  screenName = name;
  for (const b of el("screens").querySelectorAll("button"))
    b.classList.toggle("on", b.dataset.s === name);
  for (const s of SCREENS) document.body.classList.toggle("ph-" + s, phone && s === name);
  if (phone) {
    queueOpen = name === "queue";
    el("queuepop").hidden = !queueOpen;
    if (queueOpen) renderQueuePop();
  }
  if (!ST) return;
  // A canvas that was display:none measured zero, so whatever screen just appeared has to be
  // drawn again at the size it actually got.
  if (name === "cells") { renderStrip(null); scrollSelectionIntoView(); }
  renderStage();
  renderInspector();
}
for (const b of el("screens").querySelectorAll("button")) b.onclick = () => setScreen(b.dataset.s);

function fit() {
  const was = phone;
  phone = innerWidth < PHONE_MAX;
  const pop = el("queuepop");
  if (phone) {
    // The desktop's two narrow-window tricks are wrong here: PiP takes the preview out of flow on
    // top of the strip, and `noinsp` deletes the only place a phone can re-roll from.
    document.body.classList.remove("noinsp", "pip");
    if (pop.parentNode !== el("app")) el("app").appendChild(pop);
    if (was !== phone) { compare = false; drag = null; holdDrag = null; gesture = false; }
    if (was !== phone || !document.body.classList.contains("ph-" + screenName)) {
      if (ST) paint(null);            // the strip is rebuilt without its grips
      setScreen(screenName);
    }
    return;
  }
  if (pop.parentNode !== document.body) document.body.appendChild(pop);
  if (was !== phone) {
    for (const s of SCREENS) document.body.classList.remove("ph-" + s);
    queueOpen = false;
    pop.hidden = true;
    if (ST) paint(null);
  }
  // An open chip pins the inspector open: it is where the step panel is drawn, and a chip whose
  // panel is auto-collapsed away is a dead click.
  document.body.classList.toggle("noinsp", !stepOpen && (handCollapse || innerWidth < 1180));
  document.body.classList.toggle("pip", el("stage").clientWidth < 760);
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe(el("stage"));

// --- boot ------------------------------------------------------------------------------------
(async function boot() {
  try {
    await reload(null, false);
    tick("ready — press ? for the shortcuts");
  } catch (e) {
    tick(e.message, true);
    return;
  }
  fit();
  if (phone) setScreen(screenName);
  const loop = async () => {
    // A dropped poll costs one interval and never the page: the manifest is the record, and the
    // next tick reads it again.
    try { await pollJobs(); } catch (e) { tick("poll failed: " + e.message, true); }
    setTimeout(loop, 1500);
  };
  loop();
})();
</script>
