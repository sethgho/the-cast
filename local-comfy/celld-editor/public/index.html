<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprite cell editor</title>
<style>
  /* An EDITOR shell, not a document: the viewport is the frame, nothing outside it scrolls, and
     the centre stage is the only region that takes the slack. Spacing is on a 4/8px rhythm. */
  :root {
    color-scheme: dark;
    --bg: #14120f; --ink: #e8e2d8; --dim: #8d8371; --faint: #6b6152;
    --gold: #d8a657; --rust: #b4462f; --cream: #efe9d8;
    --panel: #1a1713; --sunk: #221d17; --line: #332e27;
    --insp: 320px;
    --strip: 128px;
  }
  * { box-sizing: border-box; }
  /* Author rules beat the UA stylesheet whatever the specificity, so `canvas { display: block }`
     silently defeated the `hidden` attribute on the compare canvas. */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--ink);
         font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body.noinsp { --insp: 0px; }

  #app { height: 100%; display: grid;
         grid-template-columns: minmax(0, 1fr) var(--insp);
         grid-template-rows: 48px auto auto minmax(0, 1fr); }

  /* --- top bar ---------------------------------------------------------------------------- */
  #topbar { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px;
            padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--line);
            min-width: 0; }
  .rail { display: flex; gap: 4px; align-items: center; flex: none; }
  .sep { width: 1px; height: 24px; background: var(--line); flex: none; }
  .grow { flex: 1 1 auto; min-width: 0; }

  button, .btn { font: 600 11px/1 ui-monospace, monospace; color: var(--ink);
                 background: var(--sunk); border: 1px solid var(--line); border-radius: 4px;
                 padding: 6px 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--gold); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button.on { background: var(--gold); color: #1a1610; border-color: var(--gold); }
  button:disabled { opacity: .34; cursor: not-allowed; }
  /* Rust is reserved for money. A rust border means this click costs GPU time. */
  button.cost { border-color: var(--rust); }
  button.cost:hover:not(:disabled) { background: var(--rust); color: #fff; }
  .price { color: var(--rust); font-weight: 400; }

  .tagchip { display: flex; align-items: center; gap: 5px; padding: 5px 7px; }
  .tagchip i { width: 8px; height: 8px; border-radius: 2px; display: block; }
  .tagchip.on { background: var(--gold); color: #1a1610; }

  #queue { display: flex; align-items: center; gap: 6px; min-width: 168px; justify-content: center;
           white-space: nowrap; overflow: hidden; }
  #queue.busy { border-color: var(--gold); color: var(--gold); }
  #queue.bad { border-color: var(--rust); color: #e6a394; }
  #ticker { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding-left: 4px; }
  #ticker.err { color: #e6a394; }

  /* --- the pipeline rail ------------------------------------------------------------------ */
  /* Seven chips reading left to right, which is the order the work happens in. It is a STRIP and
     not a graph: the wiring is fixed (DESIGN-pipeline.md), so drawing it as a canvas would be a
     worse tool and ten times the work. */
  #pipe { grid-column: 1 / 3; display: flex; align-items: center; gap: 2px; padding: 5px 8px;
          background: var(--panel); border-bottom: 1px solid var(--line);
          overflow-x: auto; scrollbar-width: none; }
  #pipe::-webkit-scrollbar { display: none; }
  .pchip { display: flex; align-items: center; gap: 6px; padding: 5px 8px; flex: none; }
  .pchip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
  .pchip.fresh .dot { background: #6f9a5e; }
  .pchip.stale .dot { background: var(--rust); }
  .pchip.running .dot { background: var(--gold); animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 50% { opacity: .2; } }
  .pchip .ptag { font-weight: 400; color: var(--faint); }
  .pchip.on .ptag, .pchip.on .price, .pchip.on .free { color: #4a3a18; }
  .pchip .free { color: var(--faint); font-weight: 400; }
  .parrow { color: var(--faint); flex: none; font-size: 13px; }

  /* --- a step in the inspector ------------------------------------------------------------ */
  .srow { margin-bottom: 8px; }
  .srow > label { display: block; color: var(--dim); margin-bottom: 3px; }
  .srow textarea { width: 100%; min-height: 92px; resize: vertical;
                   font: 11px/1.4 ui-monospace, monospace; color: var(--ink);
                   background: var(--sunk); border: 1px solid var(--line); border-radius: 4px;
                   padding: 5px; }
  .srow input[type=number], .srow select { width: 100%; }
  .srow .check { display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .srow .check input { width: auto; }
  /* Locked is not disabled-looking for decoration: there is no control here at all, because
     overriding a measured constant is meant to be an explicit named deviation and this stage
     does not build one. */
  .lock { border-left: 2px solid var(--line); padding: 0 0 0 7px; margin-bottom: 8px;
          color: var(--faint); }
  .lock b { color: var(--dim); font-weight: 700; }
  .lock .why { display: block; font-style: italic; margin-top: 2px; }
  .lock .txt { display: block; margin-top: 3px; color: var(--faint); max-height: 88px;
               overflow-y: auto; background: var(--sunk); border-radius: 3px; padding: 4px; }
  #stepart { display: block; width: 100%; height: 132px; object-fit: contain;
             background: var(--cream); border-radius: 4px; margin-bottom: 6px; }
  .why0 { color: var(--faint); font-style: italic; margin-top: 4px; }

  /* --- the orphan tray -------------------------------------------------------------------- */
  /* It sits in the Picks panel and not behind a disclosure, because an edit that is only visible
     to whoever thinks to open a drawer is an edit that was silently eaten. */
  #tray { margin: 8px 0 2px; }
  #tray > b { color: var(--gold); }
  .tray-e { display: flex; gap: 6px; margin-top: 5px; padding: 5px; background: var(--sunk);
            border: 1px solid var(--line); border-left: 2px solid var(--gold); border-radius: 4px; }
  .tray-e img { width: 46px; height: 46px; object-fit: contain; flex: none;
                background: var(--cream); border-radius: 3px; }
  .tray-e .facts { flex: 1 1 auto; min-width: 0; color: var(--dim); line-height: 1.45; }
  .tray-e .facts b { color: var(--ink); font-weight: 700; }
  .tray-e .why { display: block; font-style: italic; color: var(--faint); }
  .tray-e .acts { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
  .tray-e select { flex: 1 1 90px; min-width: 0; }
  .pchip .orph { background: var(--gold); color: #241c12; border-radius: 7px; padding: 0 5px;
                 font-weight: 700; margin-left: 3px; }

  /* --- the cost receipt ------------------------------------------------------------------- */
  #receipt { max-width: 560px; }
  #receipt .row { display: flex; gap: 8px; border-top: 1px solid var(--line); padding: 5px 0; }
  #receipt .row:first-of-type { border-top: 0; }
  #receipt .row b { color: var(--ink); font-weight: 700; flex: 1 1 auto; }
  #receipt .row span { color: var(--dim); white-space: nowrap; }
  #receipt .tot { border-top: 1px solid var(--gold); padding-top: 6px; margin-top: 2px;
                  color: var(--gold); font-weight: 700; }
  #receipt .edits { margin: 8px 0; padding: 6px; background: var(--sunk); border-radius: 4px;
                    color: var(--ink); line-height: 1.5; }
  #receipt .no { color: #e6a394; margin: 8px 0; }
  #receipt .go { display: flex; gap: 6px; margin-top: 10px; }

  /* --- filmstrip -------------------------------------------------------------------------- */
  /* The strip IS the timeline, so the scrubber docks to it rather than living beside a preview. */
  #striprow { grid-column: 1 / 3; background: var(--panel); border-bottom: 1px solid var(--line); }
  #strip { display: flex; align-items: stretch; height: var(--strip); }
  .stub { width: 22px; flex: none; border: 0; border-radius: 0; background: var(--sunk);
          writing-mode: vertical-rl; text-orientation: mixed; padding: 4px 0;
          font: 700 10px/1 ui-monospace, monospace; color: #1a1610; letter-spacing: .08em;
          overflow: hidden; }
  #film { flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden;
          display: flex; gap: 4px; padding: 4px; background: var(--cream); }
  #film.shimmer { animation: shimmer .9s ease-in-out infinite; }
  @keyframes shimmer {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(216, 166, 87, 0); }
    50% { box-shadow: inset 0 0 40px 0 rgba(216, 166, 87, .55); }
  }

  .fbox { position: relative; flex: none; border: 2px solid transparent; border-radius: 4px;
          background: var(--cream); cursor: pointer; }
  .fbox.sel { border-color: var(--gold); }
  .fbox.queued { border-color: var(--rust); }
  .fbox .n { font: 700 10px/13px ui-monospace, monospace; color: var(--faint); text-align: center; }
  .fbox .art { display: flex; align-items: stretch; height: 76px; }
  .fbox img, .fbox .empty { display: block; width: 76px; height: 76px; flex: none; }
  .fbox .empty { font: 9px/1.2 ui-monospace, monospace; color: var(--faint); text-align: center;
                 padding-top: 30px; }
  /* The extra width IS the hold. Stripes make it read as duration, not as a wider drawing. */
  .fbox .held { flex: 1 1 auto; border-radius: 0 2px 2px 0;
                background: repeating-linear-gradient(135deg, #d8c9a4 0 6px, #efe9d8 6px 12px); }
  .fbox .m { font: 9px/12px ui-monospace, monospace; color: var(--faint); text-align: center;
             white-space: pre; }
  .fbox .grip { position: absolute; top: 13px; right: 0; width: 7px; height: 76px;
                border-radius: 0 3px 3px 0; cursor: ew-resize; touch-action: none;
                background: linear-gradient(#d6cbb0, #b09a6d); border-left: 1px solid var(--cream); }
  .fbox .grip:hover { background: var(--rust); }
  .fbox .pos { position: absolute; top: 14px; left: 0; background: var(--rust); color: #fff;
               font: 700 9px/1 ui-monospace, monospace; padding: 2px 3px; border-radius: 0 0 2px 0; }
  /* Painting: the OLD drawing stays visible under the stripes. You are looking at what is about
     to be replaced, which is the whole point of committing the edit before the paint. */
  .fbox .paint { position: absolute; top: 13px; left: 0; right: 0; height: 76px;
                 background: repeating-linear-gradient(45deg,
                   rgba(180, 70, 47, .45) 0 7px, rgba(180, 70, 47, 0) 7px 14px);
                 background-size: 28px 100%; animation: crawl 1s linear infinite; }
  @keyframes crawl { from { background-position: 0 0; } to { background-position: 28px 0; } }
  /* A gradient triangle rather than a border one: a border triangle is drawn OUTSIDE a
     zero-sized box, so there is no box left to put the `!` in and it landed off the badge. */
  .fbox .bang { position: absolute; top: 13px; right: 0; width: 22px; height: 22px;
                background: linear-gradient(to bottom left, var(--rust) 0 50%, transparent 50%);
                color: #fff; font: 700 12px/1 ui-monospace, monospace; text-align: right;
                padding: 3px 4px 0 0; }
  .fbox.fresh { animation: fresh .9s ease-out 1; }
  @keyframes fresh {
    from { box-shadow: 0 0 0 4px var(--gold); }
    to { box-shadow: 0 0 0 0 rgba(216, 166, 87, 0); }
  }
  .fbox.drag { opacity: .4; }
  .fbox.dropzone { border-color: var(--gold); border-style: dashed; }

  #transport { display: flex; align-items: center; gap: 6px; padding: 4px 8px; }
  #transport button { padding: 5px 7px; }
  #scrub { flex: 1 1 auto; min-width: 0; accent-color: var(--gold); }
  #transport label { color: var(--dim); display: flex; align-items: center; gap: 4px; }
  input, select { font: 600 11px/1 ui-monospace, monospace; color: var(--ink);
                  background: var(--sunk); border: 1px solid var(--line); border-radius: 4px;
                  padding: 5px; }
  input[type=number] { width: 48px; }
  #beatcap { color: var(--faint); white-space: nowrap; }

  /* --- stage ------------------------------------------------------------------------------ */
  #stage { grid-column: 1; min-width: 0; min-height: 0; position: relative;
           display: flex; gap: 8px; padding: 8px; }
  .pane { background: var(--cream); border: 1px solid var(--line); border-radius: 6px;
          display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1 1 50%; }
  .art { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
         padding: 4px; }
  canvas { max-width: 100%; max-height: 100%; display: block; }
  #cellcv { cursor: grab; touch-action: none; }
  #cellcv:active { cursor: grabbing; }
  .foot { border-top: 1px solid #d5cbb4; padding: 4px 6px; display: flex; gap: 4px;
          align-items: center; flex-wrap: wrap; color: var(--faint); min-height: 28px; }
  .foot button { background: #e2dac6; border-color: #c3b795; color: #3a332a; padding: 4px 6px; }
  .foot button.on { background: var(--gold); border-color: #a9803d; color: #1a1610; }
  .foot .txt { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Narrow: Preview never leaves, it becomes a picture-in-picture. The running loop is the
     ambient QA signal, and an editor that hides it is how a drift ships. */
  body.pip #right { position: absolute; right: 16px; bottom: 16px; width: 208px; height: 236px;
                    flex: none; z-index: 5; box-shadow: 0 6px 20px rgba(0, 0, 0, .55); }
  body.pip #cellpane { flex: 1 1 100%; }

  /* --- inspector -------------------------------------------------------------------------- */
  #inspector { grid-column: 2; min-height: 0; overflow-y: auto; overflow-x: hidden;
               background: var(--panel); border-left: 1px solid var(--line); padding: 8px; }
  body.noinsp #inspector { display: none; }
  .grp { margin-bottom: 12px; }
  .lbl { font: 700 9px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase;
         color: var(--faint); margin-bottom: 6px; }
  /* Capped, not sized to the column: at 1280x760 a full-width source frame pushed the Actions
     below the fold, and an editor whose primary buttons need a scroll is not an editor. */
  #srcimg { display: block; width: 100%; height: 128px; object-fit: contain;
            background: var(--cream); border-radius: 4px; }
  .facts { color: var(--dim); line-height: 1.6; margin-top: 6px; }
  .facts b { color: var(--gold); font-weight: 700; }
  #variants { display: flex; gap: 4px; flex-wrap: wrap; }
  .vthumb { padding: 2px; display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: var(--cream); }
  .vthumb img { display: block; width: 66px; height: 66px; }
  .vthumb span { font: 9px/1.2 ui-monospace, monospace; color: var(--faint); }
  .vthumb.on { background: var(--gold); }
  #actions { display: flex; flex-direction: column; gap: 4px; }
  #actions button { text-align: left; }

  /* --- overlays --------------------------------------------------------------------------- */
  #queuepop { position: fixed; top: 52px; right: 8px; width: 400px; max-height: 62vh;
              overflow-y: auto; padding: 8px; z-index: 40;
              background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
  .job { border-top: 1px solid var(--line); padding: 6px 0; display: flex; gap: 6px;
         align-items: flex-start; }
  .job:first-child { border-top: 0; }
  .job .who { flex: 1 1 auto; min-width: 0; }
  .job .who b { color: var(--ink); font-weight: 700; display: block; }
  .job .who span { color: var(--dim); }
  .job.failed .who b { color: #e6a394; }
  #scrim { position: fixed; inset: 0; background: rgba(10, 9, 7, .78); z-index: 50;
           display: flex; align-items: center; justify-content: center; }
  #modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 12px; max-width: min(1100px, 92vw); max-height: 86vh; overflow-y: auto; }
  #modal h3 { font: 700 11px/1 ui-monospace, monospace; letter-spacing: .1em;
              text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
  /* Capped so the commit button stays on screen: the whole point of a two-step re-pick is that
     you can see what you are about to spend 45 seconds of GPU on. */
  .picks { display: flex; flex-wrap: wrap; gap: 4px; max-height: 34vh; overflow-y: auto; }
  .picks figure { margin: 0; cursor: pointer; border: 2px solid transparent; border-radius: 4px;
                  background: var(--cream); }
  /* The current frame has to be findable among sixty-odd near-identical thumbnails, so it gets
     three signals, not one: a solid gold border, a gold caption, and a label saying so. A 2px
     border alone was there before and was invisible at this density. */
  .picks figure.cur { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(216,166,87,.35); }
  .picks figure.cur figcaption { color: var(--gold); font-weight: 700; }
  .picks figure.cur figcaption::after { content: " · current"; }
  /* Two different things, so two different marks: `cur` is the frame this cell is painted from,
     `on` is the frame the scrubber is looking at right now. */
  .picks figure.on { border-color: var(--cream); box-shadow: 0 0 0 3px var(--rust); }
  .picks figure .off { color: var(--faint); }
  .picks img { display: block; width: 92px; height: 92px; }
  .picks figcaption { font: 9px/1.3 ui-monospace, monospace; color: var(--faint); text-align: center; }
  .keys { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 5px 10px; align-items: center; }
  .keys kbd { font: 700 10px/1 ui-monospace, monospace; border: 1px solid var(--line);
              border-radius: 3px; padding: 3px 5px; color: var(--gold); background: var(--sunk);
              white-space: nowrap; }
  .keys span { color: var(--dim); }
  .dls { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }

  /* --- the frame strip -------------------------------------------------------------------- */
  /* Scrubbing SOURCE footage means scrubbing the extracted frames, never the mp4 they came from.
     Every one of them is already a PNG on disk beside the pick directory, and an <img> swap is
     instant on a phone where an mp4 seek is a decode, a flush and a fullscreen takeover. There is
     no <video> element on this page, and there must not be one. */
  #fs { display: flex; flex-direction: column; gap: 8px; }
  #fs-stage { display: flex; align-items: center; justify-content: center; background: var(--cream);
              border-radius: 6px; height: 220px; }
  /* `object-fit` rather than a pair of max-* : a percentage max-height against a flex line is how
     the head came off the top of every portrait frame. */
  #fs-big { display: block; width: 100%; height: 100%; object-fit: contain; }
  #fs-meta { color: var(--dim); }
  #fs-meta b { color: var(--gold); }
  /* 44px of slider, because the scrubber is the primary control here and a 12px track is a miss
     on a thumb. */
  #fs-range { width: 100%; height: 44px; accent-color: var(--gold); }
  #fs-use { align-self: flex-start; min-height: 44px; }

  /* --- the phone --------------------------------------------------------------------------- */
  /* Below 760px this stops being an editor shell and becomes a review surface: one column, three
     screens, and NOTHING that needs a pointer. Pivot drag, the duration grips, onion skinning and
     compare are hidden rather than shrunk — a 20px pivot handle under a thumb is a foot-gun that
     costs a repack, and the phone is where you approve work, not where you align feet. */
  #screens { display: none; }

  @media (max-width: 759.98px) {
    html, body { height: 100dvh; }
    #app { display: flex; flex-direction: column; overflow-x: hidden;
           padding-bottom: env(safe-area-inset-bottom); }
    /* The desktop fitting rules must not reach in here: PiP would take the preview out of flow and
       `noinsp` would delete the only place the phone can re-roll from. */
    body.pip #right, body.pip #cellpane { position: static; width: auto; height: auto;
                                          flex: 1 1 auto; box-shadow: none; }

    /* topbar: characters and the queue on one line, the tags on their own scrolling line */
    /* Not sticky: on Cells the column scrolls, and only ONE of these can hold the top. The
       screen switcher wins, because losing the way back to Preview mid-scroll is worse than
       scrolling up for the tag rail. */
    #topbar { grid-column: auto; height: auto; flex-wrap: wrap; padding: 6px; gap: 6px; }
    #topbar button, #topbar .btn { min-height: 44px; display: flex; align-items: center; }
    /* The shortcut list and the inspector toggle describe a keyboard and a third column, neither
       of which exists here. Scoped to #topbar so they outrank `#topbar button` above — an id on
       its own loses that fight however late it is declared. */
    #topbar .sep, #topbar #b-help, #topbar #insptoggle { display: none; }
    #chars { order: 1; }
    #queue { order: 2; margin-left: auto; min-width: 0; max-width: 42vw; padding: 0 8px; }
    #b-export { order: 3; }
    #tags { order: 4; flex: 1 0 100%; overflow-x: auto; padding-bottom: 2px;
            scrollbar-width: none; }
    #tags::-webkit-scrollbar { display: none; }
    /* Status is one thin line under everything, because it is read and never touched. */
    #topbar .grow { order: 5; flex: 1 0 100%; }
    #ticker { font-size: 11px; padding: 0; }

    #screens { display: flex; order: 0; flex: none; background: var(--panel);
               border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 19; }
    body.ph-cells #screens { box-shadow: 0 6px 12px rgba(10, 9, 7, .5); }
    #screens button { flex: 1 1 33%; min-height: 44px; border: 0; border-radius: 0;
                      border-right: 1px solid var(--line); background: var(--panel);
                      color: var(--dim); font-size: 12px; }
    #screens button:last-child { border-right: 0; }
    #screens button.on { background: var(--gold); color: #1a1610; }

    /* every region is off by default; each screen turns its own back on */
    #striprow, #stage, #inspector, #queuepop, #pipe { display: none; }
    /* The rail is its own screen here, and the chips stack. Seven chips and a price do not fit on
       one phone line, and a horizontal scroller hides the two that matter most — Pack and Export
       are at the end and are the ones a person approves from the sofa. */
    body.ph-rail #pipe { display: flex; order: 1; flex: none; flex-direction: column;
                         align-items: stretch; gap: 6px; padding: 8px;
                         grid-column: auto; overflow-x: hidden; }
    body.ph-rail .pchip { min-height: 48px; }
    body.ph-rail .pchip .price, body.ph-rail .pchip .free { margin-left: auto; }
    body.ph-rail .parrow { display: none; }
    body.ph-rail #inspector { display: block; order: 2; flex: 1 1 auto; }
    body.ph-rail #app { overflow-y: auto; }
    body.ph-rail #g-step { order: 0; }
    #screens button { flex: 1 1 25%; }
    #striprow { grid-column: auto; }
    #stage { grid-column: auto; padding: 6px; }
    #inspector { grid-column: auto; border-left: 0; border-top: 1px solid var(--line);
                 overflow: visible; }

    /* Preview: the atlas canvas, the tag it is playing and the transport under it. */
    body.ph-preview #stage { display: flex; order: 1; flex: 1 1 auto; min-height: 0; }
    body.ph-preview #cellpane { display: none; }
    body.ph-preview #right { display: flex; flex: 1 1 auto; }
    body.ph-preview #striprow { display: block; order: 2; flex: none; border-bottom: 0;
                                border-top: 1px solid var(--line); }
    body.ph-preview #strip { display: none; }
    #b-compare, #b-pin { display: none; }
    #transport { flex-wrap: wrap; padding: 4px 6px 6px; gap: 6px; }
    #transport button { min-width: 44px; min-height: 44px; justify-content: center; }
    /* First and last are a keyboard convenience, and direction is a repack. The phone keeps
       play, step and fps — the three that answer "does this move read right". */
    #t-first, #t-last, #transport #dirlab { display: none; }
    #scrub { flex: 1 0 100%; height: 44px; order: -1; }
    #fps { min-height: 44px; width: 56px; }
    #beatcap { margin-left: auto; }

    /* Cells: the filmstrip as a grid, then the tapped cell, then the one-tap edits. */
    body.ph-cells #app { overflow-y: auto; }
    body.ph-cells #striprow { display: block; order: 1; flex: none; }
    body.ph-cells #transport { display: none; }
    body.ph-cells .stub { display: none; }
    /* --strip is a filmstrip's height. A grid is as tall as its rows, capped by the screen. */
    body.ph-cells #strip { height: auto; }
    body.ph-cells #film { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
                          gap: 6px; overflow-x: hidden; overflow-y: auto; max-height: 46vh; }
    /* The hold is inline width on the desktop strip. In a grid it would tear the columns, so the
       count in the caption carries it instead. */
    body.ph-cells .fbox { width: auto !important; }
    body.ph-cells .fbox .art { height: auto; }
    body.ph-cells .fbox img, body.ph-cells .fbox .empty { width: 100%; height: auto;
                                                          aspect-ratio: 1 / 1; }
    body.ph-cells .fbox .empty { padding-top: 40%; }
    body.ph-cells .fbox .held, body.ph-cells .fbox .grip { display: none; }
    body.ph-cells #stage { display: flex; order: 2; flex: none; height: 34vh; }
    body.ph-cells #right { display: none; }
    body.ph-cells #cellpane { display: flex; flex: 1 1 auto; }
    body.ph-cells #cellpane .foot { display: none; }
    body.ph-cells #cellcv { cursor: default; touch-action: pan-y; }
    body.ph-cells #inspector { display: flex; flex-direction: column; order: 3; flex: none; }
    body.ph-cells #g-act { order: 1; }
    body.ph-cells #g-var { order: 2; }
    body.ph-cells #g-prov { order: 3; }
    body.ph-cells #actions button { min-height: 44px; }
    body.ph-cells #variants { gap: 6px; }
    body.ph-cells .vthumb img { width: 76px; height: 76px; }
    body.ph-cells #srcimg { height: 96px; }

    /* Queue: the same rows as the desktop popover, in the flow and full width. */
    body.ph-queue #queuepop { display: block; position: static; order: 1; flex: 1 1 auto;
                              width: auto; max-height: none; overflow-y: auto; border: 0;
                              border-radius: 0; box-shadow: none; }
    body.ph-queue .job { padding: 10px 0; flex-wrap: wrap; }
    body.ph-queue .job button { min-height: 44px; }

    /* overlays */
    #modal { padding: 8px; max-width: 100vw; width: 100vw; max-height: 100dvh; height: 100dvh;
             border-radius: 0; display: flex; flex-direction: column; }
    #fs { flex: 1 1 auto; min-height: 0; }
    #fs-stage { flex: 1 1 auto; height: auto; min-height: 120px; }
    /* One row that snaps, paired with the slider: a wrap of sixty-odd thumbnails is four screens
       of scrolling on a phone. */
    .picks { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory;
             padding-bottom: 4px; }
    .picks figure { scroll-snap-align: center; flex: none; }
    .picks img { width: 72px; height: 72px; }

  }

<script>
// Two origins, and the split is the point. This page and every mutation come from celld, which
// owns the manifest and the job queue; every PIXEL comes from the wilson agent, because the
// cells, the source frames and the atlas are files on the machine with the GPU and are far too
// big to push through the fleet's bucket. `AGENT` is handed over by the Worker, never hard-coded.
let AGENT = "";

let cid = "seth", tagName = "", sel = 0;
let ST = null;                        // manifest state merged with the agent's derived facts
let JOBS = [], revision = -1, seenRevision = -1;

// What THIS page asked for, keyed by the job id the DO handed back. The job list alone cannot
// answer two questions a good queue has to: which cells a coalesced repack touched (it reports
// one index for any number of edits), and how to retry a failure (the op is not in the view).
const OWN = new Map();                // id -> {scope, tag, indices:Set, requests:[…]}
// A failure outlives its job: the DO drops finished jobs after about thirty seconds, and a rust
// badge that disappears on its own is a failure nobody saw.
const FAILS = new Map();              // cellKey -> {error, jobId, label}

const LIVE = ["queued", "claimed", "running"];
const HOLD_PX = 24;                   // one extra beat widens a frame box by this much
const GHOST_ALPHA = 0.3;
const PREV_INK = "#b4462f", NEXT_INK = "#3a6ea5";
const PRICE = {reroll: "~45s GPU", repick: "~45s GPU"};

let onion = {on: true, prev: true, next: false, mode: "alpha"};
let seq = [], head = 0, playing = true, raf = null, beatAt = 0, rest = 0;

// The phone is a different tool, not a smaller one. Below this width the shell is one column of
// three screens and every pointer-only affordance is gone; at or above it nothing on this page
// behaves differently from the day it was written.
const PHONE_MAX = 760;
let phone = false, screenName = "preview";
let compare = false, pinned = null;   // {tag, i}
let drag = null, holdDrag = null, gesture = false, suppressClick = false;
let sheetDragKey = false;             // S held during a pivot drag targets the SHEET pivot
let scrubSelect = null, overlay = null, queueOpen = false, handCollapse = false;
let atlasImg = null, atlasKey = "", atlasLoading = "", atlasVer = 0;
let lastUi = "";

// Cache-busting is per cell, not global. The old page bumped one token on every job and threw
// away every image and every atlas crop it held — fifty-four cells refetched because one changed.
const VER = new Map();                // cellKey -> integer, bumped only when the ART moved

const el = (id) => document.getElementById(id);

// A cell is 512px of drawing, and on a dpr-3 phone the browser was blowing a 512 backing store up
// to about 1100 device pixels — every line soft. Size the backing store to the DISPLAYED size in
// device pixels, never below the cell, then scale the context so all the drawing code below keeps
// working in cell coordinates. `max-width/max-height: 100%` only ever shrink, so on a dpr-1
// desktop this resolves to exactly the 512 it always was and the layout cannot move.
function fitCanvas(cv) {
  const cell = ST.cell, dpr = Math.min(window.devicePixelRatio || 1, 3);
  const shown = cv.getBoundingClientRect().width || cell;
  const want = Math.max(cell, Math.round(shown * dpr));
  if (cv.width !== want) { cv.width = want; cv.height = want; }
  const ctx = cv.getContext("2d");
  ctx.setTransform(cv.width / cell, 0, 0, cv.width / cell, 0, 0);
  return ctx;
}
const TAG = () => ST.tags.find((t) => t.name === tagName) || ST.tags[0];
const CELLS = () => TAG().cells;
const CUR = () => CELLS()[sel];
const key = (tag, i) => cid + "|" + tag + "|" + i;
const ver = (tag, i) => VER.get(key(tag, i)) || 0;

const imgUrl = (p, w) => AGENT + "/img?path=" + encodeURIComponent(p) + (w ? "&w=" + w : "");
const cellUrl = (tag, i, atlas, w) =>
  AGENT + "/cell?cid=" + cid + "&i=" + atlas + (w ? "&w=" + w : "") + "&v=" + ver(tag, i);

function tick(msg, err) {
  el("ticker").textContent = msg;
  el("ticker").className = err ? "err" : "";
}

// A tag's colour survives a reload and a rename of its neighbours because it is derived from the
// name rather than handed out by position: adding a tag must not recolour the other six.
function tagInk(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return "hsl(" + h + ", 52%, 62%)";
}

// --- data --------------------------------------------------------------------------------------
// The manifest comes from the character's Durable Object; where the packer actually put each cell,
// what it measures and which repaints exist on disk all come from the agent, because all three
// are answers about files. Merged by tag name and cell index, which is the only pairing both
// sides agree on — the atlas index is the agent's alone.
async function fetchState(forCid) {
  const r = await fetch("/api/state?cid=" + forCid);
  const st = await r.json();
  if (st.error) throw new Error(st.error);
  AGENT = st.agent;
  let derived = null;
  try {
    const d = await fetch(AGENT + "/derived?cid=" + forCid);
    const got = await d.json();
    if (got.error) throw new Error(got.error);
    derived = got;
  } catch (e) {
    tick("the wilson agent is unreachable at " + AGENT + " — no cells, no atlas, no variants", true);
  }
  if (derived && derived.locks) LOCKS = derived.locks;
  st.atlas = derived ? derived.atlas : null;
  st.outdir = derived ? derived.outdir : "";
  for (const tag of st.tags) {
    const dt = derived && derived.tags[tag.name];
    tag.cells.forEach((c, i) => {
      const dc = dt && dt.cells[i];
      c.atlas = dc ? dc.atlas : null;
      c.xy = dc ? dc.xy : null;
      c.metrics = dc ? dc.metrics : null;
      c.variants = dc ? dc.variants : [];
    });
  }
  return st;
}

// What the cell's CROP looks like. Only a change here needs a new image off the agent; a new seed
// or a longer hold changes the manifest and not one pixel of the atlas that is already packed.
function artSig(c) {
  const m = c.metrics;
  return [c.atlas, c.xy && c.xy.join(","), m && m.height, m && m.top, m && m.feet].join("|");
}
// What the cell's ROW looks like. A change here is worth a gold flash even when the crop is the
// same file — a variant switch, a hold, a nudge.
function uiSig(c) {
  return [artSig(c), c.png, c.seed, c.src, c.hold, c.pivot_nudge.join(","),
          (c.variants || []).length].join("|");
}

// Adopt new state, bump the version of every cell whose ART moved, and hand back the keys worth
// flashing. Selection and playhead are never touched here.
function adopt(st, forced) {
  const flash = new Set(forced || []), bump = new Set(forced || []);
  if (ST && ST.character === st.character) {
    for (const tag of st.tags) {
      const was = ST.tags.find((t) => t.name === tag.name);
      if (!was) continue;
      // The tag grew or shrank, so every cell from the splice on is a different drawing under an
      // index it did not have before. Half of them would otherwise keep a neighbour's crop.
      const spliced = was.cells.length !== tag.cells.length;
      const n = Math.max(was.cells.length, tag.cells.length);
      for (let i = 0; i < n; i++) {
        const now = tag.cells[i], before = was.cells[i];
        const k = cid + "|" + tag.name + "|" + i;
        if (spliced) { flash.add(k); bump.add(k); continue; }
        if (uiSig(before) !== uiSig(now)) flash.add(k);
        if (artSig(before) !== artSig(now)) bump.add(k);
      }
    }
  }
  ST = st;
  for (const k of bump) VER.set(k, (VER.get(k) || 0) + 1);
  return flash;
}

async function reload(forced, doFlash) {
  const st = await fetchState(cid);
  const flash = adopt(st, forced);
  if (!ST.tags.some((t) => t.name === tagName)) tagName = ST.tags[0].name;
  if (sel >= CELLS().length) sel = Math.max(0, CELLS().length - 1);
  seenRevision = ST.revision;
  paint(doFlash ? flash : null);
}

// --- render ------------------------------------------------------------------------------------
// `paint` rebuilds the chrome for the CURRENT TAG only — ten boxes whose image URLs are unchanged
// unless `adopt` bumped their version, so the browser serves them from cache and nothing
// flickers. This is deliberately not the old "bust everything, reload everything": the network
// cost of a repaint is exactly the set of cells whose drawing moved.
function paint(flash) {
  renderChars();
  renderTags();
  renderRail();
  renderStrip(flash);
  renderTagControls();
  rebuildSequence();
  renderStage();
  renderInspector();
  renderQueue();
  lastUi = uiFingerprint();
}

function renderChars() {
  const host = el("chars");
  host.innerHTML = "";
  for (const c of ST.characters) {
    const b = document.createElement("button");
    b.textContent = c;
    b.title = "switch character (Tab)";
    if (c === cid) b.className = "on";
    b.onclick = () => switchCharacter(c);
    host.appendChild(b);
  }
}

function renderTags() {
  const host = el("tags");
  host.innerHTML = "";
  ST.tags.forEach((t, n) => {
    const b = document.createElement("button");
    b.className = "tagchip" + (t.name === tagName ? " on" : "");
    b.title = t.name + " — " + t.cells.length + " cells at " + t.fps + "fps, " + t.direction +
              (t.loop ? ", loop" : t.hold_key ? ", hold" : ", once") + " (" + (n + 1) + ")";
    const dot = document.createElement("i");
    dot.style.background = tagInk(t.name);
    b.appendChild(dot);
    b.appendChild(document.createTextNode(t.name));
    b.onclick = () => selectTag(t.name);
    host.appendChild(b);
  });
}

// Which cells a live job is about to replace. The API answers for one index per job; OWN fills in
// the rest, because a coalesced repack carries every edit that joined it.
function pendingCells() {
  const m = new Map();
  for (const j of JOBS) {
    if (!LIVE.includes(j.state)) continue;
    const own = OWN.get(j.id);
    if (own && own.scope === "sheet") {
      for (const t of ST.tags) t.cells.forEach((_, i) => m.set(cid + "|" + t.name + "|" + i, j));
    } else if (own && own.scope === "tag") {
      const t = ST.tags.find((x) => x.name === own.tag);
      if (t) t.cells.forEach((_, i) => m.set(cid + "|" + own.tag + "|" + i, j));
    } else if (own) {
      for (const i of own.indices) m.set(cid + "|" + own.tag + "|" + i, j);
    }
    if (j.tag && j.index !== null) m.set(cid + "|" + j.tag + "|" + j.index, j);
  }
  return m;
}

const lockedHere = () => pendingCells().has(key(tagName, sel));

// Everything the strip and the inspector draw that is NOT the manifest: job states, queue
// positions, failures. Polling compares this rather than re-rendering blind, because rebuilding
// the strip every 1.5s reset its horizontal scroll under the cursor.
function uiFingerprint() {
  const parts = [tagName, sel, cid, FAILS.size, stepOpen];
  // A job this page RAN carries no tag or index, so `pendingCells` cannot see it and the chip
  // would sit on "queued" until something else forced a redraw.
  for (const j of JOBS) if (RUNS.has(j.id)) parts.push("run:" + j.id + ":" + j.state);
  for (const [k, j] of pendingCells()) parts.push(k + ":" + j.state + ":" + j.queuePos);
  for (const k of FAILS.keys()) parts.push("!" + k);
  return parts.join(",");
}

function renderStrip(flash) {
  // A gesture owns the strip's DOM while it runs: rebuilding it mid-drag drops the captured
  // pointer and the drag ends where nobody asked it to.
  if (gesture) return;
  const film = el("film");
  const tag = TAG(), pend = pendingCells();
  const at = ST.tags.findIndex((t) => t.name === tag.name);
  const prev = ST.tags[(at - 1 + ST.tags.length) % ST.tags.length];
  const next = ST.tags[(at + 1) % ST.tags.length];
  for (const [b, t, txt] of [[el("prevtag"), prev, "‹ " + prev.name],
                             [el("nexttag"), next, next.name + " ›"]]) {
    b.textContent = txt;
    b.style.background = tagInk(t.name);
    b.title = "go to the " + t.name + " tag";
    b.onclick = () => selectTag(t.name);
  }
  const keepScroll = film.scrollLeft;
  film.innerHTML = "";
  // A repack in flight means every crop on the strip is provisional — the atlas is being rebuilt
  // underneath them — so the shimmer belongs to the strip and not to any one cell.
  film.classList.toggle("shimmer", JOBS.some((j) => j.state === "running" && !j.generates));
  tag.cells.forEach((c, i) => film.appendChild(frameBox(tag, i, c, pend, flash)));
  film.scrollLeft = keepScroll;
  scrollSelectionIntoView();
}

function frameBox(tag, i, c, pend, flash) {
  const k = key(tag.name, i);
  const job = pend.get(k), fail = FAILS.get(k), m = c.metrics;
  const box = document.createElement("div");
  box.className = "fbox" + (i === sel ? " sel" : "") +
                  (job && job.state === "queued" ? " queued" : "") +
                  (flash && flash.has(k) ? " fresh" : "");
  box.style.width = (80 + (Math.max(1, c.hold) - 1) * HOLD_PX) + "px";
  box.dataset.i = i;
  box.title = "cell " + (i + 1) + " of " + tag.name + " — seed " + c.seed +
              (c.hold > 1 ? ", held " + c.hold + " beats" : "") + (fail ? "\n" + fail.error : "");
  box.innerHTML = '<div class="n">' + (i + 1) + (c.hold > 1 ? " ×" + c.hold : "") + "</div>" +
    '<div class="art">' +
    (c.atlas !== null
      ? '<img src="' + cellUrl(tag.name, i, c.atlas, 76) + '" alt="cell ' + (i + 1) + '">'
      : '<div class="empty">not packed</div>') +
    (c.hold > 1 ? '<div class="held"></div>' : "") + "</div>" +
    '<div class="m">' + (m ? "h" + m.height + " f" + (m.feet > 0 ? "+" : "") + m.feet : "empty") +
    (c.pivot_nudge[0] || c.pivot_nudge[1] ? " ◈" : "") + "</div>";
  if (job && job.state === "queued") {
    const pos = document.createElement("div");
    pos.className = "pos";
    pos.textContent = String((job.queuePos || 0) + 1);
    box.appendChild(pos);
  } else if (job) {
    const p = document.createElement("div");
    p.className = "paint";
    box.appendChild(p);
  }
  if (fail) {
    const bang = document.createElement("div");
    bang.className = "bang";
    bang.textContent = "!";
    box.appendChild(bang);
  }
  // A drag that ends off the box never produces a click, so the suppression flag is cleared on
  // the next press as well as on the click it was raised for — otherwise one drag ate the next
  // cell selection.
  box.addEventListener("pointerdown", (ev) => {
    suppressClick = false;
    // Reordering by drag needs a horizontal drag on a surface whose own gesture is a vertical
    // scroll. On the phone a cell takes taps only.
    if (!phone) startOrderDrag(ev, i, box);
  });
  box.onclick = () => {
    if (suppressClick) { suppressClick = false; return; }
    selectCell(i);
  };
  if (!phone) {
    const grip = document.createElement("div");
    grip.className = "grip";
    grip.title = "drag to hold cell " + (i + 1) + " longer (+ / -)";
    grip.addEventListener("pointerdown", (ev) => startHoldDrag(ev, i, c, box));
    box.appendChild(grip);
  }
  return box;
}

function scrollSelectionIntoView() {
  const film = el("film"), box = film.querySelector(".fbox.sel");
  if (!box) return;
  // The strip is a grid on the phone, so the axis that matters is the other one.
  if (phone) { box.scrollIntoView({block: "nearest", inline: "nearest"}); return; }
  const left = box.offsetLeft - film.offsetLeft;
  // Scrolls the strip only. There is no page scroll in an editor shell, and there must not be.
  if (left < film.scrollLeft) film.scrollLeft = left - 12;
  else if (left + box.offsetWidth > film.scrollLeft + film.clientWidth)
    film.scrollLeft = left + box.offsetWidth - film.clientWidth + 12;
}

function renderTagControls() {
  const tag = TAG();
  el("fps").value = tag.fps;
  el("direction").value = tag.direction;
}

// --- selection ---------------------------------------------------------------------------------
function selectCell(i) {
  if (i === sel || i < 0 || i >= CELLS().length) return;
  sel = i;
  for (const b of el("film").querySelectorAll(".fbox")) b.classList.toggle("sel", +b.dataset.i === i);
  scrollSelectionIntoView();
  renderStage();
  renderInspector();
  seekToCell(i);
  lastUi = uiFingerprint();
}

function selectTag(name) {
  if (name === tagName || !ST.tags.some((t) => t.name === name)) return;
  tagName = name;
  sel = 0;
  head = 0;
  paint(null);
}

async function switchCharacter(c) {
  if (c === cid || !ST.characters.includes(c)) return;
  cid = c;
  sel = 0;
  tagName = "";
  ST = null;
  pinned = null;
  atlasImg = null;
  atlasKey = "";
  tick("loading " + c + "…");
  await reload(null, false);
  tick("ready");
}

const stepSelection = (d) => selectCell(Math.min(CELLS().length - 1, Math.max(0, sel + d)));

// --- transport ---------------------------------------------------------------------------------
// Ping-pong follows the Aseprite convention: play from -> to, then back down to (but not
// including) the first cell. Per-cell `hold` repeats a cell in the step list, which is exactly
// what the game does with it, so the scrubber counts BEATS and not cells.
function rebuildSequence() {
  const tag = TAG(), order = [];
  if (tag.direction === "reverse") for (let i = tag.cells.length - 1; i >= 0; i--) order.push(i);
  else if (tag.direction === "pingpong") {
    for (let i = 0; i < tag.cells.length; i++) order.push(i);
    for (let i = tag.cells.length - 2; i > 0; i--) order.push(i);
  } else for (let i = 0; i < tag.cells.length; i++) order.push(i);

  const wasOn = seq.length && seq[head] ? seq[head].i : sel;
  seq = [];
  for (const i of order) {
    const c = tag.cells[i];
    if (!c.xy) continue;
    for (let k = 0; k < Math.max(1, c.hold); k++) seq.push({i, xy: c.xy});
  }
  // The playhead stays on the CELL it was on. A hold typed while the preview runs must not
  // restart the loop, and a repack landing must not either.
  if (!(seq[head] && seq[head].i === wasOn)) {
    const at = seq.findIndex((s) => s.i === wasOn);
    head = at >= 0 ? at : 0;
  }
  const scrub = el("scrub");
  scrub.max = String(Math.max(0, seq.length - 1));
  scrub.value = String(head);
  scrub.disabled = seq.length < 2;
  rest = 0;
  retime();
  drawPreview();
}

function seekToCell(i) {
  // Already showing a beat of that cell? Leave the playhead alone. Snapping to the cell's FIRST
  // beat made "step back" skip every held beat of the cell it stepped into.
  if (seq[head] && seq[head].i === i) return;
  const at = seq.findIndex((s) => s.i === i);
  if (at >= 0) { head = at; el("scrub").value = String(head); drawPreview(); }
}

// Driven by requestAnimationFrame rather than an interval, and stopped dead while the page is
// hidden. A backgrounded interval keeps decoding the atlas and repainting a canvas nobody can see,
// which on a phone is battery spent on nothing.
function retime() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  el("t-play").innerHTML = playing ? "&#10073;&#10073;" : "&#9654;";
  el("t-play").className = playing ? "on" : "";
  if (!ST || !playing || seq.length < 2 || document.hidden) return;
  beatAt = performance.now();
  raf = requestAnimationFrame(pump);
}

function pump(now) {
  raf = null;
  // `switchCharacter` clears the manifest and then awaits the next one, and every beat reads the
  // tag out of it. An interval had the same hole; at 60Hz it is hit every time.
  if (!ST || !playing || seq.length < 2 || document.hidden) return;
  const step = 1000 / TAG().fps;
  // One beat per step at most: a tab that was throttled must not fast-forward the loop on return.
  if (now - beatAt >= step) { beatAt = now; advance(); }
  raf = requestAnimationFrame(pump);
}

// On `document`, which is where the event is raised: bound to `window` it works only because the
// real event bubbles, and it must fire for the loop to be picked back up.
// `playing` is untouched, so it resumes exactly where it was left.
document.addEventListener("visibilitychange", retime);

function advance() {
  const tag = TAG();
  // A once-tag ends on its last cell in the game. Here it rests there and replays, because a
  // preview frozen on the recovery pose tells you nothing about the motion.
  if (!tag.loop && head === seq.length - 1 && rest < Math.ceil(tag.fps * 0.7)) { rest++; return; }
  rest = 0;
  head = (head + 1) % seq.length;
  el("scrub").value = String(head);
  drawPreview();
}

function pause() { if (playing) { playing = false; retime(); } }
function syncScrub() {
  el("scrub").value = String(head);
  drawPreview();
  // Stepping the transport moves the SELECTION with it, so the canvas, the metrics and the onion
  // ghost describe the cell you just stepped onto. Playback deliberately does not: reselecting
  // twelve times a second would refetch the source frame and the variant strip on every beat.
  if (seq[head] && seq[head].i !== sel) selectCell(seq[head].i);
}
const transport = (fn) => () => { if (ST && seq.length) fn(); };
el("t-play").onclick = transport(() => { playing = !playing; retime(); });
el("t-first").onclick = transport(() => { pause(); head = 0; syncScrub(); });
el("t-last").onclick = transport(() => { pause(); head = seq.length - 1; syncScrub(); });
el("t-prev").onclick = transport(() => { pause(); head = (head - 1 + seq.length) % seq.length; syncScrub(); });
el("t-next").onclick = transport(() => { pause(); head = (head + 1) % seq.length; syncScrub(); });
el("scrub").oninput = () => {
  pause();
  head = parseInt(el("scrub").value, 10) || 0;
  drawPreview();
  // Debounced: dragging across thirty beats would otherwise fire thirty selection changes, each
  // refetching a 512px cell, a source frame and the variant strip.
  if (scrubSelect) clearTimeout(scrubSelect);
  scrubSelect = setTimeout(() => { if (seq[head]) selectCell(seq[head].i); }, 150);
};

// --- images ------------------------------------------------------------------------------------
// Keyed on the URL being fetched, never on `cid`: `cid` changes the instant the character button
// is clicked while `ST` is still the previous character, and keying on cid cached the outgoing
// character's atlas under the incoming one's name.
function withAtlas(cb) {
  if (!ST.atlas) return;
  const k = ST.atlas + ":" + atlasVer;
  if (atlasKey === k && atlasImg) { cb(atlasImg); return; }
  if (atlasLoading === k) return;
  atlasLoading = k;
  const im = new Image();
  im.onload = () => { atlasImg = im; atlasKey = k; atlasLoading = ""; cb(im); };
  im.onerror = () => { atlasLoading = ""; };
  im.src = imgUrl(ST.atlas) + "&v=" + atlasVer;
}

const IMGS = new Map();
function withCell(url, cb) {
  const hit = IMGS.get(url);
  if (hit) { if (hit.complete && hit.naturalWidth) cb(hit); return; }
  // Bounded on purpose: every version bump mints a new URL, so an hour of re-rolls would
  // otherwise hold on to every drawing the session ever saw.
  if (IMGS.size > 160) IMGS.clear();
  const im = new Image();
  IMGS.set(url, im);
  im.onload = () => cb(im);
  im.onerror = () => IMGS.delete(url);
  im.src = url;
}
function cached(url) {
  const im = IMGS.get(url);
  return im && im.complete && im.naturalWidth ? im : null;
}

// --- the stage ---------------------------------------------------------------------------------
function renderStage() {
  const c = CUR();
  el("cellcap").textContent = c
    ? "cell " + (sel + 1) + "/" + CELLS().length + " · seed " + c.seed + " · pivot " +
      ST.pivot.join(",") +
      (c.pivot_nudge[0] || c.pivot_nudge[1]
        ? " nudge " + c.pivot_nudge.map((v) => (v > 0 ? "+" : "") + v).join(",") : "")
    : "no cell";
  el("o-on").className = onion.on ? "on" : "";
  el("o-prev").className = onion.on && onion.prev ? "on" : "";
  el("o-next").className = onion.on && onion.next ? "on" : "";
  el("o-mode").textContent = onion.mode;
  el("b-compare").className = compare ? "on" : "";
  el("b-pin").hidden = !compare;
  el("pv").hidden = compare;
  el("cmp").hidden = !compare;
  if (!c) return;
  paintCell(c);
  if (c.atlas !== null) {
    withCell(cellUrl(tagName, sel, c.atlas), () => { if (CUR() === c) paintCell(c); });
    for (const g of ghosts()) withCell(g.url, () => { if (CUR() === c) paintCell(c); });
  }
  if (compare) drawCompare(); else drawPreview();
}

// The neighbours are the cells either side WITHIN the tag, never either side in the atlas: the
// frame after the last cell of `walk` is the first of `punch`, and ghosting that compares two
// unrelated poses.
function ghosts() {
  const cells = CELLS(), out = [];
  // The phone has no onion controls, so it gets no onion: a ghost you cannot turn off reads as a
  // second character standing behind the one you are reviewing.
  if (!onion.on || phone) return out;
  if (onion.prev && sel > 0 && cells[sel - 1].atlas !== null)
    out.push({url: cellUrl(tagName, sel - 1, cells[sel - 1].atlas), ink: PREV_INK});
  if (onion.next && sel < cells.length - 1 && cells[sel + 1].atlas !== null)
    out.push({url: cellUrl(tagName, sel + 1, cells[sel + 1].atlas), ink: NEXT_INK});
  return out;
}

const OUTLINES = new Map();
// Plain alpha reads badly when both drawings are the same sepia ink on cream: two nearly aligned
// silhouettes just look like one slightly bolder one. The outline is the silhouette's edge only,
// which is what you actually compare when checking a foot or a shoulder for drift.
function outlineOf(im, ink, k) {
  const hit = OUTLINES.get(k);
  if (hit) return hit;
  const cell = ST.cell, cv = document.createElement("canvas");
  cv.width = cell;
  cv.height = cell;
  const ctx = cv.getContext("2d"), R = 3;
  for (const [dx, dy] of [[-R, 0], [R, 0], [0, -R], [0, R]]) ctx.drawImage(im, dx, dy, cell, cell);
  ctx.globalCompositeOperation = "destination-out";
  ctx.drawImage(im, 0, 0, cell, cell);
  ctx.globalCompositeOperation = "source-in";
  ctx.fillStyle = ink;
  ctx.fillRect(0, 0, cell, cell);
  if (OUTLINES.size > 60) OUTLINES.clear();
  OUTLINES.set(k, cv);
  return cv;
}

// The crosshair and the ground line come from the manifest, never from a constant in this page:
// the ground line IS the sheet pivot's y, and the crosshair is where this cell's artwork is
// anchored, which is pivot + this cell's nudge.
function paintCell(c) {
  const cv = el("cellcv"), cell = ST.cell;
  const ctx = fitCanvas(cv);
  ctx.clearRect(0, 0, cell, cell);
  const me = c.atlas === null ? null : cached(cellUrl(tagName, sel, c.atlas));
  const g = ghosts();
  if (onion.mode === "alpha") {
    // Under the selected cell, so the current drawing stays the one you read.
    ctx.globalAlpha = GHOST_ALPHA;
    for (const x of g) { const im = cached(x.url); if (im) ctx.drawImage(im, 0, 0, cell, cell); }
    ctx.globalAlpha = 1;
    if (me) ctx.drawImage(me, 0, 0, cell, cell);
  } else if (onion.mode === "difference") {
    if (me) ctx.drawImage(me, 0, 0, cell, cell);
    ctx.globalCompositeOperation = "difference";
    for (const x of g) { const im = cached(x.url); if (im) ctx.drawImage(im, 0, 0, cell, cell); }
    ctx.globalCompositeOperation = "source-over";
  } else {
    if (me) ctx.drawImage(me, 0, 0, cell, cell);
    for (const x of g) {
      const im = cached(x.url);
      if (im) ctx.drawImage(outlineOf(im, x.ink, x.url + ":" + x.ink), 0, 0);
    }
  }
  const d = drag ? drag.d : [0, 0];
  const toSheet = drag ? drag.sheet : false;
  const sheet = toSheet ? [ST.pivot[0] + d[0], ST.pivot[1] + d[1]] : ST.pivot;
  const nudge = toSheet ? c.pivot_nudge : [c.pivot_nudge[0] + d[0], c.pivot_nudge[1] + d[1]];
  const art = [sheet[0] + nudge[0], sheet[1] + nudge[1]];

  ctx.lineWidth = 2;
  ctx.strokeStyle = "#b4462f";
  ctx.setLineDash([9, 7]);
  ctx.beginPath();
  ctx.moveTo(0, sheet[1]);
  ctx.lineTo(cell, sheet[1]);
  ctx.stroke();
  ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.moveTo(sheet[0], 0);
  ctx.lineTo(sheet[0], cell);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);
  ctx.strokeStyle = "#14120f";
  ctx.lineWidth = 5;
  for (let pass = 0; pass < 2; pass++) {
    // Drawn twice, dark then gold: a thin gold crosshair vanishes against the cream cell and the
    // sepia ink both, and this is the one thing on the canvas that has to be seen exactly.
    ctx.beginPath();
    ctx.moveTo(art[0] - 22, art[1]);
    ctx.lineTo(art[0] + 22, art[1]);
    ctx.moveTo(art[0], art[1] - 22);
    ctx.lineTo(art[0], art[1] + 22);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(art[0], art[1], 11, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = "#d8a657";
    ctx.lineWidth = 2;
  }
}

function drawPreview() {
  if (!ST) return;
  const tag = TAG();
  el("beatcap").textContent = "beat " + (seq.length ? head + 1 : 0) + "/" + seq.length +
    " · cell " + (seq.length && seq[head] ? seq[head].i + 1 : 0) + "/" + tag.cells.length;
  if (compare) return;
  const cv = el("pv"), ctx = fitCanvas(cv);
  el("rightcap").textContent = "preview — " + tag.name + " " + tag.fps + "fps " + tag.direction +
    (tag.loop ? " loop" : tag.hold_key ? " hold" : " once");
  ctx.clearRect(0, 0, ST.cell, ST.cell);
  if (!seq.length || !seq[head]) return;
  const step = seq[head];
  withAtlas((sheet) => {
    ctx.clearRect(0, 0, ST.cell, ST.cell);
    ctx.drawImage(sheet, step.xy[0], step.xy[1], ST.cell, ST.cell, 0, 0, ST.cell, ST.cell);
  });
}

// Compare answers what onion skinning cannot: drift between two cells that are NOT neighbours.
// The ghost only ever shows the cell either side.
function drawCompare() {
  const cv = el("cmp"), ctx = fitCanvas(cv);
  ctx.clearRect(0, 0, ST.cell, ST.cell);
  if (!pinned) { el("rightcap").textContent = "compare — nothing pinned"; return; }
  const tag = ST.tags.find((t) => t.name === pinned.tag);
  const c = tag && tag.cells[pinned.i];
  el("rightcap").textContent = "compare — " + pinned.tag + " cell " + (pinned.i + 1) +
    (c ? " · seed " + c.seed : " · gone");
  if (!c || c.atlas === null) return;
  const url = cellUrl(pinned.tag, pinned.i, c.atlas);
  const im = cached(url);
  if (im) ctx.drawImage(im, 0, 0, ST.cell, ST.cell);
  else withCell(url, () => { if (compare) drawCompare(); });
}

el("o-on").onclick = () => { onion.on = !onion.on; renderStage(); };
el("o-prev").onclick = () => { onion.prev = !onion.prev; onion.on = true; renderStage(); };
el("o-next").onclick = () => { onion.next = !onion.next; onion.on = true; renderStage(); };
el("o-mode").onclick = () => cycleOnionMode();
function cycleOnionMode() {
  const modes = ["alpha", "outline", "difference"];
  onion.mode = modes[(modes.indexOf(onion.mode) + 1) % modes.length];
  renderStage();
}
function toggleCompare() {
  compare = !compare;
  if (compare && !pinned) pinned = {tag: tagName, i: sel};
  renderStage();
}
function pinHere() {
  pinned = {tag: tagName, i: sel};
  if (compare) drawCompare();
  tick("pinned " + pinned.tag + " cell " + (pinned.i + 1) + " for compare");
}
el("b-compare").onclick = toggleCompare;
el("b-pin").onclick = pinHere;


// --- the pipeline rail ---------------------------------------------------------------------
// Seven chips for seven step KINDS, in the order the work happens. Clip, frames, picks and
// repaint are scoped to the SELECTED TAG — the tag bar is the scoping control, so switching tag
// re-scopes four of the seven chips and nothing else moves.
//
// Everything drawn here is read straight off `/api/state`'s step records: their params, their
// `key` against their `built_key`, the reason the Durable Object gives for a stale one, and the
// price the packer wrote into the manifest. This page computes no staleness of its own — a
// second answer would be free to disagree with the two that already exist.
const KINDS = ["plate", "clip", "frames", "picks", "repaint", "pack", "export"];
const SCOPED = ["clip", "frames", "picks", "repaint"];
// Every kind with an agent job type. A plate is uploaded and an export is streamed on request,
// so those two are the only chips whose Run stays dead.
const RUNNABLE = ["clip", "frames", "picks", "repaint", "pack"];
const BASE_SEED = 77;

let stepOpen = null;                  // which chip owns the inspector, or null for the cell
let LOCKS = null;                     // the prompt templates, read-only, from the agent
const RUNS = new Map();               // job id -> the step kind this page ran

const stepsOf = (kind) => (ST.steps || []).filter(
  (s) => s.kind === kind && (!SCOPED.includes(kind) || s.tag === tagName));

// A price, not a promise: the manifest's `cost_s` is what the packer measured a step of this kind
// to cost, and a chip covering ten repaints says so rather than pretending one number covers it.
function priceOf(list) {
  if (!list.length) return {text: "—", free: true};
  const each = list[0].cost_s;
  if (!each) return {text: "free", free: true};
  return {text: "~" + each + "s" + (list.length > 1 ? " × " + list.length : ""), free: false};
}

// A kind is RUNNING when a live job would rebuild it. The job says which type it is, so this is
// read off the queue rather than guessed: a clip, an extraction and a re-pick all set
// `generates`, and inferring the kind from that flag alone would have lit the repaint chip for
// all three. A `pack` job is the repack every cheap edit coalesces into, and a `repaint` job ends
// in one too — but a clip, an extraction and a pick do not touch the atlas at all.
const JOB_OF_KIND = {clip: "clip", frames: "extract", picks: "picks", repaint: "repaint",
                     pack: "pack"};
function runningKind(kind) {
  const want = JOB_OF_KIND[kind];
  for (const j of JOBS) {
    if (!LIVE.includes(j.state)) continue;
    const jk = j.kind || "pack";
    if (kind === "pack") {
      if (jk === "pack" || jk === "repaint") return true;
      continue;
    }
    if (jk !== want) continue;
    if (SCOPED.includes(kind) && j.tag && j.tag !== tagName) continue;
    return true;
  }
  return false;
}

function renderRail() {
  const host = el("pipe");
  host.innerHTML = "";
  KINDS.forEach((kind, n) => {
    if (n) {
      const a = document.createElement("span");
      a.className = "parrow";
      a.textContent = "›";
      host.appendChild(a);
    }
    const list = stepsOf(kind), stale = list.filter((x) => x.stale);
    const run = runningKind(kind), price = priceOf(list);
    const b = document.createElement("button");
    b.className = "pchip" + (stepOpen === kind ? " on" : "") +
                  (run ? " running" : stale.length ? " stale" : " fresh");
    b.innerHTML = '<i class="dot"></i><span class="who"></span>' +
                  (SCOPED.includes(kind) ? '<span class="ptag"></span>' : "") +
                  '<span class="' + (price.free ? "free" : "price") + '"></span>';
    b.querySelector(".who").textContent = kind;
    // The orphan count rides on the chip that owns the tray, so a re-run that parked somebody's
    // pivot nudge says so from the rail — without needing the panel open to find out.
    const orph = trayOf(tagName).length;
    if (kind === "picks" && orph) {
      const badge = document.createElement("span");
      badge.className = "orph";
      badge.textContent = String(orph);
      badge.title = orph + " orphaned frame" + (orph === 1 ? "" : "s") + " in the tray";
      b.appendChild(badge);
    }
    if (SCOPED.includes(kind)) b.querySelector(".ptag").textContent = tagName;
    b.querySelector(price.free ? ".free" : ".price").textContent = price.text;
    b.title = kind + (SCOPED.includes(kind) ? "(" + tagName + ")" : "") + " — " +
      (run ? "running now"
           : stale.length ? stale.length + " of " + list.length + " stale: " + stale[0].reason
                          : "fresh") +
      " · " + price.text + (price.free ? "" : " to re-run");
    b.onclick = () => openStep(kind);
    host.appendChild(b);
  });
}

function openStep(kind) {
  stepOpen = stepOpen === kind ? null : kind;
  // A chip whose panel cannot be seen is a dead click. The inspector auto-collapses below 1180px,
  // so opening a step overrides that for as long as the step is open.
  fit();
  renderRail();
  renderInspector();
  if (phone && stepOpen) setScreen("rail");
}

// --- what each step exposes ------------------------------------------------------------------
// The locked column of DESIGN-pipeline.md's table. Every reason in quotes is lifted from the
// cast-sprites skill's "numbers that are load-bearing" table; the few constants the skill does not
// list carry the reason from the module that declares them. None of it is re-worded here, and
// there is deliberately no control beside any of it: overriding a measured constant is an
// explicit named deviation, and this stage does not build that flow.
function lockRow(name, value, why, text) {
  const d = document.createElement("div");
  d.className = "lock";
  d.innerHTML = "<b></b> <span class=v></span><span class=why></span>" +
                (text ? "<span class=txt></span>" : "");
  d.querySelector("b").textContent = name;
  d.querySelector(".v").textContent = value;
  d.querySelector(".why").textContent = why;
  if (text) d.querySelector(".txt").textContent = text;
  return d;
}

function row(label, control, note) {
  const d = document.createElement("div");
  d.className = "srow";
  const l = document.createElement("label");
  l.textContent = label;
  d.appendChild(l);
  d.appendChild(control);
  if (note) {
    const n = document.createElement("div");
    n.className = "why0";
    n.textContent = note;
    d.appendChild(n);
  }
  return d;
}

// One editable param. Committed on change, never on keystroke: a recipe is a paragraph and a
// mutation per character typed would be a revision per character typed.
function textField(value, onSave) {
  const t = document.createElement("textarea");
  t.value = value;
  t.onchange = () => { if (t.value.trim() !== value.trim()) onSave(t.value.trim()); };
  return t;
}
function checkField(label, value, onSave) {
  const w = document.createElement("div");
  w.className = "check";
  const i = document.createElement("input");
  i.type = "checkbox";
  i.checked = !!value;
  i.onchange = () => onSave(i.checked);
  const t = document.createElement("span");
  t.textContent = label;
  w.appendChild(i);
  w.appendChild(t);
  return w;
}
function numberField(value, min, max, onSave) {
  const i = document.createElement("input");
  i.type = "number";
  i.min = String(min);
  i.max = String(max);
  i.value = String(value);
  i.onchange = () => {
    const v = parseInt(i.value, 10);
    if (v === value) return;
    if (!Number.isInteger(v) || v < min || v > max) {
      i.value = String(value);
      tick("that must be a whole number between " + min + " and " + max, true);
      return;
    }
    onSave(v);
  };
  return i;
}
function selectField(options, value, onSave) {
  const sel = document.createElement("select");
  options.forEach(([v, label], i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = label;
    if (canonSame(v, value)) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => onSave(options[+sel.value][0]);
  return sel;
}
const canonSame = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// The one mutation every editable param goes through. It is `generates: false` and it queues
// NOTHING unless the pack's own key moved — a re-worded recipe invalidates a 170-second render
// this fleet cannot run, and quietly repacking in answer to it would be the cascade the design
// forbids.
function saveParam(kind, field, value, label) {
  mutate("/api/step", {kind, field, value}, label, "tag", []);
}

function stepArt(src) {
  const im = document.createElement("img");
  im.id = "stepart";
  im.alt = "step artifact";
  im.src = src;
  return im;
}

function renderStep(kind) {
  const list = stepsOf(kind), body = el("stepbody"), one = list[0];
  const stale = list.filter((x) => x.stale);
  const tag = TAG();
  const price = priceOf(list);
  el("steplbl").textContent = kind + (SCOPED.includes(kind) ? " · " + tagName : "") +
    " — " + (stale.length ? "stale" : "fresh");
  body.innerHTML = "";
  if (!one) { body.textContent = "no " + kind + " step in this manifest"; return; }

  const why = document.createElement("div");
  why.className = "facts";
  why.innerHTML = "<b></b> · <span></span>";
  why.querySelector("b").textContent = stale.length
    ? stale.length + " of " + list.length + " stale" : list.length + " fresh";
  why.querySelector("span").textContent = (stale.length ? stale[0].reason + " · " : "") + price.text;
  body.appendChild(why);

  // Run sits at the TOP, under the status it acts on. Below the params it was under the fold of
  // a panel of locked constants, which is a button nobody can reach on the screen where they have
  // just read that the step is stale.
  const go = document.createElement("button");
  go.className = "cost";
  go.style.margin = "6px 0 10px";
  go.textContent = "Run " + kind + (SCOPED.includes(kind) ? "(" + tagName + ")" : "") + "…";
  go.title = stale.length ? "price it first — nothing runs until the receipt is confirmed"
                          : "every " + kind + " step there is already fresh";
  go.disabled = !stale.length;
  go.onclick = () => openReceipt(kind);
  body.appendChild(go);

  const p = one.params;
  if (kind === "plate") {
    if (one.artifact) body.appendChild(stepArt(imgUrl(one.artifact, 300)));
    body.appendChild(lockRow("the key colour", "flat magenta",
      "the magenta is a blank keying screen, so the packer can key it out"));
    body.appendChild(lockRow("the compositing graph", "hidden", "not a knob on this page"));
    const n = document.createElement("div");
    n.className = "why0";
    n.textContent = "a plate is uploaded, never computed. Replacing the file changes its hash, " +
      "which marks every clip stale — that is the signal that matters.";
    body.appendChild(n);
  } else if (kind === "clip") {
    // The poster frame, not the mp4. There is no <video> on this page and there must not be one:
    // the first extracted frame is already a PNG on disk and an <img> beats an iOS mp4 seek.
    // `has` is not `got`: the poster is claimed before it is fetched, so a null placeholder would
    // ask the agent for path=null and log a failed request on every open.
    if (POSTER.get(tagName)) body.appendChild(stepArt(imgUrl(POSTER.get(tagName), 300)));
    body.appendChild(row("recipe text",
      textField(p.recipe_text, (v) => saveParam("clip", "recipe_text", v, tagName + " recipe")),
      "the words this move is briefed with. In the clip's cache key."));
    body.appendChild(row("trait line",
      textField(p.trait, (v) => saveParam("clip", "trait", v, cid + " trait")),
      "the character's, not the tag's — editing it marks EVERY move's clip stale."));
    body.appendChild(row("cyclic", checkField("this move ends where it began",
      p.cyclic, (v) => saveParam("clip", "cyclic", v, tagName + " cyclic")),
      "a cycle is left unpinned and its cells are picked by gait period."));
    body.appendChild(lockRow("render", p.size + "² at " + p.steps + " steps",
      "at 512²/10 the character is ~240px in a soft frame and no packing recovers it"));
    body.appendChild(lockRow("length", p.length + " frames",
      "the clip length every recipe is briefed against; it is in the clip's cache key"));
    body.appendChild(lockRow("seed", String(p.seed) + ", one locked seed",
      "independent generations otherwise wander off-model"));
    body.appendChild(lockRow("the idle pin", "one-shots only",
      "pinning a cycle's end measured 20x worse"));
    if (LOCKS) {
      body.appendChild(lockRow("SPRITE_LOCK", "assembled, read-only",
        "the staging and identity lock every clip is briefed with", LOCKS.sprite_lock));
      body.appendChild(lockRow("STAGE_RESTATE", "assembled, read-only",
        "a long move line pushes the staging clause out of effective range and H3 quietly swaps " +
        "the keying screen for aged paper", LOCKS.stage_restate));
      body.appendChild(lockRow("SOUND_LOCK", "assembled, read-only",
        "H3 is a joint video+audio model; a prompt with no sound clause leaves the audio head to " +
        "invent garbled human vocalisations, which also degrades the picture", LOCKS.sound_lock));
    }
  } else if (kind === "frames") {
    if (POSTER.get(tagName)) body.appendChild(stepArt(imgUrl(POSTER.get(tagName), 300)));
    const n = document.createElement("div");
    n.className = "why0";
    n.textContent = "nothing here is editable. Extraction is a consequence of the clip.";
    body.appendChild(n);
    body.appendChild(lockRow("frame count", "set by the clip",
      "the extraction reads the whole clip; it is not a choice"));
    body.appendChild(lockRow("skip", String(p.skip),
      "settle-in frames pick_frames drops; not offerable as a re-pick"));
  } else if (kind === "picks") {
    const c = CUR();
    if (c) body.appendChild(stepArt(imgUrl(c.src, 300)));
    body.appendChild(row("cell count",
      numberField(p.cells, 2, 24, (v) => saveParam("picks", "cells", v, tagName + " cells")),
      "how many cells the next picks run chooses. The tag has " + tag.cells.length +
      " on disk today; changing this marks picks stale and picks nothing."));
    body.appendChild(row("cycle", checkField("detect a gait period",
      p.cycle, (v) => saveParam("picks", "cyclic", v, tagName + " cyclic")),
      "the same manifest field the clip chip calls cyclic — one fact, one place."));
    const b = document.createElement("button");
    b.className = "cost";
    b.innerHTML = "P Re-pick cell " + (sel + 1) + "… <span class=\"price\">· ~45s GPU</span>";
    b.title = "the source-frame scrubber, for this one cell";
    b.onclick = () => openRepick();
    body.appendChild(b);
    body.appendChild(renderTray());
    body.appendChild(lockRow("CYCLE_SCORE_MAX", "0.09",
      "absolute; a relative version is worse, see references"));
    body.appendChild(lockRow("anchor / smooth", p.anchor + " · " + p.smooth,
      "motion-energy internals; the pick is made on the clip, not here"));
  } else if (kind === "repaint") {
    body.appendChild(row("seed, per cell", (() => {
      const w = document.createElement("div");
      w.className = "why0";
      w.textContent = "cell " + (sel + 1) + " is on seed " + (CUR() ? CUR().seed : "—") +
        ". Re-roll and the painted variants are below — that is the editable seed.";
      return w;
    })()));
    body.appendChild(lockRow("PAD", String(p.pad),
      "the repaint draws him LARGER than he arrived; without margin his hair clips the frame"));
    body.appendChild(lockRow("sampler", p.steps + " steps · cfg " + p.cfg + " · " + p.sampler +
      " · " + p.scheduler + " · denoise " + p.denoise,
      "in every drawing's cache key; changing one re-keys the whole set"));
    if (LOCKS) {
      body.appendChild(lockRow("the repaint prompt", "per template, read-only",
        "it says repaint three ways on purpose: the failure mode is Qwen treating the frame as " +
        "inspiration and drawing a fresh pose", LOCKS.repaint));
      body.appendChild(lockRow("the negative", "read-only",
        "the other half of that same door", LOCKS.negative));
    }
  } else if (kind === "pack") {
    body.appendChild(row("fps", (() => {
      const i = numberField(tag.fps, 1, 60, () => {});
      i.onchange = () => {
        const v = parseInt(i.value, 10);
        if (!Number.isInteger(v) || v < 1) { i.value = String(tag.fps); return; }
        mutate("/api/tag", {fps: v, direction: tag.direction},
               tagName + " at " + v + "fps " + tag.direction, "tag", []);
      };
      return i;
    })(), "playback, so it lives in the pack's key and in no key above it."));
    body.appendChild(row("direction", selectField(
      [["forward", "forward"], ["reverse", "reverse"], ["pingpong", "pingpong"]], tag.direction,
      (v) => mutate("/api/tag", {fps: tag.fps, direction: v},
                    tagName + " at " + tag.fps + "fps " + v, "tag", []))));
    body.appendChild(row("loop", checkField("loop this tag", tag.loop,
      (v) => saveParam("pack", "loop", v, tagName + " loop"))));
    body.appendChild(row("hold on the last cell", checkField("freeze while the key is down",
      tag.hold_key, (v) => saveParam("pack", "hold_key", v, tagName + " hold_key"))));
    body.appendChild(row("unify", selectField(
      [[false, "none"], ["head", "head width"], [true, "total height"]], packUnify(),
      (v) => saveParam("pack", "unify", v, tagName + " unify")),
      "head normalises drift between independent repaints. A move whose height IS the animation " +
      "— jump, crouch — must stay on none."));
    body.appendChild(lockRow("pivot", ST.pivot.join(","),
      "drag it on the cell canvas; it is the ground line the whole character is packed against"));
    body.appendChild(lockRow("the unify clamp", "±6%",
      "past that it is a mis-measurement, and acting on it distorts the drawing"));
    body.appendChild(lockRow("ANCHOR_PULL", "3px",
      "smooths matte shimmer, never enough to move a footfall"));
    body.appendChild(lockRow("the feet line", "94% of the cell",
      "so “fits the cell” ≠ “fits above the feet”"));
    body.appendChild(lockRow("scale caps", p.height_cap + " tall · " + p.up_cap + " up",
      "the tallest cell fills this much of the cell, and the highest reach fits in that much " +
      "above the pivot"));
    body.appendChild(lockRow("tag names", tag.name,
      "renaming a tag orphans its extracted frames, so nothing renames one yet"));
  } else if (kind === "export") {
    const b = document.createElement("button");
    b.textContent = "↓ Export…";
    b.title = "every format, computed on request";
    b.onclick = openExport;
    body.appendChild(b);
    const names = list.map((x) => x.params.format).join(", ");
    body.appendChild(lockRow("formats", names, "each one is a pure function of the atlas"));
    body.appendChild(lockRow("the naming rule", "<cid>-atlas-hash.json, <cid>-phaser3.json, …",
      "the server names and types each file, so a download keeps the name it chose"));
  }

}

// --- the orphan tray ---------------------------------------------------------------------------
// DESIGN-pipeline.md: a re-run NEVER deletes a hand edit, it orphans it visibly. This is the
// visible part. Everything in here came off a frame this tag used to have, and the only two ways
// out are a person restoring it onto a live cell or a person collecting it — nothing on this page
// or in the Durable Object ever empties it on its own.
const trayOf = (tag) => (ST.tray || []).filter((e) => e.tag === tag);
const droppedOf = (tag) => (ST.dropped || []).filter((e) => e.tag === tag);

// Where a source frame sits in the clip, off the name `pick_frames` extracted it under. The same
// rule the Durable Object matches by, and it is only used here to say WHICH frame an edit came
// from and to offer the nearest live cell as the default place to put it back.
function srcTime(src) {
  const m = /(?:^|\/)f_(\d+)\.png$/.exec(src || "");
  return m ? parseInt(m[1], 10) : null;
}

// The frame's name as it is ON DISK, zero-padded. A bare `f_11` beside a directory full of
// `f_0011.png` is a second spelling of the same thing, and this panel exists to let a person go
// and look at the frame an edit came from.
const frameName = (t) => "f_" + String(t).padStart(4, "0");

const nudged = (n) => n && (n[0] || n[1]) ? (n[0] > 0 ? "+" + n[0] : n[0]) + "," +
  (n[1] > 0 ? "+" + n[1] : n[1]) : null;

// What a person actually put on this frame by hand, as words. A tray entry with none of them is
// still kept and still shown — the tray holds FRAMES, not just edits, so that "which frame did
// this come from" has an answer — but it says so rather than pretending an edit was lost.
function editWords(e) {
  const bits = [];
  if (e.seed !== BASE_SEED) bits.push("seed " + e.seed);
  if (e.hold > 1) bits.push("hold " + e.hold);
  const n = nudged(e.pivot_nudge);
  if (n) bits.push("nudge " + n);
  return bits.length ? bits.join(" · ") : "no hand edits";
}

function renderTray() {
