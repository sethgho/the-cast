<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the workbench</title>
<style>
/* The paint is the old page's, deliberately. What changed is the WORKFLOW (DESIGN-workbench.md);
   re-colouring at the same time would make it impossible to say which change did what. */
:root {
  color-scheme: dark;
  --bg: #14120f; --ink: #e8e2d8; --dim: #8d8371; --faint: #6b6152;
  --gold: #d8a657; --rust: #b4462f; --cream: #efe9d8;
  --panel: #1a1713; --sunk: #221d17; --line: #332e27;
  --green: #79a06a; --grey: #4a443b;
  --rail: 64px;
  --panelmax: 600px;
  --gutter: 24px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink);
       font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
h1, h2, h3 { font-size: 12px; font-weight: 700; margin: 0; letter-spacing: .04em; }
button { font: 600 11px/1 ui-monospace, monospace; color: var(--ink); background: var(--sunk);
         border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:disabled { opacity: .42; cursor: default; }
textarea, input[type=text], input[type=number], select {
  font: 12px/1.4 ui-monospace, monospace; color: var(--ink); background: var(--sunk);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px; width: 100%; }
textarea { resize: vertical; }
a { color: var(--gold); }
.grow { flex: 1 1 auto; min-width: 0; }
.dim { color: var(--dim); }
.faint { color: var(--faint); }
.gold { color: var(--gold); }
.err { color: var(--rust); }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }

/* The one staleness code. A solid dot is the step whose own input changed; a hollow dot is
   everything downstream of it. Nothing else on this page dims, washes or tints for staleness. */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block;
       border: 1px solid transparent; }
.dot.green { background: var(--green); }
.dot.grey  { background: var(--grey); }
.dot.solid { background: var(--gold); }
.dot.hollow{ background: none; border-color: var(--gold); }
.dot.run   { background: var(--gold); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

/* A stale OUTPUT carries a 2px amber top border and one line saying why. Same code, same colour,
   no second signal. */
.stale-out { border-top: 2px solid var(--gold); }
.stale-why { color: var(--gold); padding: 4px 0 6px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.checker { background-color: var(--cream);
  background-image: linear-gradient(45deg, #ded8c6 25%, transparent 25%, transparent 75%, #ded8c6 75%),
                    linear-gradient(45deg, #ded8c6 25%, transparent 25%, transparent 75%, #ded8c6 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px; }

/* --- home ------------------------------------------------------------------------------- */
#home { height: 100%; overflow: auto; padding: 24px; }
#hgrid { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 20px; }
.chr { width: 200px; display: flex; flex-direction: column; align-items: center; gap: 8px;
       background: none; border: none; padding: 8px; }
.chr .plate { width: 160px; height: 160px; border-radius: 50%; overflow: hidden;
              display: flex; align-items: center; justify-content: center; }
.chr .plate img { width: 100%; height: 100%; object-fit: contain; }
.chr .nm { font-size: 14px; font-weight: 700; }
.chr .strip { display: flex; gap: 4px; }
#newchr { width: 200px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
#review { margin-top: 28px; }
#review li { margin: 4px 0; }

/* --- bench shell ------------------------------------------------------------------------ */
#bench { height: 100%; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
         grid-template-rows: 48px minmax(0, 1fr); }

#topbar { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 0 8px;
          background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
#topbar .crumb { color: var(--faint); }
#queueline { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#traybadge .n { color: var(--bg); background: var(--gold); border-radius: 8px;
                padding: 1px 5px; margin-left: 4px; font-weight: 700; }

/* --- the animation rail ------------------------------------------------------------------ */
#rail { grid-row: 2; background: var(--panel); border-right: 1px solid var(--line);
        width: var(--rail); overflow: hidden auto; padding: 6px 0; position: relative; z-index: 6; }
#rail:hover { width: 240px; box-shadow: 6px 0 18px #0008; }
.anim { width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 8px;
        background: none; border: none; border-left: 2px solid transparent; }
.anim.on { border-left-color: var(--gold); background: var(--sunk); }
.anim .thumb { width: 48px; height: 48px; flex: none; border-radius: 3px; overflow: hidden;
               display: flex; align-items: center; justify-content: center; }
.anim .thumb img { width: 100%; height: 100%; object-fit: contain; }
.anim .meta { display: none; text-align: left; min-width: 0; }
#rail:hover .anim .meta { display: block; }
.anim .strip { display: flex; gap: 1px; margin-top: 3px; justify-content: center; }
.anim .strip .dot { width: 6px; height: 6px; }
.anim .nm { font-size: 12px; font-weight: 700; }
.anim .col { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: none; }

/* --- the stack: result, trace, chips, judgment -------------------------------------------- */
#stack { grid-row: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

#result { height: 224px; flex: none; display: flex; gap: 12px; padding: 8px 12px;
          border-bottom: 1px solid var(--line); min-width: 0; }
#loopbox { width: 268px; flex: none; display: flex; flex-direction: column; gap: 6px; }
#loopcv { width: 268px; height: 172px; border-radius: 4px; display: block; }
#zoom { display: flex; gap: 4px; }
#zoom button { padding: 3px 7px; }
#zoom button.on { border-color: var(--gold); color: var(--gold); }
#film { flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden;
        display: flex; gap: 6px; align-items: flex-start; padding-bottom: 4px; }
.fcell { flex: none; width: 96px; background: none; border: 1px solid var(--line);
         border-radius: 4px; padding: 0; overflow: hidden; }
.fcell.on { border-color: var(--gold); }
.fcell .art { width: 94px; height: 94px; display: flex; align-items: center; justify-content: center; }
.fcell .art img { width: 100%; height: 100%; object-fit: contain; }
.fcell .lbl { display: block; padding: 2px 0; color: var(--dim); }
.fcell.on .lbl { color: var(--gold); }
#away { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 6px; }

#trace { height: 72px; flex: none; display: flex; align-items: center; gap: 8px;
         padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.tr { width: 56px; height: 56px; flex: none; padding: 0; border: 1px solid var(--line);
      border-radius: 4px; overflow: hidden; position: relative; }
.tr img { width: 100%; height: 100%; object-fit: contain; }
.tr.on { border-color: var(--gold); }
.tr .cap { position: absolute; left: 0; right: 0; bottom: 0; background: #000a; font-size: 9px;
           color: var(--ink); }
.tr.void { color: var(--faint); font-size: 9px; display: flex; align-items: center;
           justify-content: center; }

#chips { height: 44px; flex: none; display: flex; align-items: center; gap: 6px;
         padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 9px; }
.chip.on { border-color: var(--gold); color: var(--gold); background: var(--panel); }
.chip .price { color: var(--faint); font-weight: 400; }
.chip.on .price { color: var(--dim); }

#judge { flex: 1 1 auto; min-height: 0; display: flex; gap: var(--gutter);
         padding: 14px 12px; overflow: hidden; }
.panel { flex: 1 1 0; min-width: 0; max-width: var(--panelmax); overflow: auto;
         display: flex; flex-direction: column; gap: 10px; }
#judge.wide .panel { max-width: none; }
.phead { display: flex; align-items: center; gap: 8px; color: var(--dim); }
.phead .side { color: var(--faint); }
.big { width: 100%; max-width: var(--panelmax); border-radius: 4px; }
.big.contain { object-fit: contain; }
figure { margin: 0; }

/* --- controls under the panels ------------------------------------------------------------ */
.ctl { display: flex; flex-direction: column; gap: 6px; }
.ctl label { color: var(--dim); }
/* Sticky at the foot of the panel it belongs to. It is still UNDER the output, which is where the
   design puts it, but a 600px plate or a 600px clip is taller than the panel — and a re-run button
   you have to scroll to find is one somebody presses without having read what it costs. */
.runbar { display: flex; flex-direction: column; gap: 6px; position: sticky; bottom: 0;
          background: var(--bg); padding-top: 8px; }
#confirm { background: var(--sunk); border: 1px solid var(--gold); border-radius: 4px;
           padding: 8px; display: flex; flex-direction: column; gap: 6px; }
#confirm b { color: var(--gold); }

/* --- the 61-tick filmstrip and the gait curve --------------------------------------------- */
.ticks { position: relative; height: 34px; background: var(--sunk); border: 1px solid var(--line);
         border-radius: 4px; display: flex; align-items: flex-end; touch-action: none; }
.tick { flex: 1 1 0; height: 12px; border-right: 1px solid #0003; }
.tick.on { background: var(--gold); height: 100%; }
.tick.pick { background: var(--dim); height: 22px; }
.gait { display: block; width: 100%; height: 56px; background: var(--sunk);
        border: 1px solid var(--line); border-top: none; border-radius: 0 0 4px 4px; }
/* Two rows, staggered. Ten picks inside a 23-frame gait period sit about 2% apart, so a
   single row of flags is a pile nobody can grab one of. */
.flags { position: relative; height: 44px; }
.flag { position: absolute; top: 0; transform: translateX(-50%); display: flex; align-items: center;
        gap: 2px; padding: 2px 4px; background: var(--panel); border: 1px solid var(--gold);
        border-radius: 3px; color: var(--gold); cursor: ew-resize; touch-action: none;
        white-space: nowrap; }
.flag.on { background: var(--gold); color: var(--bg); }
.flag .x { cursor: pointer; padding: 0 2px; }

.stills { display: grid; grid-template-columns: repeat(6, 88px); gap: 4px; }
.still { width: 88px; height: 88px; padding: 0; border: 1px solid var(--line); border-radius: 3px;
         overflow: hidden; position: relative; }
.still img { width: 100%; height: 100%; object-fit: contain; }
.still.pick { border-color: var(--gold); }
.still.on { outline: 2px solid var(--gold); outline-offset: -2px; }
.still .n { position: absolute; left: 0; bottom: 0; background: #000a; font-size: 9px; padding: 0 2px; }

.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick140 { width: 140px; padding: 0; border: 1px solid var(--line); border-radius: 4px;
           overflow: hidden; }
.pick140 .art { width: 138px; height: 138px; display: flex; }
.pick140 img { width: 100%; height: 100%; object-fit: contain; }
.pick140.on { border-color: var(--gold); }
.pick140 .lbl { display: block; padding: 3px 0; color: var(--dim); }

/* --- the repaint grid: one column per pick, and NOT a pair -------------------------------- */
#rgrid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
.rcol { flex: none; width: 160px; display: flex; flex-direction: column; gap: 6px; }
.rcol.on { outline: 1px solid var(--gold); outline-offset: 4px; border-radius: 3px; }
.rcol .sq { width: 160px; height: 120px; border-radius: 3px; display: flex;
            align-items: center; justify-content: center; overflow: hidden; }
.rcol .sq img { width: 100%; height: 100%; object-fit: contain; }
.shelf { display: flex; flex-wrap: wrap; gap: 4px; }
.seed { width: 72px; padding: 0; border: 1px solid var(--line); border-radius: 3px;
        overflow: hidden; }
.seed .art { width: 70px; height: 70px; display: flex; }
.seed img { width: 100%; height: 100%; object-fit: contain; }
.seed.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.seed .lbl { display: block; font-size: 9px; color: var(--dim); }

/* --- pack ---------------------------------------------------------------------------------- */
#pivotcv { width: 300px; height: 300px; border-radius: 4px; display: block; touch-action: none;
           cursor: crosshair; }
#atlasbox { position: relative; width: 100%; max-width: var(--panelmax); }
#atlasbox img, #atlasbox canvas { display: block; width: 100%; }
#atlasbox canvas { position: absolute; inset: 0; }

/* --- queue, tray, toast --------------------------------------------------------------------- */
#queuepop { position: fixed; top: 48px; right: 8px; width: 280px; z-index: 20; padding: 8px;
            display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow: auto; }
.job { display: flex; align-items: center; gap: 6px; }
.job .lbl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }

#traydrawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 60vh;
              overflow: auto; padding: 10px 12px; border-radius: 8px 8px 0 0;
              transform: translateY(100%); transition: transform .2s ease-out; }
#traydrawer.open { transform: none; }
.trayrow { display: flex; align-items: center; gap: 10px; padding: 6px 0;
           border-top: 1px solid var(--line); }
.trayrow .art { width: 56px; height: 56px; flex: none; }
.trayrow .art img { width: 100%; height: 100%; object-fit: contain; }

#toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 40;
         background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
         padding: 7px 12px; max-width: 90vw; }
#toast:empty { display: none; }

#flip { display: none; }

/* --- the phone: review and approve only ----------------------------------------------------- */
@media (max-width: 760px) {
  :root { --rail: 0px; --gutter: 0px; }
  #bench { grid-template-columns: minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr); }
  #rail { display: none; }
  #topbar { grid-column: 1; }
  #stack { grid-row: 2; }
  #result { height: auto; flex-direction: column; align-items: stretch; }
  #loopbox, #loopcv { width: 100%; }
  #judge { padding: 10px; }
  .panel { max-width: none; }
  .panel.off { display: none; }
  #flip { display: inline-flex; }
  /* Everything that needs a pointer, a keyboard or a steady hand is GONE, not merely small. */
  .ctl textarea, .ctl input, .ctl select, .flag, #pivotcv, #newchr { display: none !important; }
  .stills { grid-template-columns: repeat(3, 88px); }
}
</style>
</head>
<body>

<main id="home" hidden>
  <div class="row"><h1>the cast · sprites</h1><span class="grow"></span><span id="hstat" class="dim"></span></div>
  <div id="hgrid"></div>
  <section id="review"></section>
</main>

<main id="bench" hidden>
  <header id="topbar">
    <button id="b-home" title="every character">▤</button>
    <button id="sw-char"></button>
    <span class="crumb">›</span>
    <button id="sw-anim"></button>
    <span class="grow"></span>
    <button id="queueline"></button>
    <button id="traybadge"></button>
  </header>
  <nav id="rail"></nav>
  <div id="stack">
    <section id="result"></section>
    <div id="trace" hidden></div>
    <nav id="chips"></nav>
    <section id="judge"></section>
  </div>
</main>

<div id="queuepop" class="card" hidden></div>
<div id="traydrawer" class="card"></div>
<div id="toast"></div>

<script>
"use strict";

// Two origins, and the split is the point. This page and every mutation come from celld, which
// owns the manifest and the job queue; every PIXEL comes from the wilson agent, because the cells,
// the source frames, the clips and the atlas are files on the machine with the GPU.
let AGENT = "";

// The seven steps, in pipeline order. The chip row, the rail's dot strip and the "N steps away"
// count are all this one list, so there is exactly one place that knows what the pipeline is.
const STEPS = ["plate", "clip", "frames", "picks", "repaint", "pack", "export"];
// Which agent job type each step becomes, mirroring worker.js JOB_KIND. An export is streamed off
// the atlas on request, so it has no job and no re-run button.
const RUNNABLE = ["plate", "clip", "frames", "picks", "repaint", "pack"];
const LIVE = ["queued", "claimed", "running"];
const BASE_SEED = 77;

// The result loop draws at GAME size: a 512px cell shown at 88px is about how tall this character
// stands in the demo. 2x and 4x are for looking at ink, and they deliberately overflow the box —
// the sprite is anchored on its feet, so zooming inspects the drawing without moving the ground.
const GAME_PX = 120;

const el = (id) => document.getElementById(id);
const h = (tag, props, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n[k] = v;
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) {
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
};
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };

function toast(msg, bad) {
  const t = el("toast");
  t.textContent = msg || "";
  t.className = bad ? "err" : "";
  clearTimeout(toast.t);
  if (msg) toast.t = setTimeout(() => { if (t.textContent === msg) t.textContent = ""; }, 6000);
}

// --- the image cache -------------------------------------------------------------------------
// The agent answers every image with `Cache-Control: no-store` — correct, because a repack
// overwrites cells in place, and a cached crop is the most likely way this page lies about what
// is on disk. But a page that re-renders on every selection would then refetch sixty images per
// click. So each URL is fetched exactly once into an object URL, and the whole cache is dropped
// when the revision moves, which is the only moment the files can have changed.
const ART = new Map();
function artUrl(u) {
  const hit = ART.get(u);
  if (hit) return hit;
  const p = fetch(u).then((r) => {
    if (!r.ok) throw new Error(String(r.status));
    return r.blob();
  }).then((b) => {
    const o = URL.createObjectURL(b);
    ART.set(u, o);
    return o;
  }).catch((e) => { ART.delete(u); throw e; });
  ART.set(u, p);
  return p;
}
function dropArt() {
  const old = [];
  for (const v of ART.values()) if (typeof v === "string") old.push(v);
  ART.clear();
  // Revoked LATE, and that is the whole point: the <img> elements holding these are only replaced
  // when the render AFTER this call finishes, and revoking a blob that a half-loaded image is
  // still reading turns into a failed request. Revoking one an image has already decoded is free.
  setTimeout(() => { for (const u of old) URL.revokeObjectURL(u); }, 15000);
}
// An <img> that never issues a second request for the same file. `alt` stays empty on purpose:
// these are drawings being judged, and a text fallback in the middle of a filmstrip is noise.
function pic(url, cls) {
  // `data-src` keeps the FILE this element is showing addressable after the blob URL replaces it.
  // The blob says nothing about which drawing it is, and "which drawing is this" is the question
  // the whole page exists to answer.
  const i = h("img", { class: cls || "", alt: "", "data-src": url });
  Promise.resolve(artUrl(url)).then((o) => { i.src = o; }).catch(() => { i.replaceWith(h("span", { class: "faint", text: "missing" })); });
  return i;
}
const imgUrl = (p, w) => AGENT + "/img?path=" + encodeURIComponent(p) + (w ? "&w=" + w : "");
const cellUrl = (cid, atlas, w) =>
  AGENT + "/cell?cid=" + cid + "&i=" + atlas + (w ? "&w=" + w : "") + "&v=" + (ST ? ST.revision : 0);

// --- state ------------------------------------------------------------------------------------
let ST = null;            // the selected character's manifest state, merged with the agent's files
let ROSTER = [];          // every character id on the fleet
let HOME = new Map();     // cid -> state, for the home grid
let JOBS = [];
let GAIT = null;          // {frames, energy, period} for the selected move, or null while loading
let SRC = [];             // every offerable source frame of the selected move

let route = { view: "home", cid: null, anim: null, step: null };
let sel = 0;              // the selected cell, by index within its tag
let pinned = false;       // the trace strip
let zoom = 1;
let scrub = 0;            // which source frame the frames/picks filmstrip is parked on
let confirming = null;    // {kind, tag} while a priced re-run confirm is open
let queueOpen = false, trayOpen = false, phoneSide = "right";
let slideFrom = 0;        // +1 walked downstream, -1 walked upstream, 0 arrived cold
let poll = null;

const isPhone = () => window.matchMedia("(max-width: 760px)").matches;
const TAG = () => ST && (ST.tags.find((t) => t.name === route.anim) || ST.tags[0]);
const CELLS = () => (TAG() ? TAG().cells : []);
const CUR = () => CELLS()[sel] || null;

// --- the step model ---------------------------------------------------------------------------
// Every step record for one chip. `plate` and `pack` belong to the CHARACTER and `export` is a set
// of formats over the atlas; the other four belong to one move. That scoping is worker.js's, not
// this page's invention — `run` refuses a tag on a step that does not have one.
function recs(kind, anim) {
  if (!ST) return [];
  if (kind === "plate") return ST.steps.filter((s) => s.id === "plate");
  if (kind === "pack") return ST.steps.filter((s) => s.id === "pack");
  if (kind === "export") return ST.steps.filter((s) => s.kind === "export");
  return ST.steps.filter((s) => s.kind === kind && s.tag === (anim || route.anim));
}
function running(kind, anim) {
  const want = kind === "frames" ? "extract" : kind;
  return JOBS.some((j) => LIVE.includes(j.state) && j.kind === want &&
    (j.tag === null || j.tag === (anim || route.anim)));
}
// THE staleness code, and the only one. Solid means this step's own params or inputs moved;
// hollow means it is only stale because something upstream is; grey means nothing was ever built.
function dotOf(kind, anim) {
  if (running(kind, anim)) return "run";
  const rs = recs(kind, anim);
  if (!rs.length) return "grey";
  let solid = false, hollow = false, empty = false;
  for (const s of rs) {
    if (!s.stale) continue;
    if (s.reason === "never built") empty = true;
    else if (s.reason === "params or inputs changed") solid = true;
    else hollow = true;
  }
  return solid ? "solid" : hollow ? "hollow" : empty ? "grey" : "green";
}
function fmtTime(s) {
  if (!s) return "free";
  if (s < 60) return "~" + s + "s";
  const m = Math.floor(s / 60), r = s % 60;
  return "~" + m + "m" + (r ? " " + r + "s" : "");
}
// What one press of this step's re-run button really costs, counted off the records that would
// actually run. A repaint only paints the cells whose drawing is MISSING — the packer caches by
// file name — so a stale-for-another-reason repaint costs a repack and says so.
function priceOf(kind, anim) {
  const stale = recs(kind, anim).filter((s) => s.stale);
  if (!stale.length) return 0;
  if (kind === "repaint") {
    const paints = stale.filter((s) => s.built_key === null).length;
    return paints ? paints * ST.cost_s.repaint : ST.cost_s.pack;
  }
  return stale.length * ST.cost_s[kind];
}
// What a FULL run of this step costs, stale or not. The chip row prices the pipeline; the button
// under the right panel prices the work that is actually outstanding, and the two differ whenever
// half a move is already painted.
function fullPrice(kind) {
  if (!ST || !RUNNABLE.includes(kind)) return 0;
  if (kind === "repaint") return CELLS().length * ST.cost_s.repaint;
  return ST.cost_s[kind];
}
const downstream = (kind) => STEPS.slice(STEPS.indexOf(kind) + 1);
function stepsAway(anim) {
  return STEPS.filter((k) => k !== "export" && dotOf(k, anim) !== "green").length;
}
const artifactOf = (kind, anim) => {
  const s = recs(kind, anim)[0];
  return s && s.artifact && s.built_key !== null ? s.artifact : null;
};

// --- data --------------------------------------------------------------------------------------
// The manifest comes from the character's Durable Object; where the packer put each cell, what it
// measures and which repaints exist on disk all come from the agent, because all three are answers
// about files. Merged by tag name and cell index — the atlas index is the agent's alone.
async function loadCharacter(cid) {
  const r = await fetch("/api/state?cid=" + encodeURIComponent(cid));
  const st = await r.json();
  if (st.error) throw new Error(st.error);
  AGENT = st.agent;
  ROSTER = st.characters;
  let derived = null;
  try {
    const d = await fetch(AGENT + "/derived?cid=" + encodeURIComponent(cid));
    const got = await d.json();
    if (!got.error) derived = got;
  } catch (e) { /* the merge below reads every derived field through `derived &&` */ }
  if (!derived) toast("the wilson agent is unreachable at " + AGENT + " — no cells, no atlas, no seeds", true);
  st.atlas = derived ? derived.atlas : null;
  for (const tag of st.tags) {
    const dt = derived && derived.tags[tag.name];
    tag.cells.forEach((c, i) => {
      const dc = dt && dt.cells[i];
      c.atlas = dc ? dc.atlas : null;
      c.metrics = dc ? dc.metrics : null;
      // Newest first: a seed shelf is a history, and a seed is a random 31-bit number that orders
      // by nothing a person can read. `at` is the repaint file's own mtime.
      c.variants = dc ? dc.variants.slice().sort((a, b) => b.at - a.at) : [];
    });
  }
  return st;
}

// The source frames and the gait curve of ONE move. Both are read-only measurements of files, both
// are asked for only when the frames step has actually been built — a request for a directory that
// does not exist would be a failed request on a brand-new character's page.
async function loadMove() {
  SRC = [];
  GAIT = null;
  if (!artifactOf("frames")) return;
  const q = "?cid=" + encodeURIComponent(route.cid) + "&tag=" + encodeURIComponent(route.anim);
  try {
    const [f, g] = await Promise.all([
      fetch(AGENT + "/frames" + q).then((r) => r.json()),
      fetch(AGENT + "/gait" + q).then((r) => r.json()),
    ]);
    SRC = f.frames || [];
    GAIT = g;
  } catch (e) {
    toast("could not read the extracted frames: " + e.message, true);
  }
  scrub = Math.min(scrub, Math.max(0, SRC.length - 1));
}

async function loadJobs() {
  if (!route.cid) return;
  try {
    const r = await fetch("/api/jobs?cid=" + encodeURIComponent(route.cid));
    const j = await r.json();
    if (j.error) return;
    const wasLive = JOBS.filter((x) => LIVE.includes(x.state)).map((x) => x.id).join();
    JOBS = j.jobs;
    const nowLive = JOBS.filter((x) => LIVE.includes(x.state)).map((x) => x.id).join();
    // A job that has just left the queue rewrote files. Nothing else can, so this is the only
    // moment the image cache is wrong — and reloading on every poll would refetch the atlas
    // every two seconds forever.
    if (wasLive !== nowLive && wasLive !== "") { await reload(); return; }
    drawQueue();
  } catch (e) { /* a poll that cannot reach celld says so on the next mutation, not every 2s */ }
}

async function reload() {
  dropArt();
  ST = await loadCharacter(route.cid);
  if (!ST.tags.some((t) => t.name === route.anim)) route.anim = ST.tags[0].name;
  sel = Math.min(sel, Math.max(0, CELLS().length - 1));
  await loadMove();
  renderBench();
}

// --- routing -----------------------------------------------------------------------------------
// /c/:char/a/:anim/s/:step. Every state of the bench is a link, and the back button walks the
// chips backwards — which is the same direction the panels slide.
function parse(path) {
  const m = /^\/c\/([a-z0-9-]+)\/a\/([a-z0-9-]+)\/s\/([a-z]+)$/.exec(path);
  if (!m || !STEPS.includes(m[3])) return { view: "home", cid: null, anim: null, step: null };
  return { view: "bench", cid: m[1], anim: m[2], step: m[3] };
}
const href = (cid, anim, step) => "/c/" + cid + "/a/" + anim + "/s/" + step;
function go(path, replace) {
  if (path === location.pathname) return;
  history[replace ? "replaceState" : "pushState"]({}, "", path);
  render();
}

async function render() {
  const want = parse(location.pathname);
  const sameChar = ST && want.cid === route.cid;
  const sameMove = sameChar && want.anim === route.anim;
  slideFrom = route.view === "bench" && want.view === "bench" && sameMove && want.step !== route.step
    ? Math.sign(STEPS.indexOf(want.step) - STEPS.indexOf(route.step)) : 0;
  route = want;
  el("home").hidden = want.view !== "home";
  el("bench").hidden = want.view !== "bench";
  el("queuepop").hidden = true;
  queueOpen = false;
  confirming = null;
  if (want.view === "home") {
    clearInterval(poll); poll = null;
    await renderHome();
    return;
  }
  if (!sameChar) { ST = null; JOBS = []; sel = 0; pinned = false; dropArt(); }
  if (!ST) {
    try { ST = await loadCharacter(route.cid); }
    catch (e) { toast(e.message, true); go("/", true); return; }
  }
  if (!ST.tags.some((t) => t.name === route.anim)) {
    go(href(route.cid, ST.tags[0].name, route.step), true);
    return;
  }
  if (!sameMove) { sel = 0; scrub = 0; }
  if (!sameMove || GAIT === null) await loadMove();
  renderBench();
  if (!poll) poll = setInterval(loadJobs, 2000);
  loadJobs();
}

// --- home ---------------------------------------------------------------------------------------
async function renderHome() {
  const grid = clear(el("hgrid"));
  el("hstat").textContent = "reading the roster…";
  let first;
  try {
    const r = await fetch("/api/state");
    first = await r.json();
    if (first.error) throw new Error(first.error);
  } catch (e) { el("hstat").textContent = e.message; return; }
  AGENT = first.agent;
  ROSTER = first.characters;
  HOME = new Map();
  for (const cid of ROSTER) {
    try { HOME.set(cid, await loadCharacter(cid)); } catch (e) { HOME.set(cid, null); }
  }
  el("hstat").textContent = ROSTER.length + " characters";

  const saved = ST;
  for (const cid of ROSTER) {
    const st = HOME.get(cid);
    ST = st;                                   // dotOf/recs read the character being drawn
    const built = st ? st.tags.filter((t) => t.cells.length).length : 0;
    const plate = st ? (st.steps.find((s) => s.id === "plate") || {}).artifact : null;
    const strip = h("div", { class: "strip" },
      st ? STEPS.map((k) => h("span", { class: "dot " + dotOf(k, st.tags[0].name), title: k })) : []);
    grid.append(h("button", {
      class: "chr", onclick: () => go(href(cid, st ? st.tags[0].name : "walk", "plate")),
    },
      h("div", { class: "plate checker" }, plate ? pic(imgUrl(plate, 320)) : h("span", { class: "faint", text: "no plate" })),
      h("span", { class: "nm", text: st && st.name ? st.name : cid }),
      h("span", { class: "dim", text: st ? st.tags.length + " animations · " + built + " with cells" : "unreadable" }),
      strip));
  }
  ST = saved;
  grid.append(newCharacterCard());
  renderReview();
}

function renderReview() {
  const box = clear(el("review"));
  if (!isPhone()) return;                       // the phone's own screen: what somebody must look at
  const saved = ST;
  const rows = [];
  for (const cid of ROSTER) {
    const st = HOME.get(cid);
    if (!st) continue;
    ST = st;
    for (const t of st.tags) {
      const bad = STEPS.filter((k) => dotOf(k, t.name) === "solid");
      if (bad.length) rows.push({ cid, anim: t.name, bad });
    }
  }
  ST = saved;
  box.append(h("h2", { text: "needs review" }));
  if (!rows.length) { box.append(h("p", { class: "faint", text: "nothing is stale." })); return; }
  const ul = h("ul");
  for (const r of rows) {
    ul.append(h("li", {}, h("a", {
      href: href(r.cid, r.anim, r.bad[0]),
      onclick: (e) => { e.preventDefault(); go(href(r.cid, r.anim, r.bad[0])); },
      text: r.cid + " · " + r.anim + " · " + r.bad.join(", "),
    })));
  }
  box.append(ul);
}

// A new subject: an image and one sentence on how they move. It creates the character and NOTHING
// else — no clip, no picks, no atlas. Every one of those is a priced run on the bench afterwards.
function newCharacterCard() {
  const idIn = h("input", { type: "text", placeholder: "id, e.g. gnome" });
  const nameIn = h("input", { type: "text", placeholder: "display name" });
  const file = h("input", { type: "file", accept: "image/png,image/jpeg" });
  const trait = h("textarea", { rows: 4, placeholder: "one sentence on how they move" });
  const btn = h("button", { text: "create" });
  btn.onclick = async () => {
    const cid = idIn.value.trim().toLowerCase();
    if (!cid || !file.files[0] || !nameIn.value.trim() || !trait.value.trim()) {
      toast("an id, a name, an image and one sentence", true); return;
    }
    btn.disabled = true;
    try {
      const defs = await (await fetch(AGENT + "/defaults")).json();
      const up = await fetch(AGENT + "/upload", {
        method: "POST", headers: { "Content-Type": "image/png" }, body: file.files[0],
      });
      const staged = await up.json();
      if (staged.error) throw new Error(staged.error);
      const moves = Object.entries(defs.moves).map(([name, m]) => ({ name, ...m }));
      const r = await fetch("/api/character", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cid, name: nameIn.value.trim(), trait: trait.value.trim(),
          source: staged.path, cell: defs.cell, pivot: defs.pivot, build: defs.build, moves }),
      });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      go(href(cid, moves[0].name, "plate"));
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  };
  return h("div", { id: "newchr", class: "card" },
    h("h2", { text: "a new subject" }), idIn, nameIn, file, trait, btn);
}

// --- the bench ------------------------------------------------------------------------------------
function renderBench() {
  renderTop();
  renderRail();
  renderResult();
  renderTrace();
  renderChips();
  renderJudge();
  renderTray();
}

function renderTop() {
  el("sw-char").textContent = (ST.name || ST.character) + " ▾";
  el("sw-char").onclick = () => menu(el("sw-char"), ROSTER.map((c) => ({
    text: c, on: c === route.cid, act: () => go(href(c, "walk", route.step)),
  })));
  el("sw-anim").textContent = route.anim + " ▾";
  el("sw-anim").onclick = () => menu(el("sw-anim"), ST.tags.map((t) => ({
    text: t.name + " · " + t.cells.length + " cells", on: t.name === route.anim,
    act: () => go(href(route.cid, t.name, route.step)),
  })));
  el("b-home").onclick = () => go("/");
  el("queueline").onclick = () => { queueOpen = !queueOpen; drawQueue(); };
  el("traybadge").onclick = () => { trayOpen = !trayOpen; renderTray(); };
  drawQueue();
}

function menu(anchor, items) {
  const old = el("menu");
  if (old) old.remove();
  const box = h("div", { id: "menu", class: "card", style:
    "position:fixed;z-index:30;padding:4px;display:flex;flex-direction:column;gap:2px" });
  for (const it of items) {
    box.append(h("button", { text: (it.on ? "• " : "  ") + it.text, style: "text-align:left",
      onclick: () => { box.remove(); it.act(); } }));
  }
  document.body.append(box);
  const r = anchor.getBoundingClientRect();
  box.style.left = r.left + "px";
  box.style.top = (r.bottom + 4) + "px";
  setTimeout(() => document.addEventListener("pointerdown", function once(e) {
    if (!box.contains(e.target)) { box.remove(); document.removeEventListener("pointerdown", once); }
  }), 0);
}

// The rail: this character's animations, each under its own seven-dot pipeline strip. Hovering
// widens it to 240px for the names and it snaps back on click, so the bench never loses width to
// a list somebody reads once.
let railLoops = [], railTimer = null;
function renderRail() {
  const rail = clear(el("rail"));
  railLoops = [];
  for (const t of ST.tags) {
    const packed = t.cells.filter((x) => x.atlas !== null);
    const c = packed[0];
    // A 48px LOOP, not a still: the rail's job is to answer "which move is this" at a glance, and
    // a walk and a run are the same drawing standing still.
    const loop = { img: null, urls: [], at: 0 };
    if (packed.length > 1) {
      railLoops.push(loop);
      for (const cc of packed) {
        const k = loop.urls.length;
        loop.urls.push(null);
        Promise.resolve(artUrl(cellUrl(route.cid, cc.atlas, 96))).then((o) => { loop.urls[k] = o; })
          .catch(() => { /* a cell that will not load simply never appears in the loop */ });
      }
    }
    rail.append(h("button", {
      class: "anim" + (t.name === route.anim ? " on" : ""),
      onclick: () => { el("rail").blur(); go(href(route.cid, t.name, route.step)); },
    },
      h("div", { class: "col" },
        h("div", { class: "thumb checker" }, c ? (loop.img = pic(cellUrl(route.cid, c.atlas, 96))) : h("span", { class: "faint", text: "—" })),
        h("div", { class: "strip" }, STEPS.map((k) => h("span", { class: "dot " + dotOf(k, t.name), title: k })))),
      h("div", { class: "meta" },
        h("div", { class: "nm", text: t.name }),
        h("div", { class: "dim", text: t.cells.length + " cells · " + t.fps + "fps · " + t.direction }))));
  }
  clearInterval(railTimer);
  railTimer = railLoops.length ? setInterval(() => {
    for (const l of railLoops) {
      if (!l.img || !document.body.contains(l.img)) continue;
      l.at = (l.at + 1) % l.urls.length;
      const u = l.urls[l.at];
      if (u) l.img.src = u;
    }
  }, 110) : null;
}

// --- the result strip -----------------------------------------------------------------------------
let loopSeq = [], loopAt = 0, loopNext = 0, loopRaf = null;
const loopImgs = new Map();

function sequence(tag) {
  const n = tag.cells.length;
  if (!n) return [];
  let order = tag.cells.map((c, i) => i);
  if (tag.direction === "reverse") order = order.slice().reverse();
  else if (tag.direction === "pingpong" && n > 2) order = order.concat(order.slice(1, -1).reverse());
  const seq = [];
  for (const i of order) for (let k = 0; k < Math.max(1, tag.cells[i].hold || 1); k++) seq.push(i);
  return seq;
}

function renderResult() {
  const box = clear(el("result"));
  const tag = TAG();
  const packed = tag.cells.filter((c) => c.atlas !== null);
  cancelAnimationFrame(loopRaf);
  loopRaf = null;

  if (!packed.length) {
    // Never packed. A silhouette and the distance, because "nothing here yet" is the state this
    // page is most often opened in and the old one answered it with an empty box.
    box.append(h("div", { class: "checker", style:
      "width:268px;height:172px;border-radius:4px;display:flex;align-items:center;justify-content:center" },
      // `h` builds HTML elements, so the silhouette is set as markup rather than composed: an
      // <svg> made with createElement is in the wrong namespace and draws nothing at all.
      h("div", { html: '<svg viewBox="0 0 40 60" width="60" height="90" aria-hidden="true">' +
        '<path fill="#c9c2ae" d="M20 4a7 7 0 110 14 7 7 0 010-14zM8 22h24l4 20-6 2-2-8v22h-6V38h-4v20h-6V36l-2 8-6-2z"/></svg>' })));
    box.append(h("div", { id: "away" },
      h("div", { class: "gold", text: "you are " + stepsAway(route.anim) + " steps away" }),
      h("div", { class: "dim", text: route.anim + " has no packed cells. Walk the chips and run the first step that is not green." })));
    return;
  }

  const cv = h("canvas", { id: "loopcv", class: "checker" });
  const zoombar = h("div", { id: "zoom" }, [1, 2, 4].map((z) => h("button", {
    class: z === zoom ? "on" : "", text: z + "x", onclick: () => { zoom = z; renderResult(); },
  })));
  box.append(h("div", { id: "loopbox" }, cv, zoombar,
    h("div", { class: "dim", text: tag.fps + "fps " + tag.direction + " · " + packed.length + " cells" })));

  const film = h("div", { id: "film" });
  tag.cells.forEach((c, i) => {
    film.append(h("button", {
      class: "fcell" + (i === sel ? " on" : ""),
      title: "cell " + (i + 1) + " · seed " + c.seed,
      onclick: () => { sel = i; pinned = true; renderResult(); renderTrace(); renderJudge(); },
    },
      h("div", { class: "art checker" }, c.atlas !== null
        ? pic(cellUrl(route.cid, c.atlas, 192))
        : h("span", { class: "faint", text: "unpacked" })),
      h("span", { class: "lbl", text: (i + 1) + (c.hold > 1 ? " ×" + c.hold : "") })));
  });
  box.append(film);

  loopSeq = sequence(tag);
  loopAt = 0;
  loopNext = 0;
  loopImgs.clear();
  for (const c of tag.cells) {
    if (c.atlas === null) continue;
    const u = cellUrl(route.cid, c.atlas, 256);
    Promise.resolve(artUrl(u)).then((o) => {
      const im = new Image();
      im.onload = () => loopImgs.set(c.atlas, im);
      im.src = o;
    }).catch(() => { /* an unreadable cell simply does not draw; the film strip already says so */ });
  }
  const ctx = cv.getContext("2d");
  const step = (t) => {
    if (!document.body.contains(cv)) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = Math.round(268 * dpr), hh = Math.round(172 * dpr);
    if (cv.width !== w) { cv.width = w; cv.height = hh; }
    if (t >= loopNext) {
      loopNext = t + 1000 / Math.max(1, tag.fps);
      loopAt = (loopAt + 1) % Math.max(1, loopSeq.length);
    }
    const c = tag.cells[loopSeq[loopAt]];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, 268, 172);
    const im = c && c.atlas !== null ? loopImgs.get(c.atlas) : null;
    if (im) {
      const size = GAME_PX * zoom;
      // Anchored on the pivot, not centred: the whole point of a ground line is that zooming and
      // switching cell must not move the feet.
      const px = ST.pivot[0] / ST.cell, py = ST.pivot[1] / ST.cell;
      ctx.drawImage(im, 268 / 2 - size * px, 150 - size * py, size, size);
    }
    loopRaf = requestAnimationFrame(step);
  };
  loopRaf = requestAnimationFrame(step);
}

// --- trace ------------------------------------------------------------------------------------------
// The one cross-step view, pinned rather than hidden: this cell at every step it exists at, each
// thumbnail a jump to that step with the cell already selected.
function renderTrace() {
  const box = el("trace");
  const c = CUR();
  box.hidden = !(pinned && c);
  if (box.hidden) return;
  clear(box);
  box.append(h("span", { class: "dim", text: "cell " + (sel + 1) + " through the pipeline" }));
  const legs = [
    { step: "frames", cap: "source", url: c.src ? imgUrl(c.src, 128) : null },
    { step: "picks", cap: "pick", url: c.src ? imgUrl(c.src, 128) : null },
    { step: "repaint", cap: "repaint", url: c.png ? imgUrl(c.png, 128) : null },
    { step: "pack", cap: "packed", url: c.atlas !== null ? cellUrl(route.cid, c.atlas, 128) : null },
  ];
  for (const leg of legs) {
    if (!leg.url) { box.append(h("div", { class: "tr void", text: leg.cap + "\nnone" })); continue; }
    box.append(h("button", {
      class: "tr checker" + (leg.step === route.step ? " on" : ""),
      title: "cell " + (sel + 1) + " at the " + leg.step + " step",
      onclick: () => go(href(route.cid, route.anim, leg.step)),
    }, pic(leg.url), h("span", { class: "cap", text: leg.cap })));
  }
  box.append(h("span", { class: "grow" }));
  box.append(h("button", { text: "unpin", onclick: () => { pinned = false; renderTrace(); } }));
}

// --- the chip row -------------------------------------------------------------------------------------
function renderChips() {
  const box = clear(el("chips"));
  for (const k of STEPS) {
    const price = RUNNABLE.includes(k) ? fullPrice(k) : 0;
    box.append(h("button", {
      class: "chip" + (k === route.step ? " on" : ""),
      onclick: () => go(href(route.cid, route.anim, k)),
    },
      h("span", { class: "dot " + dotOf(k) }), k,
      h("span", { class: "price", text: price ? fmtTime(price) : "—" })));
  }
}

// --- the judgment area ---------------------------------------------------------------------------------
// Two panels, and one rule: the LEFT panel of any step is the RIGHT panel of the previous step.
// Walking the chips leftward is walking upstream, and the slide is what teaches it.
function renderJudge() {
  const box = clear(el("judge"));
  box.className = route.step === "repaint" ? "wide" : "";
  const built = VIEWS[route.step]();
  if (built.wide) {
    box.append(built.wide);
  } else {
    const left = h("div", { class: "panel" + (isPhone() && phoneSide !== "left" ? " off" : "") },
      h("div", { class: "phead" }, h("span", { class: "side", text: "input" }), built.leftTitle || "",
        h("span", { class: "grow" }),
        isPhone() ? h("button", { id: "flip", text: "output ▸", onclick: () => { phoneSide = "right"; renderJudge(); } }) : ""),
      built.left);
    const right = h("div", { class: "panel" + (isPhone() && phoneSide !== "right" ? " off" : "") },
      h("div", { class: "phead" }, h("span", { class: "side", text: "output" }), built.rightTitle || "",
        h("span", { class: "grow" }),
        isPhone() ? h("button", { id: "flip", text: "◂ input", onclick: () => { phoneSide = "left"; renderJudge(); } }) : ""),
      built.right);
    box.append(left, right);
  }
  if (slideFrom) {
    box.animate([{ transform: "translateX(" + (slideFrom * 42) + "px)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 200, easing: "ease-out" });
    slideFrom = 0;
  }
}

// The stale banner: a 2px amber top border and ONE line saying why. It is the same code as the
// dots, not a second one.
function staleBanner(kind) {
  const rs = recs(kind).filter((s) => s.stale);
  if (!rs.length) return null;
  const own = rs.find((s) => s.reason === "params or inputs changed");
  const line = own ? "stale — its params or inputs changed since this was built"
    : rs.every((s) => s.reason === "never built") ? "never built"
    : "stale — " + rs[0].reason;
  return h("div", { class: "stale-out stale-why", text: line });
}

// One re-run button, priced in plain time, under the right panel. Clicking opens an inline confirm
// that states the price and what goes stale; nothing runs until that confirm is pressed, and
// nothing downstream ever runs on its own.
function runBar(kind) {
  if (!RUNNABLE.includes(kind)) return h("div", { class: "faint", text: "an export is streamed off the atlas — there is nothing to run." });
  const price = priceOf(kind);
  const bar = h("div", { class: "runbar" });
  // Only the step DIRECTLY upstream, and only within the same scope. `pack` is character-wide —
  // it packs every move in one atlas — so an unpainted move it is not about must not block it.
  const FEEDS = { clip: "plate", frames: "clip", picks: "frames", repaint: "picks" };
  const blocked = FEEDS[kind] && dotOf(FEEDS[kind]) === "grey" ? FEEDS[kind] : null;
  if (blocked) {
    bar.append(h("button", { disabled: true, text: "re-run " + kind + " · " + blocked + " has to run first" }));
    return bar;
  }
  if (!price) {
    bar.append(h("button", { disabled: true, text: "re-run " + kind + " · already fresh" }));
    return bar;
  }
  const btn = h("button", { text: "re-run " + kind + " · " + fmtTime(price) });
  btn.onclick = () => { confirming = confirming ? null : { kind }; renderJudge(); };
  bar.append(btn);
  if (!confirming || confirming.kind !== kind) return bar;

  const goes = downstream(kind).filter((k) => recs(k).length);
  const edits = kind === "clip" ? CELLS().filter((c) =>
    (c.seed !== BASE_SEED) || (c.hold || 1) > 1 || c.pivot_nudge[0] || c.pivot_nudge[1]).length : 0;
  const c = h("div", { id: "confirm" },
    h("div", {}, "this costs ", h("b", { text: fmtTime(price) }), " of the one GPU, serially."),
    h("div", { class: "dim", text: goes.length ? "it makes stale: " + goes.join(", ") + " — and none of them will run on their own."
      : "nothing downstream of it exists yet." }));
  if (kind === "clip") {
    c.append(h("div", {}, h("b", { text: edits + " cell edit" + (edits === 1 ? "" : "s") + " cannot be carried" }),
      " — a new clip re-picks every cell, and any hand edit whose pose does not land within 3 frames of a new pick moves to the tray."));
  }
  c.append(h("div", { class: "row" },
    h("button", { text: "run it", onclick: () => runStep(kind) }),
    h("button", { text: "cancel", onclick: () => { confirming = null; renderJudge(); } })));
  bar.append(c);
  return bar;
}

async function runStep(kind) {
  confirming = null;
  const body = { cid: route.cid, kind };
  if (!["plate", "pack"].includes(kind)) body.tag = route.anim;
  try {
    const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    toast(j.job.label + " — queued");
    JOBS = JOBS.filter((x) => x.id !== j.job.id).concat([j.job]);
  } catch (e) { toast(e.message, true); }
  renderJudge();
  drawQueue();
}

// Every free edit goes through here. It commits to the manifest before it answers, so it returns
// in about 200ms; what follows is a repack, never a paint.
async function mutate(op, body, label) {
  try {
    const r = await fetch("/api/" + op, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cid: route.cid, tag: route.anim, ...body }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    toast(label + (j.job ? " — queued for the next repack" : " — recorded · what it invalidated is now stale, and nothing is queued"));
    await reload();
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

// The 61-tick filmstrip. `drag` is what the frames step uses to scrub and what the picks step
// hangs its flags over, so both build it from here and there is one definition of where tick i is.
function tickRow(onScrub) {
  const n = SRC.length;
  const picked = new Set(CELLS().map((c) => c.src));
  const row = h("div", { class: "ticks" });
  for (let i = 0; i < n; i++) {
    row.append(h("div", {
      class: "tick" + (i === scrub ? " on" : picked.has(SRC[i]) ? " pick" : ""),
      title: SRC[i].split("/").pop(),
    }));
  }
  if (onScrub) {
    const at = (e) => {
      const r = row.getBoundingClientRect();
      const i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n)));
      if (i !== scrub) { scrub = i; onScrub(i); }
    };
    row.onpointerdown = (e) => { row.setPointerCapture(e.pointerId); at(e); };
    row.onpointermove = (e) => { if (row.hasPointerCapture(e.pointerId)) at(e); };
  }
  return row;
}

VIEWS.frames = () => {
  const n = SRC.length;
  const preview = h("div", { class: "checker", style:
    "width:100%;max-width:360px;aspect-ratio:1;border-radius:4px;display:flex" });
  const paint = () => {
    clear(preview);
    if (n) preview.append(pic(imgUrl(SRC[scrub], 360), "big contain"));
  };
  const caption = h("div", { class: "dim" });
  const say = () => { caption.textContent = n ? "frame " + (scrub + 1) + " of " + n + " · " + SRC[scrub].split("/").pop() : ""; };
  const row = tickRow(() => { paint(); say(); mark(); });
  paint(); say();

  const left = h("div", { class: "ctl" }, preview, row, caption,
    h("div", { class: "faint", text: n ? "drag the strip to scrub." : "no frames have been extracted for " + route.anim + " yet." }));

  const grid = h("div", { class: "stills" });
  const picked = new Set(CELLS().map((c) => c.src));
  SRC.forEach((p, i) => {
    grid.append(h("button", {
      class: "still checker" + (picked.has(p) ? " pick" : "") + (i === scrub ? " on" : ""),
      onclick: () => { scrub = i; paint(); say(); mark(); },
    }, pic(imgUrl(p, 88)), h("span", { class: "n", text: String(i + 1) })));
  });
  const mark = () => {
    [...grid.children].forEach((b, i) => b.classList.toggle("on", i === scrub));
    [...row.children].forEach((t, i) => t.classList.toggle("on", i === scrub));
  };
  const right = h("div", {}, staleBanner("frames") || "",
    n ? grid : h("div", { class: "faint", text: "nothing extracted yet." }), runBar("frames"));
  return { left, right, leftTitle: "the clip, tick by tick", rightTitle: n + " stills" };
};

VIEWS.picks = () => {
  const n = SRC.length;
  const cells = CELLS();
  const row = tickRow(null);
  const curve = h("canvas", { class: "gait" });
  const flags = h("div", { class: "flags" });

  // The gait curve, under the strip: how much of the silhouette moved into each frame, and the
  // detected gait period as verticals. A flag sitting in a trough is a cell drawn on a held pose;
  // one on a peak is a cell drawn on a blur. That judgement had no evidence on the page before.
  const drawCurve = () => {
    const w = curve.clientWidth || 560, hh = 56;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    curve.width = Math.round(w * dpr); curve.height = Math.round(hh * dpr);
    const g = curve.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, hh);
    const e = GAIT && GAIT.energy.length ? GAIT.energy : null;
    if (!e) return;
    if (GAIT.period) {
      g.strokeStyle = "#4a443b";
      for (let x = 0; x < e.length; x += GAIT.period) {
        const px = (x + 0.5) / e.length * w;
        g.beginPath(); g.moveTo(px, 0); g.lineTo(px, hh); g.stroke();
      }
    }
    g.strokeStyle = "#d8a657";
    g.lineWidth = 1.5;
    g.beginPath();
    e.forEach((v, i) => {
      const px = (i + 0.5) / e.length * w, py = hh - 3 - v * (hh - 8);
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    });
    g.stroke();
  };

  const placeFlags = () => {
    clear(flags);
    cells.forEach((c, i) => {
      const at = SRC.indexOf(c.src);
      if (at < 0) return;
      const f = h("div", {
        class: "flag" + (i === sel ? " on" : ""),
        style: "left:" + ((at + 0.5) / n * 100) + "%;top:" + (i % 2 ? 22 : 0) + "px",
        title: "cell " + (i + 1) + " is drawn from " + c.src.split("/").pop(),
      }, String(i + 1),
        h("span", { class: "x", text: "×", title: "remove this cell — free" }));
      f.querySelector(".x").onpointerdown = (e) => e.stopPropagation();
      f.querySelector(".x").onclick = (e) => {
        e.stopPropagation();
        if (cells.length <= 1) { toast("a move cannot have zero cells", true); return; }
        mutate("drop", { index: i }, "drop cell " + (i + 1));
      };
      // Dragging a flag proposes a RE-PICK, which paints — so it lands on the same priced confirm
      // every other GPU action does rather than committing 45 seconds on a mouse-up.
      f.onpointerdown = (ev) => {
        f.setPointerCapture(ev.pointerId);
        sel = i;
        let to = at;
        const move = (e) => {
          const r = row.getBoundingClientRect();
          to = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n)));
          f.style.left = ((to + 0.5) / n * 100) + "%";
        };
        f.onpointermove = (e) => { if (f.hasPointerCapture(e.pointerId)) move(e); };
        f.onpointerup = () => {
          f.onpointermove = null; f.onpointerup = null;
          if (to === at) { renderJudge(); return; }
          proposeRepick(i, to);
        };
      };
      flags.append(f);
    });
  };

  const cellsIn = h("input", { type: "number", min: 2, max: 24, value: recs("picks")[0].params.cells });
  cellsIn.onchange = () => {
    const v = parseInt(cellsIn.value, 10);
    if (v === recs("picks")[0].params.cells) return;
    mutate("step", { kind: "picks", field: "cells", value: v }, route.anim + " picks " + v + " cells");
  };

  const left = h("div", { class: "ctl" },
    n ? h("div", {}, row, curve, flags) : h("div", { class: "faint", text: "no frames to pick from yet." }),
    h("div", { class: "faint", text: !n ? ""
      : GAIT && GAIT.period
        ? "gait period " + GAIT.period + " frames — the verticals. Drag a flag to re-pick; press × to remove."
        : "not periodic — the picker spaces cells by motion instead. Drag a flag to re-pick; press × to remove." }),
    h("label", {}, "cells ", cellsIn),
    h("div", { class: "faint", text: "changing the count marks picks stale and runs nothing." }));

  const strip = h("div", { class: "picks" });
  cells.forEach((c, i) => {
    const at = SRC.indexOf(c.src);
    strip.append(h("button", {
      class: "pick140" + (i === sel ? " on" : ""),
      onclick: () => { sel = i; pinned = true; renderResult(); renderTrace(); renderJudge(); },
    },
      h("div", { class: "art checker" }, pic(imgUrl(c.src, 140))),
      h("span", { class: "lbl", text: "cell " + (i + 1) + " · frame " + (at >= 0 ? at + 1 : "?") })));
  });
  const right = h("div", {}, staleBanner("picks") || "",
    cells.length ? strip : h("div", { class: "faint", text: "no cells have been picked for " + route.anim + " yet." }),
    runBar("picks"));

  setTimeout(() => { drawCurve(); placeFlags(); }, 0);
  return { left, right, leftTitle: "the strip and the gait", rightTitle: cells.length + " picks" };
};

// A re-pick is the one intervention on the picks strip that costs GPU, so it is priced and
// confirmed exactly like a step re-run.
function proposeRepick(index, to) {
  const c = CELLS()[index];
  const box = clear(el("judge"));
  box.append(h("div", { class: "panel" },
    h("div", { id: "confirm" },
      h("div", {}, "re-pick cell ", h("b", { text: String(index + 1) }), " from frame ",
        h("b", { text: String(to + 1) }), " — ", h("b", { text: fmtTime(ST.cost_s.repaint) }), " of GPU."),
      h("div", { class: "dim", text: "it was drawn from " + c.src.split("/").pop() + " and would be drawn from " + SRC[to].split("/").pop() + "." }),
      h("div", { class: "dim", text: "it makes stale: repaint, pack, export — and none of them will run on their own." }),
      h("div", { class: "row" },
        h("button", { text: "re-pick it", onclick: () => mutate("repick", { index, src: SRC[to] }, "re-pick cell " + (index + 1)) }),
        h("button", { text: "cancel", onclick: renderJudge })))));
}

// Repaint BREAKS THE PAIR, deliberately: one-in-one-out cannot express eight picks times every
// seed ever painted. A column per pick, its seed shelf under it, and the current one ringed.
VIEWS.repaint = () => {
  const cells = CELLS();
  const stale = recs("repaint").filter((s) => s.stale && s.built_key === null).length;
  const grid = h("div", { id: "rgrid" });
  cells.forEach((c, i) => {
    const shelf = h("div", { class: "shelf" });
    for (const v of c.variants) {
      shelf.append(h("button", {
        class: "seed" + (v.png === c.png ? " on" : ""),
        title: "use seed " + v.seed + " — free, nothing is spent",
        disabled: v.png === c.png,
        onclick: () => mutate("use", { index: i, png: v.png }, "cell " + (i + 1) + " on seed " + v.seed),
      }, h("div", { class: "art checker" }, pic(imgUrl(v.png, 144))),
        h("span", { class: "lbl", text: v.seed === BASE_SEED ? "77 first" : String(v.seed) })));
    }
    if (!c.variants.length) shelf.append(h("span", { class: "faint", text: "nothing painted for this frame yet" }));
    const rr = h("button", { text: "re-roll · " + fmtTime(ST.cost_s.repaint) });
    rr.onclick = () => {
      confirming = confirming && confirming.kind === "reroll" && confirming.index === i ? null : { kind: "reroll", index: i };
      renderJudge();
    };
    const col = h("div", { class: "rcol" + (i === sel ? " on" : ""), onclick: (e) => {
      if (e.target.closest("button")) return;
      sel = i; pinned = true; renderResult(); renderTrace(); renderJudge();
    } },
      h("div", { class: "dim", text: "cell " + (i + 1) + " · frame " + (SRC.indexOf(c.src) + 1 || "?") }),
      h("div", { class: "sq checker" }, pic(imgUrl(c.src, 160))),
      h("div", { class: "faint", text: "↓ painted as" }),
      h("div", { class: "sq checker" }, c.png ? pic(imgUrl(c.png, 160)) : h("span", { class: "faint", text: "not painted" })),
      h("div", { class: "faint", text: "seed shelf, newest first" }), shelf, rr);
    if (confirming && confirming.kind === "reroll" && confirming.index === i) {
      col.append(h("div", { id: "confirm" },
        h("div", {}, "a new random seed for cell ", h("b", { text: String(i + 1) }), " — ",
          h("b", { text: fmtTime(ST.cost_s.repaint) }), " of GPU."),
        h("div", { class: "dim", text: "the drawings already on the shelf are never deleted — this adds one." }),
        h("div", { class: "row" },
          h("button", { text: "paint it", onclick: () => mutate("reroll", { index: i }, "re-roll cell " + (i + 1)) }),
          h("button", { text: "cancel", onclick: () => { confirming = null; renderJudge(); } }))));
    }
    grid.append(col);
  });

  const head = h("div", { class: "row wrap" },
    h("span", { class: "dim", text: cells.length
      ? "one column per pick. Clicking a seed swaps it instantly and free."
      : "nothing to paint — this move has no picks yet." }),
    h("span", { class: "grow" }),
    stale ? runBar("repaint")
      : h("span", { class: "faint", text: cells.length ? "every cell is painted" : "" }));
  const wide = h("div", { class: "panel" }, head, staleBanner("repaint") || "",
    cells.length ? grid : h("div", { class: "faint", text: "no cells have been picked for " + route.anim + " yet." }));
  return { wide };
};

VIEWS.pack = () => {
  const cells = CELLS();
  const c = CUR();
  const cv = h("canvas", { id: "pivotcv", class: "checker" });
  const holdIn = h("input", { type: "number", min: 1, max: 12, value: c ? c.hold : 1 });
  holdIn.onchange = () => {
    const v = parseInt(holdIn.value, 10);
    if (!c || v === c.hold) return;
    mutate("hold", { index: sel, hold: v }, "cell " + (sel + 1) + " held " + v + " beats");
  };
  const thumbs = h("div", { class: "row wrap" });
  cells.forEach((cc, i) => {
    thumbs.append(h("button", {
      class: "seed" + (i === sel ? " on" : ""), title: "cell " + (i + 1),
      onclick: () => { sel = i; pinned = true; renderResult(); renderTrace(); renderJudge(); },
    }, h("div", { class: "art checker" }, cc.png ? pic(imgUrl(cc.png, 144)) : h("span", { class: "faint", text: "—" })),
      h("span", { class: "lbl", text: (i + 1) + (cc.hold > 1 ? " ×" + cc.hold : "") })));
  });

  // The pivot crosshair. Dragging moves THIS cell's nudge against the shared ground line; holding
  // shift moves the sheet pivot itself, which re-seats every cell of every move.
  let nudge = c ? c.pivot_nudge.slice() : [0, 0];
  const paint = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(300 * dpr); cv.height = Math.round(300 * dpr);
    const g = cv.getContext("2d");
    g.setTransform(dpr * 300 / ST.cell, 0, 0, dpr * 300 / ST.cell, 0, 0);
    g.clearRect(0, 0, ST.cell, ST.cell);
    if (cv._im) g.drawImage(cv._im, 0, 0, ST.cell, ST.cell);
    const px = ST.pivot[0] + nudge[0], py = ST.pivot[1] + nudge[1];
    g.strokeStyle = "#b4462f"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, ST.pivot[1]); g.lineTo(ST.cell, ST.pivot[1]); g.stroke();
    g.strokeStyle = "#d8a657";
    g.beginPath(); g.moveTo(px - 24, py); g.lineTo(px + 24, py);
    g.moveTo(px, py - 24); g.lineTo(px, py + 24); g.stroke();
  };
  if (c && c.png) {
    Promise.resolve(artUrl(imgUrl(c.png, 512))).then((o) => {
      const im = new Image();
      im.onload = () => { cv._im = im; paint(); };
      im.src = o;
    }).catch(() => paint());
  }
  setTimeout(paint, 0);
  cv.onpointerdown = (ev) => {
    if (!c) return;
    cv.setPointerCapture(ev.pointerId);
    const sheet = ev.shiftKey;
    const at = (e) => {
      const r = cv.getBoundingClientRect();
      const x = Math.round((e.clientX - r.left) / r.width * ST.cell);
      const y = Math.round((e.clientY - r.top) / r.height * ST.cell);
      // The same two numbers either way: an absolute point inside the cell, expressed as an offset
      // from the sheet pivot. What `sheet` changes is which of the two the mouse-up writes.
      nudge = [x - ST.pivot[0], y - ST.pivot[1]];
      paint();
    };
    at(ev);
    cv.onpointermove = (e) => { if (cv.hasPointerCapture(e.pointerId)) at(e); };
    cv.onpointerup = (e) => {
      cv.onpointermove = null; cv.onpointerup = null;
      if (sheet) {
        const p = [ST.pivot[0] + nudge[0], ST.pivot[1] + nudge[1]];
        mutate("pivot", { scope: "sheet", pivot: p }, "the sheet pivot to " + p.join(","));
      } else if (nudge[0] !== c.pivot_nudge[0] || nudge[1] !== c.pivot_nudge[1]) {
        mutate("pivot", { scope: "frame", index: sel, pivot_nudge: nudge },
          "cell " + (sel + 1) + " nudged " + nudge.join(","));
      }
    };
  };

  const left = h("div", { class: "ctl" }, thumbs,
    c ? cv : h("div", { class: "faint", text: "no cells to seat." }),
    c ? h("div", { class: "row wrap" }, h("label", {}, "hold ", holdIn),
      h("span", { class: "faint", text: "drag the crosshair to nudge this cell; hold shift to move the sheet pivot. Both free." })) : "");

  const atlas = artifactOf("pack");
  const box = h("div", { id: "atlasbox" });
  if (atlas) {
    const im = pic(imgUrl(atlas, 600));
    const over = h("canvas");
    box.append(im, over);
    im.onload = () => {
      over.width = im.naturalWidth; over.height = im.naturalHeight;
      over.style.height = im.clientHeight + "px";
      const g = over.getContext("2d");
      g.strokeStyle = "#d8a65788"; g.lineWidth = 1;
      // The cell grid, read off the atlas's own geometry: the packer emits a fixed column count of
      // square cells, so the outlines are the image divided by it — not a second copy of the table.
      const cols = 10, size = im.naturalWidth / cols;
      for (let x = 1; x < cols; x++) { g.beginPath(); g.moveTo(x * size, 0); g.lineTo(x * size, over.height); g.stroke(); }
      for (let y = size; y < over.height; y += size) { g.beginPath(); g.moveTo(0, y); g.lineTo(over.width, y); g.stroke(); }
    };
  }
  const right = h("div", {}, staleBanner("pack") || "",
    atlas ? box : h("div", { class: "faint", text: "nothing has been packed for " + ST.character + " yet." }),
    runBar("pack"));
  return { left, right, leftTitle: "the chosen repaints", rightTitle: "the atlas" };
};

VIEWS.export = () => {
  const atlas = artifactOf("pack");
  const FILES = [
    { fmt: "json-hash", what: "frames keyed by name — Pixi and Phaser loaders branch on exactly this" },
    { fmt: "json-array", what: "frames as an ordered array" },
    { fmt: "phaser3", what: "a Phaser 3 atlas with the tags as animations" },
    { fmt: "godot", what: "a Godot SpriteFrames resource" },
    { fmt: "css", what: "a CSS steps() keyframe set" },
  ];
  const cards = h("div", { class: "ctl" });
  cards.append(h("div", { class: "card", style: "padding:8px" },
    h("div", { class: "gold", text: ST.character + ".png" }),
    h("div", { class: "faint", text: atlas ? "the atlas — one sheet, every move, one shared scale" : "not packed yet" })));
  for (const f of FILES) {
    const s = ST.steps.find((x) => x.id === "export:" + f.fmt);
    cards.append(h("div", { class: "card", style: "padding:8px" },
      h("div", { class: "row" }, h("span", { class: "dot " + (s && !s.stale ? "green" : "grey") }),
        h("span", { class: "gold", text: f.fmt })),
      h("div", { class: "faint", text: f.what })));
  }
  const exportUrl = (fmt) => AGENT + "/export?cid=" + route.cid + "&format=" + fmt;
  const pick = h("select", {}, FILES.map((f) => h("option", { value: f.fmt, text: f.fmt })));
  const dl = (url) => { const a = h("a", { href: url, download: "" }); document.body.append(a); a.click(); a.remove(); };
  const right = h("div", { class: "ctl" },
    staleBanner("export") || "",
    atlas ? h("figure", { class: "checker", style: "border-radius:4px" }, pic(imgUrl(atlas, 600), "big contain"))
      : h("div", { class: "faint", text: "there is no atlas to export yet." }),
    h("div", { class: "row wrap" }, h("label", {}, "data ", pick),
      h("button", { disabled: !atlas, text: "download atlas", onclick: () => dl(imgUrl(atlas, 0) + "&dl=1") }),
      h("button", { disabled: !atlas, text: "download data", onclick: () => dl(exportUrl(pick.value)) }),
      h("button", { disabled: !atlas, text: "download both", onclick: () => { dl(imgUrl(atlas, 0) + "&dl=1"); dl(exportUrl(pick.value)); } })),
    runBar("export"));
  return { left: cards, right, leftTitle: "the files", rightTitle: "download" };
};

// --- the queue ------------------------------------------------------------------------------------
// One line in the top bar, expanding to a list with a cancel on each. Serial, FIFO, no reordering.
function drawQueue() {
  const live = JOBS.filter((j) => LIVE.includes(j.state));
  const head = live[0];
  el("queueline").textContent = head
    ? "▶ " + head.label + (head.elapsedMs ? " · " + Math.round(head.elapsedMs / 1000) + "s" : "") +
      (live.length > 1 ? " · " + (live.length - 1) + " waiting" : "")
    : "queue idle";
  const pop = el("queuepop");
  pop.hidden = !queueOpen;
  if (!queueOpen) return;
  clear(pop);
  if (!JOBS.length) pop.append(h("div", { class: "faint", text: "nothing has run recently." }));
  for (const j of JOBS) {
    pop.append(h("div", { class: "job" },
      h("span", { class: "dot " + (j.state === "running" ? "run" : LIVE.includes(j.state) ? "hollow" : j.error ? "solid" : "green") }),
      h("span", { class: "lbl", title: j.label, text: j.label }),
      LIVE.includes(j.state) ? h("button", { text: "cancel", onclick: async () => {
        await fetch("/api/job/" + j.id + "/cancel?cid=" + route.cid, { method: "POST" });
        loadJobs();
      } }) : h("span", { class: "faint", text: j.error ? "failed" : j.state })));
  }
}

// --- the tray ---------------------------------------------------------------------------------------
// A slide-up drawer behind a counted badge. Every entry is an edit that a re-pick could not carry;
// they persist until somebody applies or discards them, and the badge is what stops it becoming a
// graveyard.
function renderTray() {
  const n = ST.tray.length;
  clear(el("traybadge"));
  el("traybadge").append(document.createTextNode("tray"), h("span", { class: "n", text: String(n) }));
  const d = el("traydrawer");
  d.classList.toggle("open", trayOpen);
  if (!trayOpen) return;
  clear(d);
  d.append(h("div", { class: "row" }, h("h2", { text: "the tray · " + n + " orphaned edits" }),
    h("span", { class: "grow" }), h("button", { text: "close", onclick: () => { trayOpen = false; renderTray(); } })));
  if (!n) d.append(h("p", { class: "faint", text: "nothing has been orphaned. A re-picked clip parks unmatched edits here." }));
  for (const e of ST.tray) {
    const tag = ST.tags.find((t) => t.name === e.tag);
    // The suggestion, pre-computed: the live cell of the same move whose source frame sits nearest
    // in the clip. `f_0041.png` is a TIME, and time is the only address that survives a re-pick.
    const time = (s) => { const m = /f_(\d+)\.png$/.exec(s || ""); return m ? parseInt(m[1], 10) : null; };
    const want = time(e.src);
    let best = null;
    if (tag && want !== null) {
      tag.cells.forEach((c, i) => {
        const t = time(c.src);
        if (t === null) return;
        if (best === null || Math.abs(t - want) < best.d) best = { i, d: Math.abs(t - want) };
      });
    }
    d.append(h("div", { class: "trayrow" },
      h("div", { class: "art checker" }, e.png ? pic(imgUrl(e.png, 112)) : h("span", { class: "faint", text: "—" })),
      h("div", { class: "grow" },
        h("div", { text: e.tag + " · " + (e.src || "").split("/").pop() }),
        h("div", { class: "faint", text: "seed " + e.seed + " · hold " + e.hold + " · nudge " + e.pivot_nudge.join(",") + " · " + e.why })),
      best ? h("button", { text: "apply to cell " + (best.i + 1), onclick: () => {
        go(href(route.cid, e.tag, route.step));
        mutate("restore", { tag: e.tag, fid: e.fid, index: best.i }, "restore onto cell " + (best.i + 1));
      } }) : h("span", { class: "faint", text: "no live cell to land on" }),
      h("button", { text: "discard", onclick: () => mutate("forget", { tag: e.tag, fid: e.fid }, "discard " + e.fid) })));
  }
}

// --- keys and boot ------------------------------------------------------------------------------------
document.addEventListener("keydown", (e) => {
  if (route.view !== "bench") return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const at = STEPS.indexOf(route.step);
  if (e.key === "ArrowRight" && at < STEPS.length - 1) { go(href(route.cid, route.anim, STEPS[at + 1])); e.preventDefault(); }
  if (e.key === "ArrowLeft" && at > 0) { go(href(route.cid, route.anim, STEPS[at - 1])); e.preventDefault(); }
  if (e.key === "Escape") { confirming = null; trayOpen = false; queueOpen = false; renderJudge(); renderTray(); drawQueue(); }
});
window.addEventListener("popstate", render);
window.addEventListener("resize", () => { if (route.view === "bench" && ST) renderJudge(); });
render();
</script>
