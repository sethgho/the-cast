<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the cast · sprites</title>
<style>
/* The paint is the old bench's, on purpose: DESIGN-playback.md changes the SHAPE of the tool, and
   re-colouring at the same time would make it impossible to say which change did what. */
:root {
  color-scheme: dark;
  --bg: #14120f; --ink: #e8e2d8; --dim: #8d8371; --faint: #6b6152;
  --gold: #d8a657; --rust: #b4462f; --cream: #efe9d8;
  --panel: #1a1713; --sunk: #221d17; --line: #332e27;
  --green: #79a06a; --grey: #4a443b;
  --tree: 232px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink);
       font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
h1, h2, h3 { font-size: 12px; font-weight: 700; margin: 0; letter-spacing: .04em; }
button { font: 600 11px/1 ui-monospace, monospace; color: var(--ink); background: var(--sunk);
         border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:disabled { opacity: .42; cursor: default; }
textarea, input[type=text], input[type=number], select {
  font: 12px/1.4 ui-monospace, monospace; color: var(--ink); background: var(--sunk);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px; width: 100%; }
textarea { resize: vertical; }
/* The per-frame prompt shows the character's brief as its PLACEHOLDER, so the placeholder has to
   look unmistakably unlike a value — an empty override reads as "use the brief". */
::placeholder { color: var(--faint); opacity: 1; }
a { color: var(--gold); }
.grow { flex: 1 1 auto; min-width: 0; }
.dim { color: var(--dim); }
.faint { color: var(--faint); }
.gold { color: var(--gold); }
.err { color: var(--rust); }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.wrap { flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.checker { background-color: var(--cream);
  background-image: linear-gradient(45deg, #ded8c6 25%, transparent 25%, transparent 75%, #ded8c6 75%),
                    linear-gradient(45deg, #ded8c6 25%, transparent 25%, transparent 75%, #ded8c6 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block;
       border: 1px solid transparent; }
.dot.green { background: var(--green); }
.dot.grey  { background: var(--grey); }
.dot.gold  { background: var(--gold); }
.dot.run   { background: var(--gold); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

/* --- shell ---------------------------------------------------------------------------------- */
#app { height: 100%; display: grid; grid-template-columns: var(--tree) minmax(0, 1fr);
       grid-template-rows: 44px minmax(0, 1fr); }
#top { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 0 10px;
       background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
#queueline { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#traybadge .n { color: var(--bg); background: var(--gold); border-radius: 8px;
                padding: 1px 5px; margin-left: 4px; font-weight: 700; }
#menubtn { display: none; }

/* --- the tree: character → animations -------------------------------------------------------- */
#tree { grid-row: 2; background: var(--panel); border-right: 1px solid var(--line);
        overflow: hidden auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.chr { display: flex; align-items: center; gap: 8px; padding: 5px 6px; width: 100%;
       background: none; border: none; border-left: 2px solid transparent; text-align: left; }
.chr.on { border-left-color: var(--gold); background: var(--sunk); }
.chr .av { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex: none;
           display: flex; align-items: center; justify-content: center; }
.chr .av img { width: 100%; height: 100%; object-fit: contain; }
.chr .nm { font-weight: 700; }
.mv { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 6px 4px 26px;
      background: none; border: none; border-left: 2px solid transparent; text-align: left; }
.mv.on { border-left-color: var(--gold); background: var(--sunk); color: var(--gold); }
.mv .what { margin-left: auto; color: var(--faint); font-weight: 400; }
.add { margin: 2px 0 8px 26px; width: calc(100% - 26px); text-align: left; }

/* --- the work column -------------------------------------------------------------------------- */
#work { grid-row: 2; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#chead { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
         border-bottom: 1px solid var(--line); }
#chead .plate { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex: none;
                display: flex; align-items: center; justify-content: center; }
#chead .plate img { width: 100%; height: 100%; object-fit: contain; }
#chead .nm { font-size: 15px; font-weight: 700; }
#chead .desc { color: var(--dim); max-width: 720px; }
#tabs { flex: none; display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
#tabs button.on { border-color: var(--gold); color: var(--gold); background: var(--panel); }
#stage { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px 14px; }

/* Two loops side by side: the thing it came from, and the thing being built. */
.pair { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.pane { flex: 1 1 320px; min-width: 260px; max-width: 520px; display: flex; flex-direction: column; gap: 6px; }
.pane .art { width: 100%; aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden;
             display: flex; align-items: center; justify-content: center; position: relative; }
.pane .art img, .pane .art video { width: 100%; height: 100%; object-fit: contain; display: block; }
.pane .cap { display: flex; align-items: baseline; gap: 8px; color: var(--dim); }
.pane .badge { position: absolute; left: 6px; bottom: 6px; background: #000a; color: var(--ink);
               border-radius: 3px; padding: 1px 5px; }

/* --- the timeline: every extracted frame, on or off ------------------------------------------- */
#strip { flex: none; border-top: 1px solid var(--line); background: var(--panel);
         padding: 6px 14px; overflow-x: auto; overflow-y: hidden; }
#striprow { display: flex; gap: 4px; align-items: flex-end; }
.fr { flex: none; width: 76px; padding: 0; background: none; border: 1px solid var(--line);
      border-radius: 4px; overflow: hidden; }
.fr .th { width: 74px; height: 60px; display: flex; align-items: center; justify-content: center; }
.fr .th img { width: 100%; height: 100%; object-fit: contain; }
.fr .lbl { display: block; padding: 2px 0; color: var(--faint); font-size: 10px; }
.fr.on { border-color: var(--gold); }
.fr.on .lbl { color: var(--bg); background: var(--gold); font-weight: 700; }
.fr.at { outline: 2px solid var(--ink); outline-offset: -2px; }
.fr .th { opacity: .45; }
.fr.on .th { opacity: 1; }
.fr .dupe { color: var(--rust); font-weight: 700; }

/* --- playback controls ------------------------------------------------------------------------- */
#ctl { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 14px;
       border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
#ctl .sp button.on { border-color: var(--gold); color: var(--gold); }
#play { min-width: 74px; }

/* --- confirms, notes, editor -------------------------------------------------------------------- */
.confirm { background: var(--sunk); border: 1px solid var(--gold); border-radius: 4px;
           padding: 8px; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.confirm b { color: var(--gold); }
.note { border-left: 2px solid var(--gold); padding: 6px 8px; margin: 8px 0; background: var(--panel); }
.note.bad { border-left-color: var(--rust); }
/* Beside the preview, not under it: on a 900px-tall screen an editor below a 420px loop is an
   editor nobody sees, and "pausing makes this frame editable" has to be VISIBLE to be true. */
#editor { flex: 1 1 340px; min-width: 300px; max-width: 620px; padding: 10px; align-self: flex-start; }
#editor .head, #animeditor .head { display: flex; align-items: center; gap: 8px;
                border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
/* The animation's own card. It is not beside the preview like the frame editor — it is ABOVE both
   screens, because the recipe belongs to the animation and not to Select or to Enhance. */
#animeditor { padding: 10px; max-width: 720px; margin-bottom: 4px; }
.shelf { display: flex; flex-wrap: wrap; gap: 4px; }
.seed { width: 72px; padding: 0; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seed .art { width: 70px; height: 70px; display: flex; }
.seed img { width: 100%; height: 100%; object-fit: contain; }
.seed.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.seed .lbl { display: block; font-size: 9px; color: var(--dim); background: var(--sunk); }
.side { display: flex; gap: 14px; flex-wrap: wrap; }
.sq { width: 132px; height: 132px; border-radius: 4px; overflow: hidden; display: flex; }
.sq img { width: 100%; height: 100%; object-fit: contain; }
form.mk { max-width: 420px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

/* --- queue, tray, toast ---------------------------------------------------------------------- */
#queuepop { position: fixed; top: 44px; right: 8px; width: 320px; z-index: 20; padding: 8px;
            display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow: auto; }
.job { display: flex; align-items: center; gap: 6px; }
.job .lbl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#traydrawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 60vh;
              overflow: auto; padding: 10px 12px; border-radius: 8px 8px 0 0;
              transform: translateY(100%); transition: transform .2s ease-out; }
#traydrawer.open { transform: none; }
.trayrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.trayrow .art { width: 52px; height: 52px; flex: none; }
.trayrow .art img { width: 100%; height: 100%; object-fit: contain; }
#toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 40;
         background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
         padding: 7px 12px; max-width: 92vw; }
#toast:empty { display: none; }
#menu { position: fixed; z-index: 30; padding: 4px; display: flex; flex-direction: column; gap: 2px;
        max-height: 70vh; overflow: auto; }
#menu button { text-align: left; }

/* --- the phone: the same two screens, stacked --------------------------------------------------- */
@media (max-width: 820px) {
  :root { --tree: 0px; }
  #app { grid-template-columns: minmax(0, 1fr); }
  /* The tree becomes a menu off the top bar. A 232px rail on a 390px screen is half the phone
     spent on a list somebody reads once. */
  #tree { display: none; }
  #tree.open { display: flex; position: fixed; top: 44px; left: 0; bottom: 0; width: 260px; z-index: 25;
               box-shadow: 6px 0 18px #000a; }
  #menubtn { display: inline-flex; }
  /* The title goes, not shrinks: 390px of top bar is needed by the queue line and the tray count,
     and the character header underneath already says where you are. */
  #top h1 { display: none; }
  #queueline { max-width: 130px; }
  #chead { padding: 8px 10px; }
  #chead .plate { width: 44px; height: 44px; }
  #stage { padding: 10px; }
  #strip, #ctl { padding: 6px 10px; }
  .pane { max-width: none; flex-basis: 100%; }
  /* Capped so the frame's editor is on the same screen as the frame. An uncapped square loop on a
     844px phone pushes every control the editor has below the fold. */
  .pane .art { aspect-ratio: 1 / 1; max-height: 40vh; }
  #queuepop { width: auto; left: 8px; right: 8px; }
}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <button id="menubtn" title="characters">☰</button>
    <h1>the cast · sprites</h1>
    <span class="grow"></span>
    <button id="exportbtn">export ▾</button>
    <button id="queueline"></button>
    <button id="traybadge"></button>
  </header>
  <nav id="tree"></nav>
  <main id="work">
    <section id="chead"></section>
    <nav id="tabs"></nav>
    <section id="stage"></section>
    <section id="strip" hidden><div id="striprow"></div></section>
    <section id="ctl" hidden></section>
  </main>
</div>

<div id="queuepop" class="card" hidden></div>
<div id="traydrawer" class="card"></div>
<div id="toast"></div>

<script>
"use strict";

// Two origins, and the split is the point. This page and every mutation come from celld, which
// owns the manifest and the job queue; every PIXEL comes from the wilson agent, because the source
// frames, the repaints, the clips and the atlas are files on the machine with the GPU.
let AGENT = "";

const LIVE = ["queued", "claimed", "running"];
const BASE_SEED = 77;
const MAX_SELECT = 32;
// THE RULE THAT MAKES EDITS COST MONEY. Every edit queues a repack, and the packer paints whatever
// drawing is MISSING, whoever made it missing (sprite_agent.run_job). So a frame turned on that has
// never been drawn, and a prompt edit on a cell that HAS been drawn, both put ~45s of GPU behind a
// button the contract calls free. Anything that can make a drawing missing is confirmed here first.
const PAINT_S = () => (ST && ST.cost_s ? ST.cost_s.repaint : 45);
// The two screens. There is no third, and no per-step URL: a person picks the frames, then fixes
// the frames (DESIGN-playback.md).
const SCREENS = ["select", "enhance"];
// The pipeline still exists underneath — it is what a run is priced in — but it is never a row of
// chips. This list only ever answers "what has to happen before this move can be looked at".
const LADDER = [
  { kind: "plate", scope: "character", need: "the plate has to be cut out first" },
  { kind: "clip", scope: "move", need: "this move has no clip yet" },
  { kind: "frames", scope: "move", need: "the clip has not been extracted into frames yet" },
];

const el = (id) => document.getElementById(id);
const h = (tag, props, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n[k] = v;
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) {
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
};
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };

function toast(msg, bad) {
  const t = el("toast");
  t.textContent = msg || "";
  t.className = bad ? "err" : "";
  clearTimeout(toast.t);
  if (msg) toast.t = setTimeout(() => { if (t.textContent === msg) t.textContent = ""; }, 7000);
}

// --- the image cache ---------------------------------------------------------------------------
// The agent answers every image with `Cache-Control: no-store` — correct, because a repack
// overwrites cells in place and a cached crop is the most likely way this page lies about what is
// on disk. So each URL is fetched exactly once into an object URL, and the whole cache is dropped
// when the revision moves, which is the only moment the files can have changed. A 67-frame
// timeline that refetched on every toggle would be 67 requests per click.
const ART = new Map();
function artUrl(u) {
  const hit = ART.get(u);
  if (hit) return hit;
  const p = fetch(u).then((r) => {
    if (!r.ok) throw new Error(String(r.status));
    return r.blob();
  }).then((b) => {
    const o = URL.createObjectURL(b);
    ART.set(u, o);
    return o;
  }).catch((e) => { ART.delete(u); throw e; });
  ART.set(u, p);
  return p;
}
function dropArt() {
  const old = [];
  for (const v of ART.values()) if (typeof v === "string") old.push(v);
  ART.clear();
  // Revoked LATE: the <img> elements holding these are only replaced when the render AFTER this
  // call finishes, and revoking a blob a half-loaded image is still reading is a failed request.
  setTimeout(() => { for (const u of old) URL.revokeObjectURL(u); }, 15000);
}
function pic(url, cls) {
  const i = h("img", { class: cls || "", alt: "", "data-src": url });
  Promise.resolve(artUrl(url)).then((o) => { i.src = o; })
    .catch(() => i.replaceWith(h("span", { class: "faint", text: "missing" })));
  return i;
}
const imgUrl = (p, w) => AGENT + "/img?path=" + encodeURIComponent(p) + (w ? "&w=" + w : "");
const cellUrl = (cid, atlas, w) =>
  AGENT + "/cell?cid=" + cid + "&i=" + atlas + (w ? "&w=" + w : "") + "&v=" + (ST ? ST.revision : 0);
// One width for every source frame, because the timeline and the left loop show the SAME file and
// a second width would double every fetch for no visible gain.
const FRAME_W = 192;

// --- state -------------------------------------------------------------------------------------
let ST = null;              // the open character: manifest state merged with the agent's files
let ROSTER = [];            // every character id on the fleet
let TREE = new Map();       // cid -> state, for the tree's avatars and move counts
let JOBS = [];
let DEFAULTS = null;        // the agent's bootstrap block, read once for "a new character"
let REPAINT_BRIEF = "";     // the character-wide repaint words, shown as the per-frame placeholder
let route = { cid: null, anim: null, screen: "select" };
let confirming = null;      // {key, ...} while a priced or lossy confirm is open
let queueOpen = false, trayOpen = false, treeOpen = false;
let making = null;          // "character" | "move" while a create form is open
// The animation's own card: open on both screens, and the unsaved recipe it is holding. The draft
// is kept OUTSIDE the DOM because a job finishing reloads and re-renders the page, and a half-typed
// recipe living only in a textarea would be thrown away by a repack landing at the wrong moment.
let animOpen = false, animDraft = null;
let poll = null;

// One clock for both screens. `at` is an index into the tag's `sources` — the timeline's own
// address — and `cellAt` walks the selected cells' play order. Pausing is what opens the editor.
const PLAY = { on: true, at: 0, cellAt: 0, speed: 1, next: 0 };

const TAG = () => (ST ? ST.tags.find((t) => t.name === route.anim) || null : null);
const SRC = () => (TAG() ? TAG().sources : []);
const CELLS = () => (TAG() ? TAG().cells : []);

// --- reading the two origins ---------------------------------------------------------------------
async function api(op, body) {
  const r = await fetch("/api/" + op, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function loadState(cid) {
  const r = await fetch("/api/state" + (cid ? "?cid=" + encodeURIComponent(cid) : ""));
  const st = await r.json();
  if (st.error) throw new Error(st.error);
  AGENT = st.agent;
  ROSTER = st.characters;
  return st;
}

// Where the packer put each cell, what it measures, which repaints exist on disk and what the
// character-wide repaint brief says — all four are answers about FILES, so all four come from the
// agent. Merged by tag name and cell index; the atlas index is the agent's alone.
async function mergeDerived(st) {
  let d = null;
  try {
    const r = await fetch(AGENT + "/derived?cid=" + encodeURIComponent(st.character));
    const got = await r.json();
    if (!got.error) d = got;
  } catch (e) { /* every read below goes through `d &&` */ }
  if (!d) toast("the wilson agent is unreachable at " + AGENT + " — no drawings, no atlas, no seeds", true);
  st.atlas = d ? d.atlas : null;
  REPAINT_BRIEF = d ? d.locks.repaint : "";
  for (const tag of st.tags) {
    const dt = d && d.tags[tag.name];
    tag.cells.forEach((c, i) => {
      const dc = dt && dt.cells[i];
      c.atlas = dc ? dc.atlas : null;
      // Newest first: a seed shelf is a history, and a seed is a random number that orders by
      // nothing a person can read. `at` is the repaint file's own mtime.
      c.variants = dc ? dc.variants.slice().sort((a, b) => b.at - a.at) : [];
      // The drawing this cell WANTS is `png`; whether it exists is what the variant listing says.
      // A per-frame prompt changes the file name, so an edited cell is unpainted until it is run.
      c.painted = !!c.png && c.variants.some((v) => v.png === c.png);
    });
  }
  return st;
}

async function openCharacter(cid) {
  ST = await mergeDerived(await loadState(cid));
  TREE.set(cid, ST);
  if (!ST.tags.length) { route.anim = null; return; }
  if (!ST.tags.some((t) => t.name === route.anim)) route.anim = ST.tags[0].name;
}

// The tree needs a plate and a move count for every character, and nothing else — so the OTHER
// characters are read from celld alone. Asking the agent for four `derived` blocks to draw four
// avatars would be four directory walks per page load.
async function loadTree() {
  for (const cid of ROSTER) {
    if (TREE.has(cid)) continue;
    try { TREE.set(cid, await loadState(cid)); } catch (e) { TREE.set(cid, null); }
  }
}

async function loadJobs() {
  if (!route.cid) return;
  try {
    const r = await fetch("/api/jobs?cid=" + encodeURIComponent(route.cid));
    const j = await r.json();
    if (j.error) return;
    const was = JOBS.filter((x) => LIVE.includes(x.state)).map((x) => x.id).join();
    JOBS = j.jobs;
    const now = JOBS.filter((x) => LIVE.includes(x.state)).map((x) => x.id).join();
    // A job that has just left the queue rewrote files. Nothing else can, so this is the only
    // moment the image cache is wrong — reloading on every poll would refetch the atlas every
    // two seconds forever.
    if (was !== now && was !== "") { await reload(); return; }
    drawQueue();
    renderTree();
  } catch (e) { /* a poll that cannot reach celld says so on the next mutation, not every 2s */ }
}

async function reload() {
  dropArt();
  await openCharacter(route.cid);
  TREE.set(route.cid, ST);
  clampPlay();
  render();
}

// Every free edit goes through here. It commits to the manifest before it answers, so it returns
// in about 200ms; what follows is a repack, never a paint.
async function mutate(op, body, label) {
  try {
    const j = await api(op, { cid: route.cid, tag: route.anim, ...body });
    confirming = null;
    toast(label + (j.job ? " — queued for the next repack"
      : " — recorded · what it invalidated is now stale, and nothing is queued"));
    await reload();
    return j;
  } catch (e) { toast(e.message, true); return null; }
}

// --- prices --------------------------------------------------------------------------------------
function fmtTime(s) {
  if (!s) return "free";
  if (s < 60) return "~" + s + "s";
  const m = Math.floor(s / 60), r = s % 60;
  return "~" + m + "m" + (r ? " " + r + "s" : "");
}
function recs(kind, anim) {
  if (!ST) return [];
  if (kind === "plate" || kind === "pack") return ST.steps.filter((s) => s.id === kind);

async function applySelect(frames, why) {

    confirming = null;

      j.orphaned + " to the tray" +

// --- render ----------------------------------------------------------------------------------------

    { fmt: "json-array", what: "frames as an ordered array" },

function menu(anchor, items) {
  const old = el("menu");

  const box = h("div", { id: "menu", class: "card" });
  for (const it of items) {
    box.append(h("button", { text: (it.on ? "• " : "  ") + it.text,
      onclick: () => { box.remove(); it.act(); } }));

// --- the animation itself, reachable from both screens ---------------------------------------------
// The recipe is the words the whole performance is rendered from. It belongs to the ANIMATION, so it
// is neither Select's nor Enhance's: it hangs off the row they share and is drawn above both.
//
// Saving it runs NOTHING. `/api/step` records the words and marks the clip — and everything picked

  box.append(h("div", { class: "head" },
    h("h2", { text: "animation · " + tag.name }),
    h("span", { class: "faint", text: tag.cells.length + " cells of " + tag.sources.length +
      " frames · " + tag.fps + "fps" }),
    h("span", { class: "grow" }),
    h("button", { text: "close", onclick: () => { animOpen = false; render(); } })));

  // The name is SHOWN and not editable, and the reason is said out loud rather than left as a
  // missing control: `STEP_EDITABLE.clip` is recipe_text, trait and cyclic, and the tag name is
  // absent from it on purpose — the extracted frames of this move live in a directory named after
  // it, so a rename orphans every frame and every drawing made from them.
  box.append(h("div", { class: "row wrap" },
    h("span", { class: "dim", text: "name" }), h("span", { class: "gold", text: tag.name }),
    h("span", { class: "faint", text: "fixed — this move's extracted frames are filed under this " +
      "name, so renaming it would orphan them and every drawing made from them" })));

    const v = ta.value.trim();
    if (!v || v === saved) return;
    const keep = animDraft;
    animDraft = null;

      "the " + tag.name + " recipe");

  };

  const hint = h("span", { class: "faint" });
  const unsaved = h("div", { class: "note" },
    h("div", { text: "unsaved — saving marks this move's clip stale and queues nothing." }),
    h("div", { class: "dim", text: "the clip you are looking at stays exactly as it is until you " +
      "ask for a new one, below, and pay for it." }));
  box.append(h("div", { class: "col", style: "gap:4px" },
    h("span", { class: "dim", text: "what this animation does, in one paragraph. Every clip of it " +
      "is rendered from these words and the character's movement sentence." }), ta,
    h("div", { class: "row wrap" }, save, revert, hint)));

  // 170 seconds on a new performance is that the words it is rendered from have changed.
  const line = h("div", { class: "col", style: "gap:4px" },
    h("span", { class: "dim", text: "the clip these words name" }));
  if (!rec || rec.built_key === null) {
    line.append(h("span", { class: "faint", text: "this move has never had a clip. The run that " +
      "makes the first one is on the screen behind this card — there is nothing to re-render yet." }));
  } else if (!rec.stale) {
    line.append(h("div", { class: "row wrap" },
      h("button", { disabled: true, text: "re-render the clip · already this performance" }),
      h("span", { class: "faint", text: "the clip on disk was rendered from exactly these words. " +
        "Change them and save, and this becomes the run that makes the new performance." })));
  } else {
    line.append(runBar("clip", "re-render the clip from these words", priceOf("clip")));
  }
  // A re-render renders the words ON DISK. Offering it beside an unsaved edit would be a button
  // whose label — "from these words" — is about text the render will never see.
  const saveFirst = h("span", { class: "faint", text: "save the recipe first: a re-render renders " +
    "the words on disk, not the ones being typed." });
  line.append(saveFirst);
  box.append(line);

  // Dirtiness is answered on every keystroke rather than on the next render, because a render is
  // what would take the caret out of the sentence being written.
  const sync = () => {
    const dirty = ta.value.trim() !== saved;
    save.disabled = !dirty || !ta.value.trim();
    revert.hidden = !dirty;
    unsaved.hidden = !dirty;
    hint.textContent = dirty ? "unsaved — nothing on disk has changed yet"
      : "these are the words the recipe is saved with";
    // The re-render and the unsaved edit are never offered at the same time.
    for (const n of line.children) if (n !== saveFirst) n.hidden = dirty;
    saveFirst.hidden = !dirty;
  };
  ta.oninput = () => { animDraft = ta.value; sync(); };
  sync();
  return box;
}

// Staleness, said plainly, on both screens. It never hides the clip or the cells: they are the old
// performance, and the old performance is the best reference there is until a new one lands.
function clipStaleNote(tag) {
  const rec = recs("clip", tag.name)[0];
  // `built_key === null` is "never rendered", which is the processing screen's story and not this
  // one's — this note is only ever about a clip that EXISTS and no longer matches the words.
  if (!rec || !rec.stale || rec.built_key === null) return null;
  // The two reasons the Durable Object can give, and neither is guessed at. "params or inputs
  // changed" cannot say WHICH of the three inputs to a clip moved, so this does not pretend to.
  const own = rec.reason === "params or inputs changed";
  const box = h("div", { class: "note" },
    h("div", { text: own
      ? "these are not the words this clip was rendered from — the recipe, the movement sentence " +
        "or the plate has changed since."
      : "this clip is behind what it is composited from — " + rec.reason + "." }),
    h("div", { class: "dim", text: "what plays below is the old performance and the cells picked " +
      "off it. Nothing has been thrown away, and nothing runs until you ask for it." }));
  if (!animOpen) {
    box.append(h("button", { text: "open the recipe",
      onclick: () => { animOpen = true; render(); } }));
  }
  return box;
}

// --- screen 1: select --------------------------------------------------------------------------------
// The whole clip on the left, only the selected frames on the right, so the thing being built plays
// beside the thing it came from and the effect of a toggle is immediate.
function selectScreen(tag) {
  const box = h("div", { class: "col" });
  const note = collapseNote(tag);
  if (note) box.append(collapseBanner(tag, note));
  if (confirming && confirming.key === "select") box.append(selectConfirm(tag));

  const left = h("img", { alt: "" });
  const right = h("img", { alt: "" });
  REEL.left = left;
  REEL.right = right;
  REEL.seq = sequence(tag);
  tag.sources.forEach((p, i) => {
    Promise.resolve(artUrl(imgUrl(p, FRAME_W))).then((o) => { REEL.urlsL[i] = o; if (PLAY.at === i) paintReels(); })
      .catch(() => { /* a frame that will not load simply never draws; the timeline says "missing" */ });
  });
  // On SELECT the right pane is the chosen source frames — the picks themselves, not their
  // drawings. What they will look like painted is the other screen's question.
  tag.cells.forEach((c, i) => {
    Promise.resolve(artUrl(imgUrl(c.src, FRAME_W))).then((o) => { REEL.urlsR[i] = o; paintReels(); })
      .catch(() => { /* ditto */ });
  });

  box.append(h("div", { class: "pair" },
    h("div", { class: "pane" },
      h("div", { class: "art checker" }, left,
        h("span", { class: "badge", id: "nowframe" })),
      h("div", { class: "cap" }, h("span", { text: "the whole clip" }),
        h("span", { class: "faint", text: tag.sources.length + " extracted frames" }))),
    h("div", { class: "pane" },
      h("div", { class: "art checker" }, right,
        h("span", { class: "badge", id: "nowcell" })),
      h("div", { class: "cap" }, h("span", { class: "gold", text: "the selected frames" }),
        h("span", { class: "faint", text: tag.cells.length + " cells · " + tag.fps + "fps " + tag.direction })))));

  if (!tag.cells.length) {
    box.append(h("div", { class: "note" },
      h("div", { text: "nothing is selected yet. Turn frames on in the timeline below, or let the " +
        "picker propose a set and edit it by hand." }),
      runBar("picks", "let the picker choose", priceOf("picks"))));
  } else {
    const paint = unpainted();
    box.append(h("div", { class: "dim", text: paint
      ? paint + " of these cells " + (paint === 1 ? "has" : "have") + " no drawing yet — the enhance " +
        "screen prices painting them, and the repack behind the next edit would paint them anyway."
      : "every selected frame is drawn. The enhance screen is the final preview." }));
  }
  return box;
}

function collapseBanner(tag, note) {
  const box = h("div", { class: "note bad" });
  if (note.dupes.length) {
    const which = note.dupes.map((d) => "frame " + (d.i + 1) + " × " + d.n).join(", ");
    box.append(h("div", { text: "two cells share one frame: " + which + "." }));
    box.append(h("div", { class: "dim", text: "A toggle list cannot say that. The next selection " +
      "you make collapses each shared frame to one cell and sends the other to the tray with its " +
      "edits — the tray keeps it, nothing is deleted." }));
  }
  if (note.unmapped.length) {
    box.append(h("div", { text: note.unmapped.length + " cell" + (note.unmapped.length === 1 ? "" : "s") +
      " came from a frame that is not in this extraction." }));
    box.append(h("div", { class: "dim", text: "They are not on the timeline and cannot be toggled. " +
      "The next selection drops them to the tray: " +
      note.unmapped.map((c) => c.src.split("/").pop()).join(", ") }));
  }
  return box;
}

function selectConfirm(tag) {
  const c = confirming;
  const edits = c.pv.orphans.filter(handEdited).length;
  const box = h("div", { class: "confirm" },
    h("div", {}, "this selection keeps ", h("b", { text: String(c.pv.kept) }), " cells, adds ",
      h("b", { text: String(c.pv.added) }), " and sends ", h("b", { text: String(c.pv.orphans.length) }),
      " to the tray."),
    c.pv.orphans.length ? h("div", { class: "dim", text: c.pv.orphans.map((o) => "cell on " + o.src.split("/").pop() +
      (handEdited(o) ? " (seed " + o.seed + ", hold " + o.hold + (o.prompt ? ", its own prompt" : "") + ")" : "")).join(" · ") }) : null,
    edits ? h("div", { text: edits + " of them carries a hand edit. It is kept in the tray and can be " +
      "put back on a live cell; it is never deleted." }) : null,
    c.pv.added ? h("div", {}, "an added frame that has never been drawn is painted by the repack this " +
      "edit queues — up to ", h("b", { text: fmtTime(c.pv.added * PAINT_S()) }), " of GPU. A frame " +
      "drawn before at seed 77 costs nothing.") : null,
    h("div", { class: "faint", text: c.pv.added ? "the selection itself is free; the drawing behind it is not."
      : "free — nothing is painted by dropping a frame." }),
    h("div", { class: "row" },
      h("button", { text: "apply it", onclick: () => applySelect(c.frames, c.why) }),
      h("button", { text: "cancel", onclick: () => { confirming = null; render(); } })));
  return box;
}

// --- screen 2: enhance ---------------------------------------------------------------------------------
// The same timeline and the same controls, and the final preview: what plays here is what ships.
function enhanceScreen(tag) {
  const box = h("div", { class: "col" });
  const packRec = recs("pack")[0];
  const paint = unpainted();
  if (paint) {
    box.append(h("div", { class: "note" },
      h("div", { text: paint + " cell" + (paint === 1 ? " has" : "s have") + " no drawing at the words " +
        "and seed they now ask for, so the preview shows their source frames." }),
      h("div", { class: "dim", text: "the repack behind ANY edit paints whatever is missing, so this " +
        "cost arrives with the next edit whether or not this button is pressed." }),
      runBar("repaint", "paint " + paint + " cell" + (paint === 1 ? "" : "s"), priceOf("repaint"))));
  } else if (packRec && packRec.stale) {
    box.append(h("div", { class: "note" },
      h("div", { text: "the atlas is behind these cells — " + packRec.reason + "." }),
      runBar("pack", "repack", priceOf("pack"))));
  }

  const right = h("img", { alt: "" });
  REEL.right = right;
  REEL.left = null;
  REEL.seq = sequence(tag);
  // The drawing, and only the drawing, when there is one: the packed atlas cell is the aligned,
  // scaled one the game gets. A cell with no drawing falls back to its source frame and says so,
  // because a hole in the loop looks like a bug and an unpainted cell is not one.
  tag.cells.forEach((c, i) => {
    const u = c.atlas !== null ? cellUrl(route.cid, c.atlas, 256)
      : c.painted ? imgUrl(c.png, 256) : imgUrl(c.src, 256);
    Promise.resolve(artUrl(u)).then((o) => { REEL.urlsR[i] = o; paintReels(); })
      .catch(() => { /* ditto */ });
  });
  const i = cellAtPlayhead(tag);
  const beside = PLAY.on
    ? h("div", { class: "note", style: "flex:1 1 300px" },
        "pause on a frame — or click one in the timeline — to edit its prompt, its seed and its hold.")
    : i !== null ? cellEditor(tag, i) : null;
  box.append(h("div", { class: "pair" },
    h("div", { class: "pane", style: "max-width:440px" },
      h("div", { class: "art checker" }, right, h("span", { class: "badge", id: "nowcell" })),
      h("div", { class: "cap" }, h("span", { class: "gold", text: "the final preview" }),
        h("span", { class: "faint", text: ST.atlas ? "packed · " + tag.fps + "fps " + tag.direction
          : "not packed yet — these are the repaints" }),
        h("span", { class: "faint", id: "nowframe" }))),
    beside));
  return box;
}

// Pausing on a frame makes THAT frame editable. Its prompt, its seed, its hold — and a re-render of
// that frame alone, priced.
function cellEditor(tag, i) {
  const c = tag.cells[i];
  const exact = exactCell(tag) === i;
  const box = h("div", { id: "editor", class: "card col" });
  box.append(h("div", { class: "head" },
    h("h2", { text: "cell " + (i + 1) + " of " + tag.cells.length }),
    h("span", { class: "faint", text: "frame " + (c.source_index === null ? "?" : c.source_index + 1) +
      " · seed " + c.seed + " · hold " + c.hold + (c.painted ? "" : " · not drawn") }),
    exact ? null : h("span", { class: "dim", text: "(the playhead is on frame " + (PLAY.at + 1) +
      ", which is not a pick — this is the cell before it)" })));

  box.append(h("div", { class: "side" },
    h("div", { class: "col", style: "gap:4px" }, h("span", { class: "faint", text: "the frame" }),
      h("div", { class: "sq checker" }, pic(imgUrl(c.src, 192)))),
    h("div", { class: "col", style: "gap:4px" }, h("span", { class: "faint", text: "drawn as" }),
      h("div", { class: "sq checker" }, c.painted ? pic(imgUrl(c.png, 192))
        : h("span", { class: "faint", style: "margin:auto", text: "not drawn yet" })))));

  // The prompt. Empty means "use the character's brief", which is why the default is the
  // PLACEHOLDER and never the value: a copy of the brief stored on the frame would freeze it there.
  const ta = h("textarea", { rows: 4, placeholder: REPAINT_BRIEF.slice(0, 240) + "…" });
  ta.value = c.prompt || "";
  const writePrompt = (v) => mutate("prompt", { index: i, prompt: v },
    "cell " + (i + 1) + (v ? "'s own prompt" : " back on the character's brief"));
  const save = h("button", { text: "save this frame's prompt" });
  save.onclick = () => {
    const v = ta.value.trim();
    if (v === (c.prompt || "")) { toast("that is the prompt this cell already has"); return; }
    // New words name a drawing that is not on disk, and the repack behind this edit paints
    // whatever is missing. So saving them IS the priced re-render of this frame alone, and it is
    // confirmed as one rather than announced afterwards by the queue line.
    if (!c.painted) { writePrompt(v); return; }
    confirming = { key: "prompt", index: i, prompt: v };
    render();
  };
  const promptBox = h("div", { class: "col", style: "gap:4px" },
    h("span", { class: "dim", text: "this frame's own words. Empty is the character's brief." }), ta,
    h("div", { class: "row wrap" }, save,
      c.prompt ? h("button", { text: "clear it", onclick: () => writePrompt("") }) : null,
      h("span", { class: "faint", text: c.painted
        ? "new words are a new drawing — " + fmtTime(PAINT_S()) + " of GPU, confirmed first."
        : "free — this cell has no drawing to lose." })));
  if (confirming && confirming.key === "prompt" && confirming.index === i) {
    promptBox.append(h("div", { class: "confirm" },
      h("div", {}, "these words name a drawing that is not on disk, and the repack behind this edit " +
        "paints whatever is missing — ", h("b", { text: fmtTime(PAINT_S()) }), " of the one GPU."),
      h("div", { class: "dim", text: "the drawing this cell has now is not deleted: it stays on the " +
        "shelf under the character's brief." }),
      h("div", { class: "row" },
        h("button", { text: "save and paint it", onclick: () => writePrompt(confirming.prompt) }),
        h("button", { text: "cancel", onclick: () => { confirming = null; render(); } }))));
  }
  box.append(promptBox);

  // The seed shelf. Every drawing this frame has ever had, newest first, and swapping between them
  // is free because they are all already on disk.
  const shelf = h("div", { class: "shelf" });
  for (const v of c.variants) {
    shelf.append(h("button", {
      class: "seed" + (v.png === c.png ? " on" : ""), disabled: v.png === c.png,
      title: "use seed " + v.seed + " — free, nothing is spent",
      onclick: () => mutate("use", { index: i, png: v.png }, "cell " + (i + 1) + " on seed " + v.seed),
    }, h("div", { class: "art checker" }, pic(imgUrl(v.png, 144))),
      h("span", { class: "lbl", text: v.seed === BASE_SEED ? "77 first" : String(v.seed) })));
  }
  if (!c.variants.length) shelf.append(h("span", { class: "faint", text: "nothing has been drawn for these words yet" }));
  box.append(h("div", { class: "col", style: "gap:4px" },
    h("span", { class: "dim", text: "seeds already on disk — swapping is free" }), shelf));

  const hold = h("input", { type: "number", min: 1, max: 12, value: c.hold, style: "width:70px" });
  hold.onchange = () => {
    const v = parseInt(hold.value, 10);
    if (v === c.hold) return;
    mutate("hold", { index: i, hold: v }, "cell " + (i + 1) + " held " + v + " beats");
  };
  box.append(h("div", { class: "row wrap" }, h("label", {}, "hold ", hold),
    h("span", { class: "faint", text: "how many beats this cell stays on screen. Free." })));

  // The re-render of this frame alone. Two different acts, and they are never one button: painting
  // the drawing this cell is already asking for, or rolling a new seed to argue with the one it has.
  const paints = unpainted();
  const many = paints > 1 ? " — and " + (paints - 1) + " other unpainted cell" + (paints > 2 ? "s" : "") +
    " of " + tag.name + " would be painted in the same run" : "";
  box.append(h("div", { class: "row wrap" },
    c.painted
      ? runBar("reroll", "re-render this frame on a new seed", ST.cost_s.repaint, i)
      : runBar("repaint", "paint this frame" + (paints > 1 ? " (" + paints + " cells)" : ""), priceOf("repaint")),
    h("span", { class: "faint", text: c.painted
      ? "the drawings on the shelf are never deleted — a re-roll adds one."
      : "this cell's words and seed name a drawing that is not on disk" + many + "." })));
  return box;
}

// --- runs, all priced, none automatic ------------------------------------------------------------------
// Every button that costs GPU opens an inline confirm that states the price first. Nothing on this
// page runs on its own except the plate and clip a CREATION queues.
function runBar(kind, label, price, index) {
  const key = kind + ":" + (index === undefined ? "" : index);
  const bar = h("div", { class: "col", style: "gap:0;align-items:flex-start" });
  const busy = kind === "reroll" ? running("repaint") : running(kind);
  const btn = h("button", {
    disabled: busy, text: busy ? label + " · already running" : label + " · " + fmtTime(price),
    onclick: () => { confirming = confirming && confirming.key === key ? null : { key, kind, index, price, label }; render(); },
  });
  bar.append(btn);
  if (!confirming || confirming.key !== key) return bar;
  const box = h("div", { class: "confirm" });
  if (kind === "clip") box.append(...clipReceipt(route.anim));
  else {
    box.append(h("div", {}, "this costs ", h("b", { text: fmtTime(price) }), " of the one GPU, serially."));
    box.append(h("div", { class: "dim", text: "nothing downstream of it runs on its own." }));
  }
  box.append(h("div", { class: "row" },
    h("button", { text: "run it", onclick: () => (kind === "reroll"
      ? mutate("reroll", { index }, "re-roll cell " + (index + 1))
      : runStep(kind)) }),
    h("button", { text: "cancel", onclick: () => { confirming = null; render(); } })));
  bar.append(box);
  return bar;
}

// THE RECEIPT FOR THE ONE DESTRUCTIVE RUN ON THIS PAGE, and every number in it is read off the
// state rather than assumed.
//
// A clip is a new PERFORMANCE. It is not a re-pick, which chooses different frames of the same
// performance and can therefore carry an edit forward by the time its pose happens at; and it is
// not a re-roll, which re-draws one frame. Against a new performance a frame time means nothing —
// the same second of a re-rendered clip is a different pose — so every hand edit this move carries
// goes to the tray, and this says how many before anything is spent.
function clipReceipt(anim) {
  const cost = ST.cost_s || {};
  const tag = ST.tags.find((t) => t.name === anim) || { cells: [] };
  // What the picker is ASKED for, not what the tag holds today: the cells about to be painted are
  // the ones the new picks will choose, and a hand selection may have left more or fewer behind.
  const picks = recs("picks", anim)[0];
  const n = picks ? picks.params.cells : tag.cells.length;
  const paint = n * (cost.repaint || 0);
  const after = (cost.frames || 0) + (cost.picks || 0) + paint;
  const edits = tag.cells.filter(handEdited);
  // The FIRST render of a move loses nothing, and must not be dressed up as if it did: there is no
  // performance to throw away and no cell was ever picked off one.
  const clip = recs("clip", anim)[0];
  const first = !clip || clip.built_key === null;
  const which = edits.map((c) => "cell " + (tag.cells.indexOf(c) + 1) +
    " (seed " + c.seed + ", hold " + c.hold + (c.prompt ? ", its own prompt" : "") +
    (c.pivot_nudge[0] || c.pivot_nudge[1] ? ", nudged" : "") + ")").join(" · ");
  return [
    h("div", {}, "the clip is ", h("b", { text: fmtTime(cost.clip || 0) }),
      " of the one GPU, serially. That is the run this button buys."),
    h("div", { class: "dim", text: "what follows it is priced and confirmed separately and none of " +
      "it starts on its own: extract " + fmtTime(cost.frames || 0) + ", picks " +
      fmtTime(cost.picks || 0) + ", then painting " + n + " cells at " + fmtTime(cost.repaint || 0) +
      " each — " + fmtTime(after) + " after this one, " + fmtTime((cost.clip || 0) + after) + " in all." }),
    first
      ? h("div", { class: "dim", text: "this move has never had a clip, so nothing is lost: there is " +
          "no performance to replace and no cell picked off one." })
      : edits.length
        ? h("div", {}, h("b", { text: edits.length + " cell edit" + (edits.length === 1 ? "" : "s") +
            " cannot be carried" }), " — a re-rendered clip is a different performance, so the time a " +
            "pose happens at means nothing against it. All " + edits.length + " go to the orphan tray " +
            "with their seeds, holds, nudges and prompts, and can be put back by hand; nothing is deleted.")
        : h("div", { class: "dim", text: "no cell of this move carries a hand edit, so the tray takes " +
            "nothing. The cells themselves are still replaced by the new performance's picks." }),
    first || !edits.length ? null : h("div", { class: "faint", text: which }),
    first ? null : h("div", { class: "dim", text: "this is the destructive one. Re-picking chooses " +
      "different frames of the SAME clip and a re-roll re-draws a single frame; this throws the " +
      "performance away and every cell picked off it with it." }),
  ].filter(Boolean);
}

async function runStep(kind) {
  confirming = null;
  try {
    const body = { cid: route.cid, kind };
    if (kind !== "plate" && kind !== "pack") body.tag = route.anim;
    const j = await api("run", body);
    toast(j.job.label + " — queued");
    JOBS = JOBS.filter((x) => x.id !== j.job.id).concat([j.job]);
  } catch (e) { toast(e.message, true); }
  render();
  drawQueue();
}

// --- the timeline and the controls, shared by both screens -------------------------------------------
// One definition, drawn in the same place on both screens, so the two are one muscle memory.
function renderStrip() {
  const strip = el("strip");
  const row = clear(el("striprow"));
  const tag = TAG();
  const on = tag ? selectedSet(tag) : new Map();
  strip.hidden = !tag || !tag.sources.length || !!making || !!blockedBy(route.anim);
  if (strip.hidden) return;
  tag.sources.forEach((p, i) => {
    const n = on.get(i) || 0;
    const cell = h("div", { class: "th checker" }, pic(imgUrl(p, FRAME_W)));
    const item = h("button", {
      id: "fr" + i, class: "fr" + (n ? " on" : "") + (i === PLAY.at ? " at" : ""),
      title: "frame " + (i + 1) + (n ? " · selected" : " · not selected") + " — click to pause here, " +
        "click the label to turn it " + (n ? "off" : "on"),
      onclick: () => { PLAY.at = i; if (PLAY.on) setPlaying(false); else render(); },
    }, cell, h("span", {
      class: "lbl" + (n > 1 ? " dupe" : ""), text: (i + 1) + (n > 1 ? " ×" + n : ""),
      onclick: (e) => { e.stopPropagation(); toggleFrame(i); },
    }));
    row.append(item);
  });
  markPlayhead();
}

function renderControls() {
  const box = clear(el("ctl"));
  const tag = TAG();
  box.hidden = !tag || !tag.sources.length || !!making || !!blockedBy(route.anim);
  if (box.hidden) return;
  box.append(h("button", { id: "play", text: PLAY.on ? "❚❚ pause" : "▶ play",
    onclick: () => setPlaying(!PLAY.on) }));
  box.append(h("button", { text: "◀ step", onclick: () => stepBy(-1) }));
  box.append(h("button", { text: "step ▶", onclick: () => stepBy(1) }));
  box.append(h("span", { class: "row sp", style: "gap:4px" },
    h("span", { class: "faint", text: "speed" }),
    [0.5, 1, 2].map((s) => h("button", {
      class: PLAY.speed === s ? "on" : "", text: s + "×",
      onclick: () => { PLAY.speed = s; PLAY.next = 0; renderControls(); },
    }))));
  const onN = selectedSet(tag).size;
  box.append(h("span", { class: "faint", text: tag.fps + "fps · " + onN + " of " +
    tag.sources.length + " frames on · space plays, ← → step, the number under a frame turns it on and off" }));
}

// --- the queue and the tray -------------------------------------------------------------------------
function drawQueue() {
  const live = JOBS.filter((j) => LIVE.includes(j.state));
  const head = live[0];
  el("queueline").textContent = head
    ? "▶ " + head.label + (head.elapsedMs ? " · " + Math.round(head.elapsedMs / 1000) + "s" : "") +
      (live.length > 1 ? " · " + (live.length - 1) + " waiting" : "")
    : "queue idle";
  const pop = el("queuepop");
  pop.hidden = !queueOpen;
  if (!queueOpen) return;
  clear(pop);
  if (!JOBS.length) pop.append(h("div", { class: "faint", text: "nothing has run recently." }));
  for (const j of JOBS) {
    const after = j.after ? JOBS.find((x) => x.id === j.after) : null;
    pop.append(h("div", { class: "job" },
      h("span", { class: "dot " + (j.state === "running" ? "run" : LIVE.includes(j.state) ? "gold"
        : j.error ? "grey" : "green") }),
      h("span", { class: "lbl", title: j.label + (after ? " — waits for " + after.label : ""),
        text: j.label + (after ? " ⟵ " + after.label : "") }),
      LIVE.includes(j.state) ? h("button", { text: "cancel", onclick: async () => {
        await fetch("/api/job/" + j.id + "/cancel?cid=" + route.cid, { method: "POST" });
        loadJobs();
      } }) : h("span", { class: "faint", text: j.error ? "failed" : j.state })));
  }
}

// The tray is the one thing on this page a person MUST see without going looking: a selection that
// collapses a duplicate parks a real edit here, and an edit only visible behind a panel nobody
// opens is an edit that was silently eaten.
function renderTray() {
  const n = ST ? ST.tray.length : 0;
  clear(el("traybadge")).append(document.createTextNode("tray"), h("span", { class: "n", text: String(n) }));
  const d = el("traydrawer");
  d.classList.toggle("open", trayOpen);
  if (!trayOpen) return;
  clear(d);
  d.append(h("div", { class: "row" }, h("h2", { text: "the tray · " + n + " orphaned edits" }),
    h("span", { class: "grow" }), h("button", { text: "close", onclick: () => { trayOpen = false; renderTray(); } })));
  if (!n) d.append(h("p", { class: "faint", text: "nothing has been orphaned. A deselected frame and a " +
    "re-picked clip both park their edits here." }));
  for (const e of ST.tray) {
    const tag = ST.tags.find((t) => t.name === e.tag);
    // The suggestion, pre-computed: the live cell of the same move whose source frame sits nearest
    // in the clip. `f_0041.png` is a TIME, and time is the only address that survives a re-pick.
    const time = (s) => { const m = /f_(\d+)\.png$/.exec(s || ""); return m ? parseInt(m[1], 10) : null; };
    const want = time(e.src);
    let best = null;
    if (tag && want !== null) {
      tag.cells.forEach((c, i) => {
        const t = time(c.src);
        if (t === null) return;
        if (best === null || Math.abs(t - want) < best.d) best = { i, d: Math.abs(t - want) };
      });
    }
    d.append(h("div", { class: "trayrow" },
      h("div", { class: "art checker" }, e.png ? pic(imgUrl(e.png, 112)) : h("span", { class: "faint", text: "—" })),
      h("div", { class: "grow" },
        h("div", { text: e.tag + " · " + (e.src || "").split("/").pop() }),
        h("div", { class: "faint", text: "seed " + e.seed + " · hold " + e.hold + " · nudge " +
          e.pivot_nudge.join(",") + (e.prompt ? " · its own prompt" : "") + " · " + e.why })),
      best ? h("button", { text: "put back on cell " + (best.i + 1), onclick: async () => {
        await goTo(route.cid, e.tag, route.screen);
        mutate("restore", { tag: e.tag, fid: e.fid, index: best.i }, "restore onto cell " + (best.i + 1));
      } }) : h("span", { class: "faint", text: "no live cell to land on" }),
      h("button", { text: "discard", onclick: () => mutate("forget", { tag: e.tag, fid: e.fid }, "discard " + e.fid) })));
  }
}

// --- creating things, the only two places work starts without a confirm ---------------------------------
function newCharacterForm() {
  const idIn = h("input", { type: "text", placeholder: "id, e.g. gnome" });
  const nameIn = h("input", { type: "text", placeholder: "display name" });
  const file = h("input", { type: "file", accept: "image/png,image/jpeg" });
  const trait = h("textarea", { rows: 4, placeholder: "one sentence on how they move" });
  const btn = h("button", { text: "create — this queues the plate and an idle clip" });
  btn.onclick = async () => {
    const cid = idIn.value.trim().toLowerCase();
    if (!cid || !file.files[0] || !nameIn.value.trim() || !trait.value.trim()) {
      toast("an id, a name, an image and one sentence", true); return;
    }
    if (!AGENT) { toast("the wilson agent is not known yet — an image cannot be staged without it", true); return; }
    btn.disabled = true;
    try {
      if (!DEFAULTS) DEFAULTS = await (await fetch(AGENT + "/defaults")).json();
      const up = await fetch(AGENT + "/upload", {
        method: "POST", headers: { "Content-Type": "image/png" }, body: file.files[0],
      });
      const staged = await up.json();
      if (staged.error) throw new Error(staged.error);
      const moves = Object.entries(DEFAULTS.moves).map(([name, m]) => ({ name, ...m }));
      const j = await api("character", {
        cid, name: nameIn.value.trim(), trait: trait.value.trim(), source: staged.path,
        cell: DEFAULTS.cell, pivot: DEFAULTS.pivot, build: DEFAULTS.build, moves,
      });
      ROSTER = j.characters;
      making = null;
      toast("the plate and the first clip are queued — " + j.queued.length + " jobs");
      await goTo(cid, null, "select");
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  };
  return h("form", { class: "mk card", onsubmit: (e) => e.preventDefault() },
    h("h2", { text: "a new character" }),
    h("span", { class: "faint", text: "the image is both the avatar and the seed image." }),
    idIn, nameIn, file,
    h("label", { class: "dim", text: "how they move — one sentence, used when composing every prompt" }),
    trait, h("div", { class: "row" }, btn, h("button", { text: "cancel", onclick: () => { making = null; render(); } })));
}

// A new animation: name it, write its prompt, press save — and saving queues the video, because
// creating a thing is the intent to render it.
function newMoveForm() {
  const from = TAG() || ST.tags[0];
  const nameIn = h("input", { type: "text", placeholder: "name, e.g. wave" });
  const recipe = h("textarea", { rows: 6, placeholder: "what the character does, in one paragraph" });
  const height = h("select", {}, [
    ["stride", "stride — a walk or a run: normalise drift, keep the rise and fall"],
    ["fixed", "fixed — an idle or a wave: he must not change height at all"],
    ["changes", "changes — a jump or a crouch: the height IS the animation"],
  ].map(([v, t]) => h("option", { value: v, text: t })));
  // Everything else is copied from the move this one is made from, because the DO needs all of it
  // and none of it is what somebody making a wave is thinking about.
  const clipStep = recs("clip", from.name)[0];
  const picksStep = recs("picks", from.name)[0];
  const btn = h("button", { text: "save — this queues the clip" });
  btn.onclick = async () => {
    const tag = nameIn.value.trim().toLowerCase();
    if (!tag || !recipe.value.trim()) { toast("a name and a prompt", true); return; }
    btn.disabled = true;
    try {
      const j = await api("newmove", {
        cid: route.cid, tag, from: from.name, height: height.value, fps: from.fps,
        loop: from.loop, hold_key: from.hold_key, recipe_text: recipe.value.trim(),
        cells: picksStep ? picksStep.params.cells : 8,
        cyclic: clipStep ? !!clipStep.params.cyclic : true,
      });
      making = null;
      toast(tag + " created — " + (j.queued ? "its clip is queued" : "the queue is full, so nothing is running yet"));
      route.anim = tag;
      await reload();
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  };
  return h("form", { class: "mk card", onsubmit: (e) => e.preventDefault() },
    h("h2", { text: "a new animation for " + (ST.name || ST.character) }),
    nameIn,
    h("label", { class: "dim", text: "its prompt" }), recipe,
    h("label", { class: "dim", text: "does the height change?" }), height,
    h("span", { class: "faint", text: "fps, cell count and looping are copied from " + from.name + "." }),
    h("div", { class: "row" }, btn, h("button", { text: "cancel", onclick: () => { making = null; render(); } })));
}

// --- routing ---------------------------------------------------------------------------------------
// Two screens per animation, and both are links: /c/:cid/a/:anim/:screen. The worker answers every
// /c/… path with this one page.
function parse(path) {
  const m = /^\/c\/([a-z0-9-]+)(?:\/a\/([a-z0-9-]+)(?:\/(select|enhance))?)?$/.exec(path);
  return m ? { cid: m[1], anim: m[2] || null, screen: m[3] || "select" } : null;
}
const href = (cid, anim, screen) => "/c/" + cid + (anim ? "/a/" + anim + "/" + screen : "");

async function goTo(cid, anim, screen, replace) {
  const sameChar = ST && cid === route.cid;
  const sameMove = sameChar && anim === route.anim;
  making = null;
  confirming = null;
  treeOpen = false;
  // The card is one animation's, and so is the half-typed recipe in it. Carrying either onto the
  // next move would offer somebody a save button that writes one move's words onto another's.
  if (!sameMove) { animOpen = false; animDraft = null; }
  el("tree").classList.remove("open");
  route = { cid, anim, screen: SCREENS.includes(screen) ? screen : "select" };
  if (!sameChar) { JOBS = []; dropArt(); }
  if (!sameChar || !ST) {
    try { await openCharacter(cid); } catch (e) { toast(e.message, true); ST = null; }
  } else if (anim && !ST.tags.some((t) => t.name === anim)) {
    route.anim = ST.tags[0].name;
  } else if (!anim) {
    route.anim = ST.tags.length ? ST.tags[0].name : null;
  }
  if (!sameMove) { PLAY.at = 0; PLAY.cellAt = 0; PLAY.on = true; }
  clampPlay();
  const path = href(route.cid, route.anim, route.screen);
  if (path !== location.pathname) history[replace ? "replaceState" : "pushState"]({}, "", path);
  render();
  await loadTree();
  renderTree();
  if (!poll) poll = setInterval(loadJobs, 2000);
  loadJobs();
}

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === " ") { setPlaying(!PLAY.on); e.preventDefault(); }
  if (e.key === "ArrowRight") { stepBy(1); e.preventDefault(); }
  if (e.key === "ArrowLeft") { stepBy(-1); e.preventDefault(); }
  if (e.key === "Escape") {
    confirming = null; trayOpen = false; queueOpen = false; making = null;
    render(); drawQueue();
  }
});
window.addEventListener("popstate", () => {
  const w = parse(location.pathname);
  if (w) goTo(w.cid, w.anim, w.screen, true);
});

async function boot() {
  requestAnimationFrame(tick);
  const want = parse(location.pathname);
  try {
    // One read before anything is drawn: it names the agent, the roster and — with no cid — the
    // first character, which is who the page opens on when the URL names nobody. A URL naming a
    // character this fleet does not have falls back to that one rather than to an error page.
    let first;
    try { first = await loadState(want ? want.cid : null); }
    catch (e) { if (!want) throw e; first = await loadState(null); }
    TREE.set(first.character, first);
    const cid = want && want.cid === first.character ? want.cid : first.character;
    await goTo(cid, cid === (want && want.cid) ? want.anim : null,
      cid === (want && want.cid) ? want.screen : "select", true);
  } catch (e) {
    // A fleet with no character at all still has to offer the one thing that fixes that.
    toast(e.message, true);
    const box = clear(el("stage"));
    box.append(h("div", { class: "note" }, e.message));
    box.append(newCharacterForm());
  }
}
boot();
</script>
