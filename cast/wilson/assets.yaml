    created: 2026-08-06
    source: nano-banana-pro, text only, no character reference
    notes: >
      The fence here is deliberately an ordinary inanimate fence — no hat, no
      eyes, no arms. It is the control plate: it teaches the style LoRA what a
      picket fence looks like when it is NOT Wilson, which is the distinction
      most at risk of collapsing for this particular character.
