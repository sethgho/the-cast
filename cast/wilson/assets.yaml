  # ---- Style plates: deliberately character-free ---------------------------
  # These exist so the style LoRA has something to learn the ink, halftone and
  # paper from that is NOT a cast member. Leave them out and the style LoRA
  # memorises the leads, and then every character drifts toward whoever was in
  # the dataset most. Generated independently rather than chained: they have no
  # shared subject to hold still, and a style dataset wants varied composition.

  - file: assets/plates/empty-stage.png
    kind: style-plate
    tags: [stage, curtain, footlights, character-free, wide]
    caption: An empty vaudeville stage, bare boards, curtain drawn back at both sides, footlights along the front edge, nobody present
    created: 2026-08-06
    source: nano-banana-pro, text only, no character reference

  - file: assets/plates/backstage-wings.png
