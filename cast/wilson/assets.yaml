# Wilson's assets. Published at https://cast.sethgholson.com/wilson/assets.json
#
# Only what a human knows goes in this file. build-site.py measures size,
# dimensions and sha256 from the bytes on disk and composes the published record
# against schema/asset.schema.json; a bad entry fails the build.
#
# CAPTIONS DESCRIBE POSE, FRAMING AND BACKGROUND ONLY — never the style. The rule
# inverts normal captioning intuition: what you caption stays editable, what you
# omit gets baked into the trigger token. The house style is exactly the thing we
# want baked in, so it is never named here. The background IS named, because a
# background that cannot be changed is a useless LoRA.
#
# Provenance: every character render descends from one of three base plates by a
# single nano-banana-pro edit, never independent generation. Independent
# generation re-stages the shot (RMSE 85.3 against a base vs 39.3 for a chained
# edit); measured on this set, the edits came back at 16.7-38.5.

assets:

  # ---- Pose library: transparent cutouts for compositing -------------------
  # Rendered on flat mid-grey #808080 — never green, because diffusion bleeds
  # backdrop colour and there is no despill node in this stack — then matted
  # with BiRefNet. All eight share one base plate's camera and figure scale, so
  # they drop into a layout interchangeably.

