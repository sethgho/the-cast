  # ---- Expression close-ups ------------------------------------------------
  # Wilson has no mouth. Everything he does with a face happens in two cartoon
  # eyes floating in the band of shadow under the hat brim, plus the angle of the
  # hat itself. These crop to that band. A separate base plate from the full-body
  # chains, because re-cropping inside an edit is a re-frame and the edit prompt
  # forbids exactly that.

