- file: assets/training/gray-3q-left.png
  kind: training-set
  tags:
  - front
  - full-body
  - neutral
  - plain-background
  - standing
  caption: Seth standing at rest, arms at his sides, front view turned only very slightly, full body,
    on a plain flat background
  created: '2026-08-07'
  source: nano-banana-pro chained edit from the corrected mid-grey base plate
  notes: This is NOT a three-quarter view and the caption no longer claims one. A true 45-degree turn
    failed three times for Seth on 2026-08-07 and twice for Wilson before that. Attempt 2 did produce
    a real turn but regressed the proportions back to the lanky build this whole pass exists to fix, because
    it was conditioned on the profile render — profile renders are drawn lankier. Attempts 1 and 3 kept
    the proportions and stayed frontal, including one that built the turn from foot direction upward and
    named the far shoulder, the phrasing that has worked elsewhere. Captioning a frontal image as three-quarter
    would poison the token in LoRA training, which is worse than not having the view at all, so the caption
    describes what is actually drawn. gray-side-left carries the real off-axis information for this character.
