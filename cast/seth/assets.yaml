# Seth's assets. Published at https://cast.sethgholson.com/seth/assets.json
#
# Only what a human knows goes here. build-site.py measures size, dimensions and
# sha256 from the bytes on disk and validates the composed record against
# schema/asset.schema.json; a bad entry fails the build.
#
# CAPTIONS DESCRIBE POSE, FRAMING AND BACKGROUND ONLY — never the style. What you
# caption stays editable; what you omit gets baked into the trigger token, and the
# house style is exactly what we want baked in.
#
# Provenance: every render is ONE nano-banana-pro edit from one of three base
# plates, never independent generation — independent generation re-stages the shot
# (RMSE 85.3 vs 39.3 for a chained edit).

assets:
- file: assets/poses/standing-neutral.png
  kind: pose
  tags:
  - front
  - full-body
  - neutral
  - standing
  - transparent
  caption: Seth standing at rest, arms at his sides, front view, full body
  created: '2026-08-07'
  source: nano-banana-pro from portrait.png + headshot.png + tokens + an explicit caricature proportion
    clause; base plate of the mid-grey chain
  notes: 'Regenerated 2026-08-07 to fix style drift, and the whole pose library re-chained off this plate.
    The original base was conditioned on sheet.png, and a turnaround is drawn in the model-sheet idiom
    — near seven heads tall with a small face — while headshot.png and portrait.png are caricature at
    about five and a half heads. Every pose inherited the sheet''s build and the chain carried it through
    all eight. Two changes fixed it: condition on portrait + headshot instead of the sheet, and state
    the proportions explicitly (large rounded head about one fifth of standing height, chunky limbs, "he
    is not a realistically proportioned man"). The reference swap alone recovered most of it; the proportion
    clause was the clear winner on review. DO NOT condition full-body poses on sheet.png — the sheet is
    still correct as identity reference, but it is the wrong style reference for a figure.'
