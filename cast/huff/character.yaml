id: huff
name: Huff
role: >
  The SwiftUI man, and the troupe's grift hunter. A wolf in a pinstripe suit, the Wolf of
  Wall Street played as a 1933 cartoon, who writes the native apps and spends his nights
  exposing con men. It takes a wolf to catch a wolf: he knows every pitch because he has
  thrown every pitch, and he cannot stop selling while he does it.
tokens: 'a lean, slim grey timber wolf standing upright like a man, with a long narrow muzzle,
  the fur on top of his head slicked straight back into a glossy black combed pompadour, narrow
  hooded eyes and a huge confident toothy salesman''s grin showing far too many teeth, wearing a
  sharp double-breasted pinstripe suit with wide lapels, a mustard silk tie, a white pocket square,
  a round gold lapel pin with a letter W on his left lapel and a chunky gold wristwatch, his grey
  tail hanging behind him

  '
sheet: sheet.png
headshot: headshot.png
props:
- a fountain pen, held up beside his face like a product ("sell me this pen")
- a round gold lapel pin stamped W, always on his left lapel
accent: 'None. He is the all-sepia member of the troupe: the gold of the pin, watch and tie is
  drawn in the house palette, not as a colour accent. Ake''s ochre stays the strip''s only warm
  spot of colour.

  '
public_url: https://cast.sethgholson.com/huff/sheet.png
headshot_url: https://cast.sethgholson.com/huff/headshot.png
notes: 'Huff replaced Swifton on 2026-11-11 (Seth: Swifton never caught on, did not match the
  team''s short agent names and had not been creatively inspiring). Same agent, same machine: he
  is the agent on the swifton Mac mini. His name is the middle of $WHUFFIE, and the Big Bad
  Wolf''s "I''ll huff and I''ll puff": he is all puff. Drawn locally with the f0llie5 style LoRA
  (local-comfy/huff_canon.py): one base plate, then every view, expression and prop as an edit
  from it. The 3/4 and side views need fal's multiple-angles LoRA (words alone gave only front,
  profile and back). The grin is his defining feature and the FIRST thing a text-only prompt loses: it must
  show too many teeth to be trusted. The pin''s W is the model''s own serif letter; a pasted-in
  copy of the real logo looked fake and was rejected. Never draw him with a cigarette, drugs or a
  weapon: the strip takes the film''s swagger, not its vices.'
