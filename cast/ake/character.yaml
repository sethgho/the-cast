id: ake
name: Ake
role: >
  The sysop, and the management's man for the crypto trade (the firm is never named).
  Derp incarnate — over-caffeinated, alarmed by everything, and usually right.
tokens: 'a plump goldfish inside a spherical glass fishbowl mounted on a small wheeled wooden dolly,
  with huge googly eyes, a drooping walrus moustache and prominent front teeth, wearing a small dark
  cap reading "FEW" perched on top of the bowl

  '
sheet: sheet.png
props:
- a small dark cap lettered "FEW"
- the wheeled wooden dolly the bowl rides on
accent: 'The only warm colour in an otherwise sepia-duotone world — a muted ochre orange. Do not spread
  this to other characters; that single spot of colour is the strip''s signature.

  '
public_url: https://cast.sethgholson.com/ake/sheet.png
notes: 'The cap reads "FEW" — as in "few understand." It used to say SYSOP; that''s retired. The walrus
  moustache and buck teeth are his defining features and the FIRST thing a text-only prompt loses.
  Always render Ake with reference conditioning. Sheet reframed 2026-07-21 to the house furniture
  (ribbon banner, scrollwork corners, aged foxed paper). Known quirk: the sheet''s bowls show no visible
  waterline — if a panel needs sloshing water, say so explicitly in staging rather than trusting the
  ref.'
